<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>04 · 腕表 · ORIN</title>
<script src="../lib/core.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 04 线条动画 · 行业示例：腕表 =====
   Hair-thin gold lines draw a mechanical movement: main plate, bridges, gear train, jewels, a balance wheel that
   starts to beat. A light sweep crosses the metal, the movement recedes behind a dial that draws itself, the hands
   swing to 10:10, and the name settles in. Canvas 2D, every line computed. */
const { E, clamp, inv, lerp } = Reel;
const C = Reel.cfg({ brand: 'ORIN', sub: '机械之美 · 分秒之间', small: 'AUTOMATIC · 42 MM · HAND-FINISHED' });
const stage = Reel.makeStage('#070b17');
const { ctx, begin: begin0 } = Reel.canvas2d(stage);
let VIEW = { z: 1, fx: 960, fy: 540 };
function begin() { begin0(); ctx.fillStyle = '#04060d'; ctx.fillRect(0, 0, 1920, 1080); ctx.translate(960, 540); ctx.scale(VIEW.z, VIEW.z); ctx.translate(-VIEW.fx, -VIEW.fy); }
const CX = 1220, CY = 540, RW = 380;
const GOLD = (a) => `rgba(236,201,128,${a})`, GOLD2 = (a) => `rgba(255,232,180,${a})`;
// stroke a path partially: build(ctx) must trace the path; L = its length (approx)
function draw(build, L, prog, w, alpha, glow = true) {
  if (prog <= 0) return;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.setLineDash([L * Math.min(prog, 1), L + 10]);
  if (glow) { ctx.shadowColor = GOLD(0.6 * alpha); ctx.shadowBlur = 14; }
  ctx.strokeStyle = GOLD(alpha); ctx.lineWidth = w; ctx.beginPath(); build(); ctx.stroke();
  ctx.shadowBlur = 0; ctx.strokeStyle = GOLD2(alpha * 0.8); ctx.lineWidth = w * 0.45; ctx.beginPath(); build(); ctx.stroke();
  ctx.restore();
}
const circle = (x, y, r, a0 = -Math.PI / 2) => () => ctx.arc(x, y, r, a0, a0 + Math.PI * 2);
function gear(x, y, r, n, th, rot) {
  return () => { for (let i = 0; i <= n; i++) { const a = rot + i / n * Math.PI * 2, s = Math.PI / n;
    const p = (ang, rad) => [x + Math.cos(ang) * rad, y + Math.sin(ang) * rad];
    const pts = [p(a - s * 0.5, r), p(a - s * 0.3, r + th), p(a + s * 0.3, r + th), p(a + s * 0.5, r), p(a + s * 1.5, r)];
    pts.forEach((q, k) => (i === 0 && k === 0 ? ctx.moveTo(q[0], q[1]) : ctx.lineTo(q[0], q[1]))); } };
}
function spokes(x, y, r0, r1, n, rot) { return () => { for (let i = 0; i < n; i++) { const a = rot + i / n * Math.PI * 2; ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0); ctx.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); } }; }
function spiral(x, y, r0, r1, turns, rot) { return () => { const N = 160; for (let i = 0; i <= N; i++) { const u = i / N, a = rot + u * turns * Math.PI * 2, r = lerp(r0, r1, u); i ? ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } }; }
// movement layout (relative to the case centre)
const GEARS = [
  { x: 0, y: 0, r: 120, n: 60, th: 9, sp: 0.18, t0: 1.2 },          // centre wheel
  { x: 165, y: -110, r: 62, n: 32, th: 8, sp: -0.42, t0: 1.45 },     // third wheel
  { x: 200, y: 60, r: 52, n: 28, th: 7, sp: 0.6, t0: 1.6 },          // fourth wheel
  { x: -170, y: 120, r: 80, n: 40, th: 8, sp: -0.12, t0: 1.75 },     // barrel
];
const BAL = { x: -150, y: -150, r: 74 };
const JEWELS = [[0, 0], [165, -110], [200, 60], [-150, -150], [-170, 120]];
function scene(t) {
  begin();
  const g = ctx.createRadialGradient(CX, CY, 50, CX, CY, 1300); g.addColorStop(0, '#111a33'); g.addColorStop(1, '#04060e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1920, 1080);
  // faint drafting grid
  ctx.strokeStyle = 'rgba(236,201,128,0.045)'; ctx.lineWidth = 1;
  for (let x = 0; x <= 1920; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1080); ctx.stroke(); }
  for (let y = 0; y <= 1080; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke(); }
  // construction lines sweep in
  const cl = E.outCubic(inv(0.1, 1.1, t)), clFade = 1 - 0.75 * E.inOutSine(inv(5.5, 6.8, t));
  ctx.strokeStyle = GOLD(0.18 * clFade); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(CX - 620 * cl, CY); ctx.lineTo(CX + 620 * cl, CY); ctx.moveTo(CX, CY - 520 * cl); ctx.lineTo(CX, CY + 520 * cl); ctx.stroke();
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2 + 0.3 * (1 - cl); ctx.beginPath(); ctx.moveTo(CX + Math.cos(a) * 60, CY + Math.sin(a) * 60); ctx.lineTo(CX + Math.cos(a) * (60 + 520 * cl), CY + Math.sin(a) * (60 + 520 * cl)); ctx.stroke(); }
  // the movement recedes once the dial arrives
  const mv = 1 - 0.68 * E.inOutSine(inv(5.8, 7.0, t));
  const run = (t0) => Math.max(0, t - 2.4);                     // gears start turning at 2.4s
  draw(circle(CX, CY, RW), 2 * Math.PI * RW, E.inOutSine(inv(0.4, 1.3, t)), 2.2, 0.9 * mv);
  draw(circle(CX, CY, RW - 26), 2 * Math.PI * (RW - 26), E.inOutSine(inv(0.55, 1.4, t)), 1.2, 0.5 * mv);
  // bridges: arcs + straight plates
  const br = (pts, t0) => draw(() => { pts.forEach((p, i) => (i ? ctx.lineTo(CX + p[0], CY + p[1]) : ctx.moveTo(CX + p[0], CY + p[1]))); ctx.closePath(); }, 1600, E.inOutSine(inv(t0, t0 + 0.8, t)), 1.4, 0.55 * mv);
  // Geneva stripes, clipped to the plate
  { const gs = E.inOutSine(inv(0.9, 1.8, t)); if (gs > 0) { ctx.save(); ctx.beginPath(); ctx.arc(CX, CY, RW - 30, 0, Math.PI * 2); ctx.clip(); ctx.strokeStyle = GOLD(0.07 * mv); ctx.lineWidth = 1;
    for (let k = -14; k <= 14; k++) { const o = k * 28; ctx.beginPath(); ctx.moveTo(CX - 400 + o, CY - 400 * gs); ctx.lineTo(CX + 400 + o - 800, CY + 400 * gs); ctx.stroke(); } ctx.restore(); } }
  // bridges: a sweeping train bridge and the balance cock, drawn as long arcs with screws
  draw(() => { ctx.arc(CX + 40, CY - 20, 255, -2.6, 0.55); }, 255 * 3.2, E.inOutSine(inv(1.0, 1.8, t)), 1.4, 0.6 * mv);
  draw(() => { ctx.arc(CX + 40, CY - 20, 215, -2.5, 0.45); }, 215 * 3, E.inOutSine(inv(1.1, 1.9, t)), 1.0, 0.4 * mv);
  draw(() => { ctx.arc(CX + BAL.x, CY + BAL.y, BAL.r + 26, 0.9, 4.4); }, (BAL.r + 26) * 3.5, E.inOutSine(inv(1.3, 2.0, t)), 1.4, 0.6 * mv);
  [[60, -270], [290, 10], [-250, -60], [-90, 250], [250, 200]].forEach(([x, y], i) => { const a2 = E.outBack(clamp(inv(2.0 + i * 0.08, 2.3 + i * 0.08, t)), 2) * mv; if (a2 <= 0) return;
    ctx.save(); ctx.strokeStyle = GOLD(0.8 * Math.min(a2, 1)); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(CX + x, CY + y, 11 * a2, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(CX + x - 7, CY + y + 3); ctx.lineTo(CX + x + 7, CY + y - 3); ctx.stroke(); ctx.restore(); });
  GEARS.forEach((G) => {
    const rot = run() * G.sp * Math.PI * 2 * 0.6;
    draw(gear(CX + G.x, CY + G.y, G.r, G.n, G.th, rot), 2 * Math.PI * G.r + 2.6 * G.n * G.th, E.inOutSine(inv(G.t0, G.t0 + 0.9, t)), 1.6, 0.95 * mv);
    draw(spokes(CX + G.x, CY + G.y, G.r * 0.22, G.r * 0.82, 5, rot), G.r * 4, E.inOutSine(inv(G.t0 + 0.4, G.t0 + 1.0, t)), 1.4, 0.8 * mv, false);
    draw(circle(CX + G.x, CY + G.y, G.r * 0.22), 2 * Math.PI * G.r * 0.22, E.inOutSine(inv(G.t0 + 0.3, G.t0 + 0.8, t)), 1.4, 0.8 * mv, false);
  });
  // balance wheel + hairspring, beating at 3 Hz
  const beat = t > 2.4 ? Math.sin((t - 2.4) * Math.PI * 2 * 3) * 1.1 * E.outCubic(inv(2.4, 2.9, t)) : 0;
  draw(circle(CX + BAL.x, CY + BAL.y, BAL.r, beat), 2 * Math.PI * BAL.r, E.inOutSine(inv(1.9, 2.5, t)), 2, 0.95 * mv);
  draw(spokes(CX + BAL.x, CY + BAL.y, 8, BAL.r, 3, beat), BAL.r * 3, E.inOutSine(inv(2.1, 2.5, t)), 1.6, 0.9 * mv, false);
  draw(spiral(CX + BAL.x, CY + BAL.y, 10, BAL.r * 0.62, 7, beat * 0.4), 1400, E.inOutSine(inv(2.0, 2.6, t)), 0.9, 0.7 * mv, false);
  // ruby jewels
  JEWELS.forEach(([x, y], i) => { const a = E.outBack(clamp(inv(2.6 + i * 0.06, 2.9 + i * 0.06, t)), 2) * mv; if (a <= 0) return;
    ctx.save(); ctx.shadowColor = 'rgba(255,60,80,0.9)'; ctx.shadowBlur = 18; ctx.fillStyle = `rgba(214,40,70,${0.9 * Math.min(a, 1)})`; ctx.beginPath(); ctx.arc(CX + x, CY + y, 7 * a, 0, Math.PI * 2); ctx.fill(); ctx.restore(); });
  // light sweep across the movement
  const sw = inv(3.4, 5.0, t);
  if (sw > 0 && sw < 1) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; const sx = lerp(CX - 600, CX + 600, sw); const lg = ctx.createLinearGradient(sx - 160, 0, sx + 160, 0); lg.addColorStop(0, 'rgba(255,230,170,0)'); lg.addColorStop(0.5, 'rgba(255,230,170,0.16)'); lg.addColorStop(1, 'rgba(255,230,170,0)'); ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(CX, CY, RW, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
  // the dial draws itself over the movement
  const da = E.inOutSine(inv(6.0, 6.9, t));
  if (da > 0) {
    ctx.save(); ctx.beginPath(); ctx.arc(CX, CY, RW - 30, 0, Math.PI * 2); ctx.fillStyle = `rgba(9,13,28,${0.55 * da})`; ctx.fill(); ctx.restore();
    draw(circle(CX, CY, RW - 40), 2 * Math.PI * (RW - 40), da, 1.6, 0.9);
    for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 2 - Math.PI / 2, big = i % 5 === 0, r0 = RW - (big ? 92 : 64), r1 = RW - 52;
      const pr = clamp((da * 60 - i) / 3);
      draw(() => { ctx.moveTo(CX + Math.cos(a) * r0, CY + Math.sin(a) * r0); ctx.lineTo(CX + Math.cos(a) * r1, CY + Math.sin(a) * r1); }, r1 - r0, pr, big ? 4 : 1.2, big ? 1 : 0.6, big); }
    // hands swing to 10:10
    const hp = E.outBack(clamp(inv(6.8, 7.8, t)), 1.2);
    const hA = lerp(-Math.PI / 2 + 0.6, -Math.PI / 2 + (10 + 10 / 60) / 12 * Math.PI * 2, hp), mA = lerp(-Math.PI / 2 - 1.2, -Math.PI / 2 + 10 / 60 * Math.PI * 2, hp);
    const hand = (ang, len, w) => draw(() => { ctx.moveTo(CX - Math.cos(ang) * 30, CY - Math.sin(ang) * 30); ctx.lineTo(CX + Math.cos(ang) * len, CY + Math.sin(ang) * len); }, len + 30, clamp(inv(6.6, 7.0, t)), w, 1);
    hand(hA, 170, 7); hand(mA, 260, 5);
    if (t > 7.2) { const s = Math.floor((t - 7.2) * 1) / 60 * Math.PI * 2 - Math.PI / 2 + 0.9; ctx.save(); ctx.strokeStyle = 'rgba(214,60,80,0.95)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(CX - Math.cos(s) * 50, CY - Math.sin(s) * 50); ctx.lineTo(CX + Math.cos(s) * 300, CY + Math.sin(s) * 300); ctx.stroke(); ctx.restore(); }
    ctx.save(); ctx.fillStyle = GOLD(da); ctx.beginPath(); ctx.arc(CX, CY, 10, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    ctx.save(); ctx.globalAlpha = E.outCubic(inv(7.0, 7.6, t)); ctx.font = '600 30px "Noto Serif CJK SC"'; ctx.fillStyle = GOLD(0.9); ctx.textAlign = 'center'; if ('letterSpacing' in ctx) ctx.letterSpacing = '10px'; ctx.fillText(C.brand, CX + 5, CY - 140); ctx.restore();
  }
  // title
  const ta = E.outCubic(inv(7.6, 8.6, t));
  if (ta > 0) {
    ctx.save(); ctx.globalAlpha = ta; ctx.translate(0, (1 - ta) * 16);
    ctx.font = '600 150px "Noto Serif CJK SC"'; ctx.fillStyle = GOLD2(1); if ('letterSpacing' in ctx) ctx.letterSpacing = '26px';
    ctx.shadowColor = GOLD(0.5); ctx.shadowBlur = 30; ctx.fillText(C.brand, 150, 520); ctx.shadowBlur = 0;
    if ('letterSpacing' in ctx) ctx.letterSpacing = '10px';
    ctx.font = '500 40px "Noto Serif CJK SC"'; ctx.fillStyle = GOLD(0.95); ctx.fillText(C.sub, 156, 610);
    ctx.font = '500 18px Inter'; ctx.fillStyle = GOLD(0.6); if ('letterSpacing' in ctx) ctx.letterSpacing = '6px'; ctx.fillText(C.small, 158, 670);
    ctx.restore();
    ctx.save(); ctx.strokeStyle = GOLD(0.7 * ta); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(156, 560); ctx.lineTo(156 + 420 * E.outCubic(inv(7.9, 8.8, t)), 560); ctx.stroke(); ctx.restore();
  }
}
Reel.scene({
  duration: 15, fps: 30,
  fonts: ['600 150px "Noto Serif CJK SC"', '500 40px "Noto Serif CJK SC"', '500 18px Inter'],
  cues: [{"t": 0.1, "sfx": "swell", "gain": 0.5}, {"t": 0.4, "sfx": "pencil", "gain": 0.4}, {"t": 2.0, "sfx": "shutter", "gain": 0.4}, {"t": 2.1, "sfx": "pencil", "gain": 0.35}, {"t": 3.6, "sfx": "shutter", "gain": 0.4}, {"t": 3.7, "sfx": "ticks", "gain": 0.6}, {"t": 5.2, "sfx": "whoosh", "gain": 0.4}, {"t": 8.6, "sfx": "whoosh_up", "gain": 0.4}, {"t": 10.0, "sfx": "click", "gain": 0.6}, {"t": 10.3, "sfx": "ticks", "gain": 0.4}, {"t": 11.4, "sfx": "chime", "gain": 0.6}],
  render(t) {
    const CT = [[0, 0], [5.2, 3.4], [9.0, 6.0], [15, 10.0]];
    let ct = 0; for (let k = 1; k < CT.length; k++) if (t <= CT[k][0]) { ct = lerp(CT[k - 1][1], CT[k][1], (t - CT[k - 1][0]) / (CT[k][0] - CT[k - 1][0])); break; }
    // three macro shots (cuts), each with a rack focus, then pull back
    const SH = [[0, 2.0, CX - RW * 0.62, CY - RW * 0.55, 3.0], [2.0, 3.6, CX + 120, CY - 70, 3.4], [3.6, 5.2, CX + BAL.x, CY + BAL.y, 3.8]];
    let blur = 0;
    if (t < 5.2) { const [a, b, fx, fy, z] = SH.find((q) => t < q[1]); const u = (t - a) / (b - a); VIEW = { z: z * (1 + 0.08 * u), fx: fx + 20 * u, fy: fy - 10 * u }; blur = Math.max(1 - (t - a) / 0.35, 0) * 9 + Math.max((t - b + 0.18) / 0.18, 0) * 4; }
    else { const u = E.inOutCubic(inv(5.2, 6.6, t)); VIEW = { z: lerp(3.8, 1, u), fx: lerp(CX + BAL.x, 960, u), fy: lerp(CY + BAL.y, 540, u) }; blur = 0; }
    ctx.filter = blur > 0.2 ? `blur(${blur * Reel.RS}px)` : 'none';
    scene(ct);
    ctx.filter = 'none';
  },
});
</script></body></html>
