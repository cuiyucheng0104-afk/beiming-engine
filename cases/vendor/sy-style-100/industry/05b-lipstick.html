<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>05 · 美妆 · 绯 FEI 口红</title>
<script src="../lib/core.js"></script><script src="../lib/gl.js"></script><script src="../lib/rm.js"></script>
<style>
  #cap{position:absolute;left:150px;top:330px;color:#f7e3d0;font-family:'Noto Serif CJK SC';white-space:nowrap}
  #cap .b{font-weight:700;font-size:150px;letter-spacing:.08em;line-height:1}
  #cap .b span{font:500 54px 'Noto Serif CJK SC';letter-spacing:.4em;margin-left:26px;vertical-align:middle;color:#e9b98f}
  #cap .s{font-weight:500;font-size:38px;letter-spacing:.3em;margin-top:34px;color:rgba(247,227,208,.9)}
  #cap .p{margin-top:120px;font:500 18px Inter;letter-spacing:.55em;color:rgba(233,185,143,.65)}
</style>
</head><body><div id="stage"></div>
<script>
/* ===== 05 · 3D 渲染 · 行业示例：美妆（口红）=====
   A gold lipstick on black acrylic. The cap lifts off and lies down beside it, the bullet twists up out of the
   sleeve - velvet red with a soft sheen - and a creamy swatch draws itself across the surface. Raymarched:
   brushed gold, velvet, glossy reflective floor, strip lights. */
const { E, clamp, inv, lerp } = Reel;
const stage = Reel.makeStage('#160608');
Reel.ownJitter = true;
const C = Reel.cfg({ brand: '绯', en: 'FEI', line: '丝绒雾面 · 一抹显白', price: 'VELVET MATTE LIPSTICK  ·  #520' });
const rm = Reel.RM(stage, {
  bloom: 0.22, th: 1.1, expo: 1.0, vig: 0.45, grain: 0.02, ca: 0.3, contrast: 1.08, sat: 1.05, bands: 10,
  uniforms: `
uniform vec4 uCap;           // cap position + roll angle about z
uniform vec2 uBul;           // bullet rise, twist
uniform float uSw;           // swatch progress
uniform vec3 uRo, uTa; uniform float uFade;`,
  scene: `
const vec3 LK = normalize(vec3(.55,.8,.45));
mat3 rotYm(float a){ float c=cos(a), s=sin(a); return mat3(c,0.,-s, 0.,1.,0., s,0.,c); }
float sdCyl(vec3 p, float r, float y0, float y1){ vec2 d = vec2(length(p.xz) - r, abs(p.y - (y0+y1)*.5) - (y1-y0)*.5); return min(max(d.x,d.y),0.) + length(max(d,0.)); }
float sdCylR(vec3 p, float r, float y0, float y1, float rr){ vec2 d = vec2(length(p.xz) - r + rr, abs(p.y - (y0+y1)*.5) - (y1-y0)*.5 + rr); return min(max(d.x,d.y),0.) + length(max(d,0.)) - rr; }
// materials: 1 gold, 2 velvet red, 3 floor, 4 inner sleeve (darker gold)
vec2 mapO(vec3 p){
  vec2 r = vec2(1e3, 0.);
  float tube = sdCylR(p, .095, 0., .23, .006);
  tube = min(tube, sdCylR(p, .099, .2, .232, .003));                         // a polished collar
  if (tube < r.x) r = vec2(tube, 1.);
  float rise = uBul.x;
  float sl = sdCylR(p, .084, .2, .23 + rise*.6, .004);
  if (sl < r.x) r = vec2(sl, 4.);
  vec3 q = rotYm(uBul.y) * p;
  float top = .23 + .17 + rise;
  float bul = sdCylR(q, .07, .2, top, .01);
  bul = max(bul, dot(q - vec3(0., top - .055, 0.), normalize(vec3(0., .78, .62))) );   // the slanted tip
  if (bul < r.x) r = vec2(bul, 2.);
  // cap: hollow cylinder, moved + rolled
  vec3 c = p - uCap.xyz; float ca = uCap.w; c.xy = mat2(cos(ca), sin(ca), -sin(ca), cos(ca)) * c.xy;
  float cap = max(sdCylR(c, .101, -.1, .1, .006), -sdCyl(c, .094, -.2, .088));
  if (cap < r.x) r = vec2(cap, 1.);
  // swatch: a creamy flattened ribbon drawn across the floor
  if (uSw > .001){
    vec3 s = p - vec3(0., 0., .3);
    float x = clamp(s.x, -.5, -.5 + uSw);
    vec3 c2 = vec3(x, .004 + .002*sin(x*20.), .04*sin(x*6.));
    float w = .055*(1. - .5*pow(abs(x + .5 - .5)*2., 4.));
    float d2 = length(vec2(s.x - x, s.z - c2.z)) - w, dy = abs(s.y - c2.y) - .0025;
    float sw = length(max(vec2(d2, dy), 0.)) + min(max(d2, dy), 0.) - .002;
    if (sw < r.x) r = vec2(sw, 2.);
  }
  return r;
}
float mapS(vec3 p){ return mapO(p).x; }
vec3 nrm(vec3 p){ const vec2 k = vec2(1.,-1.)*.0004;
  return normalize(k.xyy*mapS(p+k.xyy) + k.yyx*mapS(p+k.yyx) + k.yxy*mapS(p+k.yxy) + k.xxx*mapS(p+k.xxx)); }
vec2 march(vec3 ro, vec3 rd, float tmax){
  float t = .002;
  for (int i=0;i<140;i++){ vec2 h = mapO(ro + rd*t); if (abs(h.x) < .0002 + .0002*t) return vec2(t, h.y); t += h.x*.9; if (t > tmax) break; }
  return vec2(-1.);
}
float shadow(vec3 ro, vec3 L){ float res = 1., t = .01; for (int i=0;i<28;i++){ float h = mapS(ro + L*t); res = min(res, 8.*h/t); t += clamp(h, .01, .2); if (res < .003 || t > 2.) break; } return clamp(res, 0., 1.); }
float ao(vec3 p, vec3 n){ float o = 0., s = 1.; for (int i=0;i<4;i++){ float h = .01 + .04*float(i); o += (h - min(mapS(p + n*h), (p + n*h).y)) * s; s *= .7; } return clamp(1. - 3.*o, 0., 1.); }
float strip(vec3 r, vec3 dir, float w, float h){ float d = dot(r, dir); if (d <= 0.) return 0.; vec3 u = normalize(cross(vec3(0.,1.,0.), dir)); vec2 q = vec2(dot(r,u), r.y)/d; return smoothstep(w, w*.4, abs(q.x)) * smoothstep(h, h*.8, abs(q.y - .1)); }
vec3 env(vec3 r){
  vec3 c = mix(vec3(.02,.006,.008), vec3(.09,.025,.03), smoothstep(-.2, .7, r.y));
  c += vec3(1.,.93,.86) * 6. * strip(r, normalize(vec3(-.8,.1,.6)), .05, .9);
  c += vec3(1.,.9,.82) * 4. * strip(r, normalize(vec3(.9,.15,.3)), .04, .9);
  c += vec3(1.,.75,.6) * .8 * strip(r, normalize(vec3(.1,.05,-1.)), .12, .4);
  c += vec3(1.,.95,.9) * 2.5 * smoothstep(.93, .99, dot(r, LK));
  return c;
}
vec3 bg(vec3 rd){ return mix(vec3(.05,.012,.016), vec3(.16,.04,.05), smoothstep(-.1, .5, rd.y + .2*rd.x)); }
vec3 shadeObj(vec3 p, vec3 rd, float m){
  vec3 n = nrm(p);
  float cv = clamp(dot(n, -rd), 0., 1.);
  float sh = shadow(p + n*.002, LK), oc = ao(p, n);
  if (m < 1.5 || m > 3.5) {                              // gold: brushed metal reflecting the strips
    vec3 F0 = m < 1.5 ? vec3(1.,.77,.4) : vec3(.8,.58,.3);
    vec3 nn = normalize(n + .03*vec3(0., vnoise(p*vec3(4.,900.,4.)) - .5, 0.));
    vec3 r = reflect(rd, nn);
    vec3 F = F0 + (1. - F0)*pow(1. - cv, 5.);
    vec3 col = env(r) * F * (.35 + .65*oc);
    col += F0 * .05 * oc;
    return col;
  }
  // velvet red: wrapped diffuse + grazing sheen, almost no specular
  vec3 a = vec3(.42,.018,.045);
  float dif = clamp((dot(n, LK) + .3)/1.3, 0., 1.) * (.4 + .6*sh);
  vec3 col = a * (1.6*dif + .25*oc);
  col += vec3(.85,.3,.33) * .26 * pow(1. - cv, 2.5) * oc;
  col += vec3(1.,.8,.8) * .04 * pow(max(dot(reflect(rd, n), LK), 0.), 20.);
  return col;
}
vec3 render(vec2 fc){
  vec2 uv = (2.*fc - uRes) / uRes.y;
  vec3 ro = uRo;
  vec3 rd = camMat(ro, uTa, 0.) * normalize(vec3(uv, 2.8));
  float tF = rd.y < 0. ? -ro.y/rd.y : 1e4;
  vec2 h = march(ro, rd, min(tF, 6.));
  vec3 col;
  if (h.x > 0.) { col = shadeObj(ro + rd*h.x, rd, h.y); gDepth = h.x; }
  else if (tF < 1e3) {                                      // black acrylic floor with reflections
    vec3 p = ro + rd*tF; vec3 r = reflect(rd, vec3(0.,1.,0.));
    float F = .04 + .96*pow(1. - clamp(-rd.y, 0., 1.), 5.);
    vec2 hr = march(p + r*.002, r, 3.);
    vec3 rc = hr.x > 0. ? shadeObj(p + r*hr.x, r, hr.y) : env(r)*.6 + bg(r);
    col = vec3(.008,.003,.004) + rc * mix(.06, .9, F) * smoothstep(3., .6, length(p.xz));
    col *= .6 + .4*shadow(p + vec3(0.,.002,0.), LK);
    gDepth = tF;
  } else { col = bg(rd); gDepth = 8.; }
  return col * uFade;
}`,
});
// shot list (hard cuts): [t0, t1, p0, p1, a0, a1, aperture]
const SHOTS = [
  [0.0, 2.4, [-0.24, 0.13, 0.2], [0.2, 0.15, 0.22], [0.0, 0.15, 0.0], [0.0, 0.16, 0.0], 15],     // macro slide along the gold sleeve
  [2.4, 4.4, [0.03, 0.98, 0.3], [0.06, 0.9, 0.24], [-0.12, 0.18, 0.0], [-0.12, 0.18, 0.0], 6],    // overhead as the cap comes off
  [4.4, 7.0, [0.2, 0.4, 0.3], [0.15, 0.5, 0.25], [0.0, 0.37, 0.0], [0.0, 0.47, 0.0], 13],       // macro on the bullet twisting up
  [7.0, 9.2, [-0.62, 0.07, 0.68], [0.32, 0.07, 0.64], [-0.5, 0.0, 0.3], [0.45, 0.0, 0.3], 11],    // floor-level dolly with the swatch
  [9.2, 15.0, [-0.4, 0.5, 1.42], [-0.62, 0.44, 1.26], [-0.36, 0.25, 0.12], [-0.36, 0.25, 0.12], 5], // hero
];
function camAt(t) {
  const s = SHOTS.find((q) => t < q[1]) || SHOTS[SHOTS.length - 1];
  const u = E.inOutSine(clamp((t - s[0]) / (s[1] - s[0])));
  const L = (A, B) => [0, 1, 2].map((j) => lerp(A[j], B[j], u));
  return { p: L(s[2], s[3]), a: L(s[4], s[5]), ap: s[6] };
}
const CTM = [[0, 0], [2.4, 0.5], [4.4, 2.5], [7.0, 5.0], [9.2, 6.6], [15, 10.0]];
const ctOf = (t) => { for (let k = 1; k < CTM.length; k++) if (t <= CTM[k][0]) return lerp(CTM[k - 1][1], CTM[k][1], (t - CTM[k - 1][0]) / (CTM[k][0] - CTM[k - 1][0])); return 10; };
const cap = document.createElement('div'); cap.id = 'cap';
cap.innerHTML = `<div class="b">${C.brand}<span>${C.en}</span></div><div class="s">${C.line}</div><div class="p">${C.price}</div>`;
stage.appendChild(cap);
Reel.scene({
  duration: 15, fps: 30,
  fonts: ['700 150px "Noto Serif CJK SC"', '500 38px "Noto Serif CJK SC"', '500 18px Inter'],
  cues: [{"t": 0.0, "sfx": "swell", "gain": 0.4}, {"t": 2.4, "sfx": "whoosh", "gain": 0.3}, {"t": 2.5, "sfx": "suck", "gain": 0.5}, {"t": 4.4, "sfx": "clink", "gain": 0.4}, {"t": 4.6, "sfx": "roll", "gain": 0.35}, {"t": 7.0, "sfx": "whoosh", "gain": 0.3}, {"t": 7.1, "sfx": "brush", "gain": 0.55}, {"t": 9.2, "sfx": "impact_soft", "gain": 0.4}, {"t": 9.8, "sfx": "chime", "gain": 0.55}],
  render(rt) {
    const t = ctOf(rt);
    // cap: up, aside, and down onto its side
    const up = E.inOutSine(inv(0.6, 1.6, t)), aside = E.inOutSine(inv(1.4, 2.35, t));
    const capP = [lerp(0, -0.34, aside), lerp(0.28, 0.101, aside) + 0.26 * up * (1 - aside) + 0.0, lerp(0, 0.06, aside)];
    const roll = lerp(0, Math.PI / 2, aside);
    rm.set('uCap', [...capP, roll]);
    const rise = 0.12 * E.inOutSine(inv(2.7, 4.9, t));
    rm.set('uBul', [rise, 6.28 * E.inOutSine(inv(2.7, 4.9, t))]);
    rm.set('uSw', E.inOutSine(inv(5.3, 6.5, t)));
    const cam = camAt(rt);
    const ro = [cam.p[0] + 0.002 * Math.sin(t * 1.1), cam.p[1] + 0.0015 * Math.sin(t * 1.5), cam.p[2]];
    const fd = Math.hypot(ro[0] - cam.a[0], ro[1] - cam.a[1], ro[2] - cam.a[2]);
    rm.set('uRo', ro).set('uTa', cam.a).set('uFade', E.outCubic(clamp(rt / 0.6)));
    rm.render(rt, { focus: fd, aperture: cam.ap, maxCoc: 14 });
    const ca = E.outCubic(inv(9.8, 10.7, rt));
    cap.style.opacity = ca; cap.style.transform = `translateX(${(1 - ca) * -30}px)`;
  },
});
</script></body></html>
