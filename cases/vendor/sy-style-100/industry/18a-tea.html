<script>
/* ===== 18 水墨国风 · 行业示例：茶庄 =====
   A tall hanging scroll, painted while we watch. Distant blue-grey peaks bloom out of wet washes, a terraced
   tea hill is brushed in row by row. One leaf lets go of the top row and drifts down; the camera tilts with it
   through the mist, past a bamboo sprig, down to a celadon cup on the table, and the leaf lands on the tea:

const { E, clamp, lerp, inv } = Reel;
const stage = Reel.makeStage('#f3efe6');

const C = Reel.cfg({ brand: '云岫茶庄', line: '一叶一山一盏茶', sub: '高山云雾茶 · 茶空间 · 品茗预约', seal: '云岫' });

const MID = range([[420, 560, 240], [820, 380, 200], [1250, 300, 220], [1620, 470, 230]], -640, 7, 60, -300, 2300);
