<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>16 · SaaS 官网 · 客满云 CRM</title>
<script src="../lib/core.js"></script>
<style>
  #stage{font-family:Inter,'Noto Sans CJK SC',sans-serif;perspective:2400px;perspective-origin:50% 40%;overflow:hidden}
  #bg{position:absolute;inset:0;background:radial-gradient(1400px 900px at 50% 30%,#eef3ff 0%,#c9d6f5 60%,#9fb2e6 100%)}
  #win{position:absolute;left:260px;top:60px;width:1400px;height:960px;transform-style:preserve-3d;border-radius:16px}
  #chrome{position:absolute;left:0;top:0;right:0;height:52px;background:#f1f3f8;border-radius:16px 16px 0 0;display:flex;align-items:center;gap:9px;padding:0 18px;box-shadow:0 1px 0 #dfe3ec;z-index:3}
  #chrome .d{width:12px;height:12px;border-radius:50%}
  #url{margin-left:24px;flex:1;height:32px;border-radius:16px;background:#fff;display:flex;align-items:center;padding:0 16px;font:500 15px Inter;color:#5a6275}
  #view{position:absolute;left:0;top:52px;right:0;bottom:0;overflow:hidden;background:#fff;border-radius:0 0 16px 16px;transform-style:preserve-3d}
  #page{position:absolute;left:0;top:0;width:1400px;transform-style:preserve-3d}
  .sec{position:relative;transform-style:preserve-3d}
  .nav{height:76px;display:flex;align-items:center;padding:0 60px;gap:36px;font:600 16px 'Noto Sans CJK SC';color:#3d4560}
  .logo{font:900 26px 'Noto Sans CJK SC';color:#1e2a5a;display:flex;align-items:center;gap:10px;margin-right:30px}
  .logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#4f7cff,#7a5cff);display:inline-block}
  .btn{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 30px;border-radius:26px;font:800 18px 'Noto Sans CJK SC'}
  .pri{background:linear-gradient(135deg,#4f7cff,#7a5cff);color:#fff;box-shadow:0 10px 30px rgba(79,124,255,.35)}
  .ghost{background:#eef2ff;color:#3c4fd6}
  h1{margin:0;font:900 76px/1.12 'Noto Sans CJK SC';color:#151c3a;letter-spacing:-1px}
  .sub{font:500 22px/1.6 'Noto Sans CJK SC';color:#5a6380;margin:22px 0 30px}
  .kb{position:absolute;border-radius:18px;background:#f6f8fd;border:1px solid #e3e8f4;box-shadow:0 30px 60px rgba(40,60,140,.18)}
  .col{position:absolute;top:56px;width:178px;bottom:18px;border-radius:12px;background:#eef2fa}
  .col b{display:block;font:800 14px 'Noto Sans CJK SC';color:#56607a;padding:12px 14px}
  .card{position:absolute;left:10px;width:158px;height:66px;border-radius:10px;background:#fff;box-shadow:0 2px 6px rgba(30,40,90,.08);font:700 14px 'Noto Sans CJK SC';color:#25304f;padding:10px 12px;box-sizing:border-box}
  .card s{display:block;text-decoration:none;font:600 12px Inter;color:#8a93ab;margin-top:6px}
  .feat{position:absolute;width:380px;height:250px;border-radius:22px;background:#fff;border:1px solid #e6eaf3;box-shadow:0 20px 50px rgba(40,60,140,.12);padding:34px;box-sizing:border-box}
  .feat .ic{width:56px;height:56px;border-radius:16px;margin-bottom:20px}
  .feat h3{margin:0 0 10px;font:900 26px 'Noto Sans CJK SC';color:#151c3a}
  .feat p{margin:0;font:500 17px/1.6 'Noto Sans CJK SC';color:#5f6884}
  .stat{position:absolute;font:900 88px Inter;color:#3c4fd6}
  .stat small{display:block;font:700 20px 'Noto Sans CJK SC';color:#5f6884;margin-top:6px}
  .price{position:absolute;width:360px;height:420px;border-radius:24px;background:#fff;border:1px solid #e6eaf3;box-shadow:0 20px 50px rgba(40,60,140,.12);padding:36px;box-sizing:border-box}
  .price h4{margin:0;font:800 22px 'Noto Sans CJK SC';color:#3d4560}
  .price .p{font:900 58px Inter;color:#151c3a;margin:18px 0 6px}
  .price .p small{font:600 18px 'Noto Sans CJK SC';color:#8a93ab}
  .price li{list-style:none;font:500 17px/2.1 'Noto Sans CJK SC';color:#5f6884}
  #cursor{position:absolute;width:40px;height:40px;z-index:60;left:0;top:0}
  #cta{position:absolute;left:0;right:0;top:935px;text-align:center;font:900 52px 'Noto Sans CJK SC';color:#151c3a;opacity:0}
  #cta small{display:block;font:600 22px 'Noto Sans CJK SC';color:#4f5a85;margin-top:12px}
  .conf{position:absolute;width:12px;height:18px;border-radius:3px}
</style></head>
<body><div id="stage"></div>
<script>
/* ===== 16 真实页面 2.5D · 行业示例：SaaS 官网（CRM） =====
   A real-looking landing page in a browser window. The camera tilts the window back into a showcase
   angle and the page scrolls past like someone reading it - and as each section arrives, its parts lift
   off the page in depth: the pipeline board, the card a cursor drags from "沟通中" to "成交", the three
   feature cards, the numbers, the price card. Then the page flattens again and the CTA is clicked. */
const { E, clamp, lerp, spring } = Reel;
const stage = Reel.makeStage('#c9d6f5');
const C = Reel.cfg({ brand: '客满云', url: 'kemanyun.com', h1a: '让每个客户，', h1b: '都被记住', sub: '小团队用得起的 CRM：客户、跟进、成交，一张看板搞定', cta: '免费试用 14 天', ctaSub: '无需信用卡 · 5 分钟上手' });
stage.innerHTML = `<div id="bg"></div><div id="win"><div id="chrome"><span class="d" style="background:#ff5f57"></span><span class="d" style="background:#febc2e"></span><span class="d" style="background:#28c840"></span><div id="url">🔒 ${C.url}</div></div><div id="view"><div id="page"></div></div></div><div id="cta">${C.cta}<small>${C.ctaSub}</small></div>`;
const page = stage.querySelector('#page'), win = stage.querySelector('#win');
const add = (html, css = '', parent = page) => { const d = document.createElement('div'); d.innerHTML = html; d.style.cssText = css; parent.appendChild(d); return d; };
// nav
add(`<div class="nav"><div class="logo"><i></i>${C.brand}</div><span>产品</span><span>客户案例</span><span>价格</span><span>帮助中心</span><span style="flex:1"></span><span style="color:#3c4fd6">登录</span><span class="btn pri" style="height:44px;font-size:16px">免费试用</span></div>`, 'position:absolute;left:0;top:0;width:1400px');
// hero
const hero = add(`<h1>${C.h1a}<br><span style="background:linear-gradient(90deg,#4f7cff,#9b5cff);-webkit-background-clip:text;color:transparent">${C.h1b}</span></h1><div class="sub">${C.sub}</div><span class="btn pri">${C.cta}</span> <span class="btn ghost" style="margin-left:12px">看 2 分钟演示 ▶</span>`, 'position:absolute;left:80px;top:150px;width:560px');
// pipeline board (hero image)
const kb = add('', 'position:absolute;left:690px;top:130px;width:640px;height:470px;transform-style:preserve-3d');
const board = add(`<div style="position:absolute;left:20px;top:16px;font:800 18px 'Noto Sans CJK SC';color:#25304f">销售看板 · 本月</div>`, 'position:absolute;inset:0', kb); board.className = 'kb';
const COLS = ['线索 12', '沟通中 8', '报价 5', '成交 3'];
COLS.forEach((n, i) => add(`<b>${n}</b>`, `left:${16 + i * 154}px;width:146px`, board).className = 'col');
const CARDS = [[0, 0, '王总 · 餐饮连锁', '¥8,000'], [0, 1, '李姐 · 美甲店', '¥2,400'], [0, 2, '陈 · 健身房', '¥5,600'], [1, 0, '赵 · 设计工作室', '¥12,000'], [1, 1, '周总 · 社区超市', '¥6,800'], [2, 0, '吴 · 民宿', '¥3,900'], [3, 0, '孙 · 培训机构', '¥18,000']];
const cardEls = CARDS.map(([c, r, n, v]) => { const d = add(`${n}<s>${v}</s>`, `left:${16 + c * 154 + 6}px;top:${100 + r * 76}px;width:134px`, board); d.className = 'card'; return d; });
const DRAG = 4;   // 周总 card: 沟通中 -> 成交
// logos strip
add(`<div style="font:700 18px 'Noto Sans CJK SC';color:#8a93ab;text-align:center;margin-bottom:26px">已有 3,200+ 小团队在用</div><div style="display:flex;justify-content:space-around;font:900 26px Inter;color:#b3bbd0">${['MILK·T', 'YOGA+', 'BAKERY', 'NAILLAB', 'FITBOX', 'DESIGNCO'].map((s) => `<span>${s}</span>`).join('')}</div>`, 'position:absolute;left:80px;top:700px;width:1240px');
// features
add(`<h1 style="font-size:52px;text-align:center">销售最容易漏掉的三件事</h1>`, 'position:absolute;left:0;top:900px;width:1400px');
const FEATS = [['#ffb84d', '自动提醒跟进', '三天没联系的客户，系统替你记着，到点就提醒'], ['#4fd18b', '微信客户一键导入', '聊天里的客户，一键存进客户库，再也不丢'], ['#7a5cff', '成交漏斗看板', '每个阶段卡在哪、谁在跟，打开就一目了然']];
const featEls = FEATS.map(([col, h, p], i) => { const d = add(`<div class="ic" style="background:${col}"></div><h3>${h}</h3><p>${p}</p>`, `left:${80 + i * 420}px;top:1010px`); d.className = 'feat'; return d; });
// stats
const statEls = [['+27%', '平均成交率'], ['-80%', '跟进遗漏'], ['5 分钟', '上手时间']].map(([n, l], i) => { const d = add(`${n}<small>${l}</small>`, `left:${130 + i * 420}px;top:1360px`); d.className = 'stat'; return d; });
// pricing
add(`<h1 style="font-size:52px;text-align:center">价格简单透明</h1>`, 'position:absolute;left:0;top:1600px;width:1400px');
const PR = [['个人版', '免费', '1 人 · 200 客户', false], ['团队版', '¥99', '/人/年 · 不限客户 · 微信导入', true], ['企业版', '¥299', '/人/年 · 私有部署 · 专属顾问', false]];
const priceEls = PR.map(([h, p, d, hot], i) => { const e = add(`<h4>${h}${hot ? ' <span style="font-size:14px;color:#fff;background:#ff6b4d;border-radius:10px;padding:2px 10px;margin-left:8px">最受欢迎</span>' : ''}</h4><div class="p">${p}</div><ul style="padding:0;margin:16px 0">${d.split(' · ').map((s) => `<li>✓ ${s}</li>`).join('')}</ul><span class="btn ${hot ? 'pri' : 'ghost'}" style="width:100%;box-sizing:border-box">选择${h}</span>`, `left:${110 + i * 410}px;top:1700px;${hot ? 'border:2px solid #4f7cff' : ''}`); e.className = 'price'; return e; });
// cursor
const cur = document.createElement('div'); cur.id = 'cursor'; cur.innerHTML = `<svg width="40" height="40" viewBox="0 0 24 24"><path d="M4 2l15 9-7 1.6L8.8 20z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>`; page.appendChild(cur);
const confs = Array.from({ length: 40 }, (_, i) => { const d = document.createElement('div'); d.className = 'conf'; d.style.background = ['#4f7cff', '#ffb84d', '#ff6b4d', '#4fd18b', '#9b5cff'][i % 5]; stage.appendChild(d); return d; });
const cue = (t, a, d = 0.6) => E.inOutCubic(clamp((t - a) / d));
const lift = (t, a, z = 90) => z * spring(Math.max(0, t - a), { k: 140, c: 13 });
Reel.scene({
  duration: 15, fps: 30,
  fonts: ['900 76px "Noto Sans CJK SC"', '700 18px "Noto Sans CJK SC"', '500 18px "Noto Sans CJK SC"', '900 88px Inter', '600 15px Inter'],
  cues: [{ t: 0.3, sfx: 'whoosh', gain: 0.4 }, { t: 1.3, sfx: 'swell', gain: 0.4 }, { t: 2.6, sfx: 'pop', gain: 0.5 }, { t: 3.3, sfx: 'click', gain: 0.6 }, { t: 4.3, sfx: 'pop', gain: 0.6 }, { t: 4.4, sfx: 'coin', gain: 0.5 }, { t: 6.0, sfx: 'pop', gain: 0.4 }, { t: 6.25, sfx: 'pop', gain: 0.4 }, { t: 6.5, sfx: 'pop', gain: 0.4 }, { t: 8.0, sfx: 'tick', gain: 0.5 }, { t: 9.8, sfx: 'pop', gain: 0.5 }, { t: 11.2, sfx: 'whoosh', gain: 0.4 }, { t: 12.4, sfx: 'click', gain: 0.7 }, { t: 12.5, sfx: 'sparkle', gain: 0.6 }],
  render(t) {
    // window: arrives flat, tilts to the showcase angle, flattens at the end
    const tilt = cue(t, 0.9, 1.3) * (1 - cue(t, 10.9, 1.2));
    const arrive = spring(t, { k: 90, c: 14 });
    const endZ = cue(t, 10.9, 1.2);
    const zin = cue(t, 2.2, 0.9) * (1 - cue(t, 4.7, 0.8));
    win.style.transform = `translate(${-330 * zin}px, ${(1 - clamp(arrive)) * 200 + lerp(0, -40, endZ) + 170 * zin}px) rotateX(${28 * tilt}deg) rotateZ(${-9 * tilt}deg) rotateY(${6 * tilt}deg) scale(${lerp(0.94, 1.0, tilt) * lerp(1, 0.86, endZ) * lerp(1, 1.55, zin)})`;
    win.style.opacity = clamp(arrive * 2);
    // page scroll: hero -> features -> stats -> pricing -> back to top
    const S = [[0, 0], [5.2, 0], [6.0, 820], [8.6, 820], [9.2, 1240], [9.6, 1240], [10.2, 1560], [11.2, 1560], [12.0, 0]];
    let y = 0; for (let i = 0; i < S.length - 1; i++) { const [a, ya] = S[i], [b, yb] = S[i + 1]; if (t >= a && t <= b) y = lerp(ya, yb, E.inOutCubic((t - a) / (b - a))); if (t > b) y = yb; }
    page.style.transform = `translateY(${-y}px)`;
    // hero parts lift into depth while tilted
    hero.style.transform = `translateZ(${60 * tilt}px)`;
    kb.style.transform = `translateZ(${lift(t, 1.4, 200) * (1 - endZ)}px)`;
    cardEls.forEach((c, i) => { if (i !== DRAG) c.style.transform = `translateZ(${18 * tilt}px)`; });
    // the drag: cursor grabs 周总 in 沟通中 and drops it into 成交
    const grab = cue(t, 3.3, 0.15), mv = cue(t, 3.5, 0.8), drop = cue(t, 4.3, 0.2);
    const dx = mv * 308, dy = mv * 0, z = 18 * tilt + 70 * grab * (1 - drop);
    cardEls[DRAG].style.transform = `translate(${dx}px, ${dy - 76 * 0 + mv * 0}px) translateZ(${z}px) rotate(${(grab - drop) * mv * 4}deg)`;
    cardEls[DRAG].style.boxShadow = `0 ${10 + 30 * grab * (1 - drop)}px ${20 + 40 * grab * (1 - drop)}px rgba(30,40,90,${0.1 + 0.2 * grab * (1 - drop)})`;
    if (t > 4.3) cardEls[DRAG].style.top = `${100 + 76}px`;
    if (t > 4.3) { cardEls[DRAG].style.background = '#e9fff1'; }
    // cursor path (page coords)
    const c0 = [1200, 520], cDrag0 = [690 + 16 + 154 + 70, 130 + 100 + 76 + 30], cDrag1 = [cDrag0[0] + 308, cDrag0[1]], cCta = [700, 12 + 1560 + 140 + 0];
    let cx = lerp(c0[0], cDrag0[0], cue(t, 2.5, 0.8)), cy = lerp(c0[1], cDrag0[1], cue(t, 2.5, 0.8));
    cx = lerp(cx, cDrag1[0], mv); cy = lerp(cy, cDrag1[1] + (t > 4.3 ? 76 : 0) * 0, mv);
    const away = cue(t, 4.6, 0.6); cx = lerp(cx, 1300, away); cy = lerp(cy, 640, away);
    cur.style.transform = `translate(${cx}px, ${cy}px) translateZ(${100 * tilt + 40}px) scale(${t > 3.3 && t < 4.35 ? 0.88 : 1})`;
    const back = cue(t, 11.7, 0.7); cx = lerp(cx, 200, back); cy = lerp(cy, 478, back);
    cur.style.transform = `translate(${cx}px, ${cy}px) translateZ(${100 * tilt + 40}px) scale(${(t > 3.3 && t < 4.35) || (t > 12.35 && t < 12.5) ? 0.88 : 1})`;
    cur.style.opacity = clamp((t - 2.3) * 4) * (1 - clamp((t - 5.2) * 4)) + clamp((t - 11.6) * 4);
    // features / stats / price lift on arrival
    featEls.forEach((d, i) => d.style.transform = `translateZ(${lift(t, 5.9 + i * 0.25, 170) * tilt}px) rotateX(${(1 - clamp(spring(Math.max(0, t - 5.9 - i * 0.25), { k: 140, c: 13 }))) * -30}deg)`);
    statEls.forEach((d, i) => { const k = clamp((t - 8.9 - i * 0.12) / 0.6); d.style.transform = `translateZ(${130 * tilt * k}px)`; d.style.opacity = 0.2 + 0.8 * k; });
    priceEls.forEach((d, i) => d.style.transform = `translateZ(${(i === 1 ? lift(t, 9.8, 240) : lift(t, 9.9, 90)) * tilt}px) scale(${i === 1 ? 1 + 0.04 * clamp((t - 9.8) * 2) : 1})`);
    // CTA: flat page, big button click
    const ca = cue(t, 11.6, 0.6); const cta = stage.querySelector('#cta'); cta.style.opacity = ca; cta.style.transform = `translateY(${(1 - ca) * 20}px)`;
    confs.forEach((d, i) => { const u = t - 12.45; if (u < 0) { d.style.opacity = 0; return; } const a = (Reel.hash(i) - 0.5) * 2.4 - Math.PI / 2, v = 500 + Reel.hash(i * 3) * 700; const x = 960 + Math.cos(a) * v * u, y2 = 800 + Math.sin(a) * v * u + 900 * u * u; d.style.opacity = clamp(1.5 - u); d.style.transform = `translate(${x}px, ${y2}px) rotate(${u * 600 + i * 40}deg)`; });
  },
});
</script></body></html>
