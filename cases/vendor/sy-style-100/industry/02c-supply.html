</head><body><div id="stage"></div>
<script>
/* ===== 02 等轴 2.5D · ISOMETRIC CITY =====
   A floating diorama city drawn with an orthographic box renderer in 2D canvas: roads draw themselves,
   buildings spring up in a wave from the centre, cars run, clouds drift with their shadows. The sun sets,
   windows and street lamps come on one by one, and the camera slowly orbits - which flat iso art can't do. */
const { E, clamp, inv, lerp, spring } = Reel;
const stage = Reel.makeStage('#cfe6f2');
const C = Reel.cfg({ cap: '货流通', capEn: '订单 · 库存 · 配送，一张图看清', dash: '今日运营', k1: '准时送达', k2: '今日订单', wh: '中心仓', low: '库存不足', ok: '已补货' });
const RS = Reel.RS;
const W = Math.round(1920 * RS), H = Math.round(1080 * RS), K = W / 1920;
const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
cv.style.cssText = 'position:absolute;left:0;top:0;width:1920px;height:1080px';
stage.appendChild(cv);
const ctx = cv.getContext('2d');
const glowC = document.createElement('canvas'); glowC.width = W >> 1; glowC.height = H >> 1;
const gctx = glowC.getContext('2d');

// ---------- helpers ----------
const h1 = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const hex = (c) => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgb = (c, k = 1) => `rgb(${clamp(c[0] * k, 0, 255) | 0},${clamp(c[1] * k, 0, 255) | 0},${clamp(c[2] * k, 0, 255) | 0})`;



// ---------- supply network on a 14 x 14 slab ----------
const N = 14;
const roadX = new Set([6]), roadY = new Set([4, 10]);
const isRoad = (x, y) => roadX.has(y) || roadY.has(x);
let T = 0;
const WH = { x0: 0.5, y0: 7.6, x1: 3.5, y1: 12.6, h: 0.95 };
const STORES = [
  { x: 11.3, y: 1.4, col: '#ff9f85' }, { x: 11.4, y: 8.2, col: '#6fb4ee', low: true }, { x: 6.2, y: 1.6, col: '#ffcf4a' },
  { x: 6.4, y: 8.4, col: '#8fe0c4' }, { x: 12.0, y: 11.6, col: '#b3a2f5' }, { x: 1.6, y: 2.0, col: '#ff7e6b' },
];
const DOOR = (st) => [st.x < 10 && st.x > 4 ? (st.x < 7 ? 5.0 : st.x) : (st.x > 10 ? 11.0 : 3.6), st.y + 0.6];
// a route = list of points along road centrelines
function route(st) {
  const ex = [3.6, 6.5];
  const cx = st.x > 10 ? 10.5 : (st.x > 4 ? 4.5 : 4.5);
  return [ex, [cx, 6.5], [cx, st.y + 0.6], [st.x - (st.x > 10 ? 0.9 : -0.2), st.y + 0.6]];
}
function along(pts, u) {
  const L = []; let tot = 0; for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(l); tot += l; }
  let d = clamp(u) * tot, i = 0; while (i < L.length - 1 && d > L[i]) { d -= L[i]; i++; }
  const a = pts[i], b = pts[i + 1], f = L[i] ? d / L[i] : 0;
  return [lerp(a[0], b[0], f), lerp(a[1], b[1], f), b[0] - a[0], b[1] - a[1]];
}
const TREES = [];
for (let i = 0; i < 40; i++) { const x = 0.3 + h1(i * 3.1) * 13.4, y = 0.3 + h1(i * 7.3) * 13.4;
  if (isRoad(Math.floor(x), Math.floor(y)) || (x < 3.9 && y > 7.2) || STORES.some((s) => Math.hypot(s.x - x, s.y - y) < 1.4)) continue;
  TREES.push({ x, y, r: 0.22 + h1(i) * 0.12, t0: 2.0 + h1(i * 9) * 0.5 }); }
// ---------- camera / projection ----------
let AZ = Math.PI / 4, EL = 0.52, SC = 50, CX = 960, CY = 560;
function P(x, y, z) {
  const xx = x - 7, yy = y - 7;
  const c = Math.cos(AZ), s = Math.sin(AZ);
  const rx = xx * c - yy * s, ry = xx * s + yy * c;
  return [(CX + rx * SC) * K, (CY + ry * SC * Math.sin(EL) - z * SC * Math.cos(EL)) * K, ry];
}
function poly(pts, fill) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
// lighting state
let SUN = [-0.6, -0.35, 0.72], NIGHT = 0, DUSK = 0;
function shadeFace(nx, ny, nz) {
  // directional sun + ambient; returns a brightness factor
  const sl = Math.hypot(...SUN), d = (nx * SUN[0] + ny * SUN[1] + nz * SUN[2]) / sl;
  return 0.62 + 0.42 * Math.max(0, d);
}
const DAYT = hex('#ffffff'), DUSKT = hex('#ffb38a'), NIGHTT = hex('#6068c0');
function tint(c, k) {
  const tt = NIGHT > 0 ? mixc(DUSKT, NIGHTT, NIGHT) : mixc(DAYT, DUSKT, DUSK);
  const m = 1 - NIGHT * 0.42;
  return rgb([c[0] * tt[0] / 255 * m, c[1] * tt[1] / 255 * m, c[2] * tt[2] / 255 * m], k);
}
// draws an axis-aligned box [x0,x1]x[y0,y1]x[z0,z1] with optional window grid
const lights = [];
function box(x0, y0, z0, x1, y1, z1, col, opt = {}) {
  const v = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  const top = v.map(([x, y]) => P(x, y, z1)), bot = v.map(([x, y]) => P(x, y, z0));
  // side faces: (v[i] -> v[i+1]) with outward normals
  const normals = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  const c = Math.cos(AZ), s = Math.sin(AZ);
  for (let i = 0; i < 4; i++) {
    const [nx, ny] = normals[i];
    const nry = nx * s + ny * c;                    // toward the viewer if > 0
    if (nry <= 0.001) continue;
    const j = (i + 1) % 4;
    const k = shadeFace(nx, ny, 0) * (0.86 + 0.14 * nry);
    poly([bot[i], bot[j], top[j], top[i]], tint(col, k));
    if (opt.floors) { const m1 = lerpPt(bot[i], top[i], Math.min(0.5, 0.18 / Math.max(z1 - z0, 0.2))), m2 = lerpPt(bot[j], top[j], Math.min(0.5, 0.18 / Math.max(z1 - z0, 0.2))); const g = ctx.createLinearGradient(0, bot[i][1], 0, m1[1]); ctx.globalAlpha = 0.28; poly([bot[i], bot[j], m2, m1], '#1b1f3a'); ctx.globalAlpha = 1; }
    if (opt.floors && opt.windows !== false) windows(v[i], v[j], z0, z1, opt, i, k);
  }
  poly(top, tint(col, shadeFace(0, 0, 1) * 1.03));
  if (opt.floors) { ctx.strokeStyle = `rgba(255,255,255,${0.55 * (1 - NIGHT * 0.8)})`; ctx.lineWidth = 1.2 * K; ctx.beginPath(); ctx.moveTo(top[0][0], top[0][1]); for (let q = 1; q < 4; q++) ctx.lineTo(top[q][0], top[q][1]); ctx.closePath(); ctx.stroke(); }
  if (opt.roof) opt.roof(top);
}
function windows(a, b, z0, z1, o, face, k) {
  const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  const cols = Math.max(1, Math.round(len * 1.6)), fl = o.floors;
  const fh = (z1 - z0) / fl;
  for (let f = 0; f < fl; f++) for (let q = 0; q < cols; q++) {
    const u0 = (q + 0.3) / cols, u1 = (q + 0.7) / cols, zz0 = z0 + f * fh + fh * 0.32, zz1 = z0 + f * fh + fh * 0.74;
    const pa = [lerp(a[0], b[0], u0), lerp(a[1], b[1], u0)], pb = [lerp(a[0], b[0], u1), lerp(a[1], b[1], u1)];
    // push the window a hair out of the wall along the face normal
    const quad = [P(pa[0], pa[1], zz0), P(pb[0], pb[1], zz0), P(pb[0], pb[1], zz1), P(pa[0], pa[1], zz1)];
    const hs = h1(o.seed * 13 + f * 7 + q * 3 + face * 31);
    const on = NIGHT > 0 && hs < 0.82 && NIGHT > (hs * 0.75 + 0.05);
    if (on) {
      const wc = hs < 0.15 ? hex('#bfe9ff') : (hs < 0.55 ? hex('#ffd88a') : hex('#ffe9c2'));
      poly(quad, rgb(wc, 0.9 + 0.1 * Math.sin(T * 3 + hs * 40)));
      if (hs < 0.08) lights.push([(quad[0][0] + quad[2][0]) / 2, (quad[0][1] + quad[2][1]) / 2, 9 * K, wc, 0.25]);
    } else {
      const day = hex('#a9cdea');
      poly(quad, tint(mixc(day, hex('#2a3460'), NIGHT * 0.6), k * 0.95));
      if (NIGHT < 0.5) { ctx.globalAlpha = 0.35 * (1 - NIGHT * 2); poly([quad[0], lerpPt(quad[0], quad[1], 0.35), lerpPt(quad[3], quad[2], 0.55), quad[3]], '#ffffff'); ctx.globalAlpha = 1; }
    }
  }
}
const lerpPt = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];

// ---------- scene pieces ----------
function sky(t) {
  const day = [hex('#bfe3f5'), hex('#f1f7ea')], dusk = [hex('#7d7fd6'), hex('#ffb38a')], night = [hex('#0c1033'), hex('#2a2160')];
  let top, bot;
  if (NIGHT > 0) { top = mixc(dusk[0], night[0], NIGHT); bot = mixc(dusk[1], night[1], NIGHT); } else { top = mixc(day[0], dusk[0], DUSK); bot = mixc(day[1], dusk[1], DUSK); }
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, rgb(top)); g.addColorStop(1, rgb(bot));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (NIGHT > 0.2) for (let i = 0; i < 90; i++) { const x = h1(i * 3.3) * W, y = h1(i * 7.1) * H * 0.7, a = (NIGHT - 0.2) * (0.5 + 0.5 * Math.sin(t * 2 + i)); ctx.fillStyle = `rgba(255,255,255,${a * 0.8})`; ctx.fillRect(x, y, 2 * K, 2 * K); }
}
function slab(t) {
  // floating ground chunk: dirt layers on the sides, grass on top
  const z0 = -1.1;
  const layers = [[-1.1, -0.75, '#8a5a3c'], [-0.75, -0.35, '#a8704a'], [-0.35, -0.12, '#c58b5b'], [-0.12, 0, '#7cc06a']];
  for (const [a, b, c] of layers) box(-0.15, -0.15, a, N + 0.15, N + 0.15, b, hex(c));
  // grass top
  const g = [P(-0.15, -0.15, 0), P(N + 0.15, -0.15, 0), P(N + 0.15, N + 0.15, 0), P(-0.15, N + 0.15, 0)];
  poly(g, tint(hex('#9bd47a'), 1.02));
}
function roads(t) {
  const rv = E.outCubic(inv(0.35, 1.25, t));
  const road = hex('#596075'), walk = hex('#ddd8cb');
  // sidewalks then asphalt, revealed along their length
  for (const y of roadX) {
    const L = N * rv;
    poly([P(0, y - 0.08, 0.01), P(L, y - 0.08, 0.01), P(L, y + 1.08, 0.01), P(0, y + 1.08, 0.01)], tint(walk, 1));
    poly([P(0, y + 0.06, 0.02), P(L, y + 0.06, 0.02), P(L, y + 0.94, 0.02), P(0, y + 0.94, 0.02)], tint(road, 1));
    for (let x = 0.3; x < L - 0.4; x += 0.8) poly([P(x, y + 0.48, 0.025), P(x + 0.4, y + 0.48, 0.025), P(x + 0.4, y + 0.52, 0.025), P(x, y + 0.52, 0.025)], tint(hex('#f2f2f2'), 1));
  }
  for (const x of roadY) {
    const L = N * rv;
    poly([P(x - 0.08, 0, 0.011), P(x + 1.08, 0, 0.011), P(x + 1.08, L, 0.011), P(x - 0.08, L, 0.011)], tint(walk, 1));
    poly([P(x + 0.06, 0, 0.021), P(x + 0.94, 0, 0.021), P(x + 0.94, L, 0.021), P(x + 0.06, L, 0.021)], tint(road, 1));
    for (let y = 0.3; y < L - 0.4; y += 0.8) poly([P(x + 0.48, y, 0.026), P(x + 0.52, y, 0.026), P(x + 0.52, y + 0.4, 0.026), P(x + 0.48, y + 0.4, 0.026)], tint(hex('#f2f2f2'), 1));
  }
  // crossings
  for (const y of roadX) for (const x of roadY) poly([P(x, y, 0.03), P(x + 1, y, 0.03), P(x + 1, y + 1, 0.03), P(x, y + 1, 0.03)], tint(road, 1));
}
function shadows(items) {
  if (NIGHT > 0.6) return;
  ctx.save();
  const sl = [P(-0.15, -0.15, 0), P(N + 0.15, -0.15, 0), P(N + 0.15, N + 0.15, 0), P(-0.15, N + 0.15, 0)];
  ctx.beginPath(); ctx.moveTo(sl[0][0], sl[0][1]); for (let i = 1; i < 4; i++) ctx.lineTo(sl[i][0], sl[i][1]); ctx.closePath(); ctx.clip();
  ctx.globalAlpha = 0.16 * (1 - NIGHT / 0.6) * (1 - DUSK * 0.3);
  const sx = -SUN[0] / SUN[2], sy = -SUN[1] / SUN[2];
  for (const it of items) {
    if (!it.h) continue;
    const { x0, y0, x1, y1, h } = it;
    const pts = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
    const proj = pts.map(([x, y]) => [x + sx * h, y + sy * h]);
    const all = pts.concat(proj).map(([x, y]) => P(x, y, 0.035));
    // convex hull of the 8 points
    all.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for (const p of all) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
    for (let i = all.length - 1; i >= 0; i--) { const p = all[i]; while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
    poly(lo.slice(0, -1).concat(up.slice(0, -1)), '#1d2a52');
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}
function tree(x, y, r, s, sway) {
  if (s <= 0) return;
  box(x - 0.04, y - 0.04, 0, x + 0.04, y + 0.04, 0.28 * s, hex('#8a5a3c'), { windows: false });
  const c = P(x + sway, y, 0.28 * s + r * s);
  const rr = r * SC * K * s;
  const g = ctx.createRadialGradient(c[0] - rr * 0.35, c[1] - rr * 0.4, rr * 0.1, c[0], c[1], rr);
  const base = hex(h1(x * 13) > 0.5 ? '#5cbf6a' : '#7bcf62');
  g.addColorStop(0, tint(base, 1.25)); g.addColorStop(0.7, tint(base, 1.0)); g.addColorStop(1, tint(base, 0.75));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c[0], c[1], rr, 0, Math.PI * 2); ctx.fill();
}

function store(st, s, t) {
  if (s <= 0) return;
  const x0 = st.x - 0.6, x1 = st.x + 0.6, y0 = st.y - 0.5, y1 = st.y + 0.5, h = 0.62 * s;
  box(x0, y0, 0, x1, y1, h, hex('#fbf7ef'), { floors: 1, seed: Math.round(st.x * 13 + st.y) });
  // striped awning on the street side
  for (let k = 0; k < 6; k++) { const a = x0 + k * 0.2; poly([P(a, y1, h * 0.72), P(a + 0.2, y1, h * 0.72), P(a + 0.2, y1 + 0.3, h * 0.5), P(a, y1 + 0.3, h * 0.5)], tint(hex(k % 2 ? '#ffffff' : st.col), 1.02)); }
  poly([P(x0 + 0.05, y0 + 0.05, h + 0.001), P(x1 - 0.05, y0 + 0.05, h + 0.001), P(x1 - 0.05, y1 - 0.05, h + 0.001), P(x0 + 0.05, y1 - 0.05, h + 0.001)], tint(hex(st.col), 0.95));
}
function stock(st, t) {
  // floating stock gauge above the shop
  let lv = 0.72 + 0.12 * Math.sin(st.x);
  if (st.low) lv = t < 3.2 ? 0.7 : (t < 6.6 ? lerp(0.7, 0.12, E.inOutSine(inv(3.2, 4.0, t))) : lerp(0.12, 0.92, E.outCubic(inv(6.6, 7.2, t))));
  const a = E.outCubic(inv(2.3, 2.7, t)); if (a <= 0) return;
  const c = P(st.x, st.y, 1.25);
  const w = 64 * K, hh = 12 * K;
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.beginPath(); ctx.roundRect(c[0] - w / 2 - 6 * K, c[1] - hh / 2 - 6 * K, w + 12 * K, hh + 12 * K, 10 * K); ctx.fill();
  ctx.fillStyle = '#e6eaf2'; ctx.beginPath(); ctx.roundRect(c[0] - w / 2, c[1] - hh / 2, w, hh, 6 * K); ctx.fill();
  ctx.fillStyle = lv < 0.25 ? '#ff4d4f' : (lv < 0.5 ? '#ffb020' : '#2fbf71'); ctx.beginPath(); ctx.roundRect(c[0] - w / 2, c[1] - hh / 2, Math.max(hh, w * lv), hh, 6 * K); ctx.fill();
  ctx.globalAlpha = 1;
  if (st.low) {
    const warn = t > 3.8 && t < 6.7, okk = t > 6.9;
    if (warn || okk) {
      const pa = clamp(spring(t - (warn ? 3.8 : 6.9), { k: 200, c: 13 }), 0, 1.1);
      const txt = warn ? C.low : C.ok, col = warn ? '#ff4d4f' : '#2fbf71';
      ctx.save(); ctx.translate(c[0], c[1] - 26 * K); ctx.scale(pa, pa); ctx.font = `700 ${22 * K}px "Noto Sans CJK SC"`;
      const tw = ctx.measureText(txt).width; ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(-tw / 2 - 18 * K, -38 * K, tw + 36 * K, 38 * K, 19 * K); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, 0, -18 * K); ctx.restore();
      if (warn) lights.push([c[0], c[1], 30 * K, hex('#ff4d4f'), 0.5 + 0.4 * Math.sin(t * 10)]);
    }
  }
}
function warehouse(s, t) {
  if (s <= 0) return;
  const { x0, y0, x1, y1, h } = WH;
  box(x0, y0, 0, x1, y1, h * s, hex('#e9eef5'), { floors: 2, seed: 7 });
  box(x0, y0, h * s * 0.82, x1, y0 + 0.02, h * s * 0.9, hex('#3a7bff'), { windows: false });
  for (let k = 0; k < 4; k++) { const yy = y0 + 0.7 + k * 1.15; box(x0 + 0.5, yy, h * s, x1 - 0.5, yy + 0.35, h * s + 0.06, hex('#bcd6f2'), { windows: false }); }
