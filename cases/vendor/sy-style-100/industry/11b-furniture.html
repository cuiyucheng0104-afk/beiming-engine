<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>11 · 几何家居 · 几何物</title>
<script src="../lib/core.js"></script><script src="../lib/gl.js"></script><script src="../lib/rm.js"></script><script src="../lib/plates.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 11 包豪斯 · 行业示例：几何家居品牌 =====
   Flat-pack, assembled by the beat. In the paper studio, painted plywood panels drop out of the air, spin
   once and slot together into furniture - a stool, a cross-leg side table, an open shelf with its little
   objects - while the camera dollies from piece to piece like a product shoot, then pulls back to show
   the set and the brand. Same plates and studio as the Bauhaus look, but every panel is real 3D. */
const { E, clamp, lerp } = Reel;
const stage = Reel.makeStage('#e9e2d4');
const C = Reel.cfg({ brand: '几何物', en: 'GEOMETRIC HOME', sub: '几何家居 · 平板包装 · 十分钟装好' });
const { Q } = PLATES;
const RX = (a) => Q.axis(1, 0, 0, a), RY = (a) => Q.axis(0, 1, 0, a);
const H = RX(-Math.PI / 2), V = RY(Math.PI / 2), I = Q.I;
// [type, p, colour, centre, rotation, half-thickness, land time]
const PC = [
  // stool
  [0, [0.3, 0.25, 0], 2, [-2.0, -0.75, 0.2], V, 0.03, 0.5], [0, [0.3, 0.25, 0], 2, [-1.4, -0.75, 0.2], V, 0.03, 0.9],
  [0, [0.3, 0.045, 0], 0, [-1.7, -0.86, 0.47], I, 0.025, 1.3], [7, [0.42, 0.34, 0.06], 1, [-1.7, -0.47, 0.2], H, 0.035, 1.8],
  // side table
  [0, [0.36, 0.37, 0], 3, [0, -0.63, -0.1], I, 0.025, 3.5], [0, [0.36, 0.37, 0], 3, [0, -0.63, -0.1], V, 0.025, 3.9], [2, [0.52, 0, 0], 0, [0, -0.235, -0.1], H, 0.035, 4.4],
  // shelf
  [0, [0.28, 0.76, 0], 3, [1.25, -0.24, 0.1], V, 0.03, 6.3], [0, [0.28, 0.76, 0], 2, [2.35, -0.24, 0.1], V, 0.03, 6.6],
  [0, [0.55, 0.28, 0], 0, [1.8, -0.86, 0.1], H, 0.03, 7.0], [0, [0.55, 0.28, 0], 4, [1.8, -0.4, 0.1], H, 0.03, 7.3], [0, [0.55, 0.28, 0], 1, [1.8, 0.06, 0.1], H, 0.03, 7.6], [0, [0.55, 0.28, 0], 4, [1.8, 0.5, 0.1], H, 0.03, 7.9],
  [2, [0.15, 0, 0], 0, [1.6, -0.21, 0.05], I, 0.02, 8.3], [3, [0.14, 0, 0], 2, [2.05, 0.18, 0.08], I, 0.02, 8.6], [5, [0.2, 0, 0], 3, [1.45, -0.72, 0.0], I, 0.025, 8.9],
];
const pl = PLATES.make(stage, {
  shapes: PC.map(([type, p, col]) => ({ type, p, col })),
  palette: [[0.6, 0.026, 0.02], [0.8, 0.4, 0.01], [0.007, 0.045, 0.21], [0.012, 0.012, 0.012], [0.72, 0.68, 0.6]],
  cyc: { fy: -1.0, wz: -3.2, rc: 1.6 },
  rm: { sat: 1.3, contrast: 1.12 },
});
const START = PC.map((_, i) => ({ dy: 2.6 + Reel.hash(i * 3.1) * 0.8, dx: (Reel.hash(i * 5.7) - 0.5) * 0.8, q: Q.axis(Reel.hash(i) - 0.5, 1, Reel.hash(i * 2) - 0.5, (Reel.hash(i * 9) > 0.5 ? 1 : -1) * 2.4) }));
function plates(t) {
  return PC.map(([, , , c, q, th, t0], i) => {
    const u = t - t0 + 0.55; if (u < 0) return { vis: 0 };
    const fall = E.inQuad(clamp(u / 0.55));                     // drops in, accelerating
    const s = u < 0.55 ? 0 : Reel.spring(u - 0.55, { k: 210, c: 16 }); // tiny settle after the slot-in
    const S = START[i];
    const y = c[1] + S.dy * (1 - fall) - 0.04 * (1 - s) * (u > 0.55 ? 1 : 0);
    const rot = Q.slerp(Q.mul(S.q, q), q, E.outCubic(clamp(u / 0.55)));
    return { c: [c[0] + S.dx * (1 - fall), y, c[2]], q: rot, k: 1, th, vis: 1 };
  });
}
// camera keyframes: [t, target, az, el, dist]
const KEY = [[0, [-1.7, -0.66, 0.2], -0.6, 0.4, 2.9], [2.7, [-1.7, -0.66, 0.2], -0.3, 0.34, 2.65], [3.4, [0, -0.55, -0.1], -0.12, 0.36, 2.75], [5.6, [0, -0.55, -0.1], 0.16, 0.3, 2.55],
  [6.2, [1.8, -0.22, 0.1], 0.2, 0.22, 3.7], [9.3, [1.8, -0.22, 0.1], 0.48, 0.18, 3.5], [10.6, [0.45, -0.4, 0], 0.32, 0.26, 5.9], [15, [0.45, -0.4, 0], 0.06, 0.2, 5.6]];
function camera(t) {
  let i = 0; while (i < KEY.length - 2 && t > KEY[i + 1][0]) i++;
  const [t0, a0, az0, el0, d0] = KEY[i], [t1, a1, az1, el1, d1] = KEY[i + 1];
  const move = (i % 2 === 1);                                   // odd segments are the dollies between pieces
  const u = clamp((t - t0) / (t1 - t0)), e = move ? E.inOutCubic(u) : E.inOutSine(u);
  const ta = a0.map((v, k) => lerp(v, a1[k], e)), az = lerp(az0, az1, e), el = lerp(el0, el1, e), dist = lerp(d0, d1, e);
  return { ro: PLATES.orbit(ta, az, el, dist), ta, roll: 0, f: 2.6 };
}
const ov = Reel.canvas2d(stage);
const LAB = [[2.3, '方凳 STOOL', '¥399', [-1.7, -0.45, 0.2]], [4.9, '圆几 SIDE TABLE', '¥599', [0, -0.22, -0.1]], [9.3, '格架 SHELF', '¥899', [1.8, 0.55, 0.1]]];
Reel.scene({
  duration: 15, fps: 30,
  fonts: ['700 60px "TeX Gyre Adventor"', '900 44px "Noto Sans CJK SC"', '500 20px "Noto Sans CJK SC"'],
  cues: [...PC.map((p) => ({ t: +(p[6]).toFixed(2), sfx: 'block', gain: 0.55 })), { t: 2.3, sfx: 'tick', gain: 0.4 }, { t: 4.9, sfx: 'tick', gain: 0.4 }, { t: 9.3, sfx: 'tick', gain: 0.4 }, { t: 9.6, sfx: 'whoosh', gain: 0.3 }, { t: 11.0, sfx: 'rim', gain: 0.6 }, { t: 11.5, sfx: 'rim', gain: 0.5 }],
  render(t) {
    const cam = camera(t);
    pl.frame(t, plates(t), cam, { ap: 0.1 * (1 - clamp((t - 9.6) / 1.2)) + 0.04 });
    const { ctx, begin } = ov; begin(); ctx.clearRect(0, 0, 1920, 1080);
    // product labels, pinned to the pieces
    for (const [t0, name, price, P] of LAB) {
      const a = clamp((t - t0) / 0.25) * (t < 10.4 ? 1 : clamp((t - 11.3) / 0.3)); if (a <= 0) continue;
      const [x, y] = PLATES.proj(cam, P); const sc = t > 10.4 ? 0.8 : 1;
      ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = 'rgba(22,22,22,.85)'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 60 * sc, y - 60 * sc); ctx.lineTo(x + 220 * sc, y - 60 * sc); ctx.stroke();
      ctx.fillStyle = 'rgba(22,22,22,.92)'; ctx.font = `700 ${Math.round(20 * sc)}px "TeX Gyre Adventor", "Noto Sans CJK SC"`; ctx.textBaseline = 'bottom'; ctx.fillText(name, x + 66 * sc, y - 66 * sc);
      ctx.font = `900 ${Math.round(34 * sc)}px "Noto Sans CJK SC"`; ctx.textBaseline = 'top'; ctx.fillStyle = '#9a1a12'; ctx.fillText(price, x + 66 * sc, y - 54 * sc); ctx.restore();
    }
    // brand
    const ba = clamp((t - 11.0) / 0.3);
    if (ba > 0) {
      ctx.save(); ctx.globalAlpha = ba; ctx.fillStyle = 'rgba(22,22,22,.94)'; ctx.textBaseline = 'alphabetic';
      ctx.font = '900 92px "Noto Sans CJK SC"'; ctx.fillText(C.brand, 120, 210);
      ctx.fillStyle = '#9a1a12'; ctx.fillRect(124, 236, 300 * clamp((t - 11.2) / 0.4), 8);
      ctx.fillStyle = 'rgba(22,22,22,.9)'; ctx.font = '700 26px "TeX Gyre Adventor"'; if ('letterSpacing' in ctx) ctx.letterSpacing = '8px'; ctx.fillText(C.en, 124, 290); if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      ctx.globalAlpha = clamp((t - 11.5) / 0.3); ctx.font = '500 26px "Noto Sans CJK SC"'; ctx.fillText(C.sub, 124, 336); ctx.restore();
    }
  },
});
</script></body></html>
