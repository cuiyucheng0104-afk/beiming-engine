<script>
/* ===== 09 拼贴 · 行业示例：定制旅行 =====
   Follow the line. A big printed travel map lies on the table; the camera starts close on a boarding pass,
   then a little cut-paper plane takes off and the camera chases it while a red marker route draws itself
   behind it - stop 2: an instax of a snow mountain; stop 3: a riso print of the sea and a postmark.
   Then the camera pulls all the way back to reveal the whole trip, and the agency's name lands in ransom
   letters under the route. Stop-motion at 12 fps, window light turning golden as the trip goes on. */
const { E, clamp, lerp } = Reel;
const stage = Reel.makeStage('#5a3e26');
const C = Reel.cfg({ brand: '出逃旅行', sub: '一人也成团 · 路线为你定制', tag: 'ESCAPE · 7 DAYS · TAILOR-MADE' });

const S1 = [470, 1150], S2 = [1250, 380], S3 = [2330, 820];

function scenery(kind) {

    ridge(230, 170, 0.006, '#7d8fae', true, 3.3); ridge(280, 110, 0.009, '#4c5d78', true, 7.1); ridge(320, 60, 0.015, '#2d4a3c', false, 11.2);
    const lake = g.createLinearGradient(0, 320, 0, h); lake.addColorStop(0, '#5f8fbf'); lake.addColorStop(1, '#22476d'); g.fillStyle = lake; g.fillRect(0, 325, w, h);
    g.fillStyle = 'rgba(255,255,255,.25)'; for (let i = 0; i < 40; i++) g.fillRect(rr(0, w), rr(330, h), rr(20, 90), 1.5);
    g.fillStyle = '#1d3326'; for (let i = 0; i < 26; i++) { const x = rr(0, w), y = rr(312, 330), s = rr(10, 22); g.beginPath(); g.moveTo(x, y - s * 2); g.lineTo(x - s * 0.5, y); g.lineTo(x + s * 0.5, y); g.fill(); }

    g.fillStyle = '#fff1c4'; g.beginPath(); g.arc(400, 250, 46, 0, 7); g.fill();
    const sea = g.createLinearGradient(0, 270, 0, h); sea.addColorStop(0, '#d9785e'); sea.addColorStop(1, '#2a3f6b'); g.fillStyle = sea; g.fillRect(0, 272, w, h);
    g.fillStyle = 'rgba(255,230,170,.6)'; for (let i = 0; i < 70; i++) { const y = rr(276, h), wd = rr(10, 80) * (1 - (y - 272) / 300); g.fillRect(400 - wd / 2 + rr(-40, 40) * (y - 272) / 120, y, wd, 2); }
    g.fillStyle = '#2b2236'; g.beginPath(); g.moveTo(40, 274); g.quadraticCurveTo(110, 200, 200, 274); g.fill();
    g.beginPath(); g.moveTo(250, 340); g.lineTo(300, 340); g.lineTo(292, 352); g.lineTo(258, 352); g.fill(); g.fillRect(274, 300, 2.5, 40); g.beginPath(); g.moveTo(276, 302); g.lineTo(296, 336); g.lineTo(276, 336); g.fill();

}

// the route: smooth curve through the three stops with a detour
const ROUTE = (() => {
  const ctrl = [S1, [700, 760], [960, 660], S2, [1600, 360], [1900, 980], [2120, 900], S3];
  const pts = [];
  const cr = (p0, p1, p2, p3, u) => { const u2 = u * u, u3 = u2 * u; return [0, 1].map((j) => 0.5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * u + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * u2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * u3)); };
  const P = [ctrl[0], ...ctrl, ctrl[ctrl.length - 1]];
  for (let i = 1; i < P.length - 2; i++) for (let s = 0; s < 40; s++) pts.push(cr(P[i - 1], P[i], P[i + 1], P[i + 2], s / 40));
  pts.push(S3);
  const L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  // arc length at S2: nearest point
  let i2 = 0, best = 1e9; pts.forEach((p, i) => { const d = Math.hypot(p[0] - S2[0], p[1] - S2[1]); if (d < best) { best = d; i2 = i; } });
  return { pts, L, total: L[L.length - 1], at2: L[i2] };
})();
function routeAt(s) { const { pts, L } = ROUTE; s = clamp(s, 0, ROUTE.total); let i = 1; while (i < L.length - 1 && L[i] < s) i++; const u = (s - L[i - 1]) / Math.max(1e-6, L[i] - L[i - 1]); const a = pts[i - 1], b = pts[i]; return { x: lerp(a[0], b[0], u), y: lerp(a[1], b[1], u), ang: Math.atan2(b[1] - a[1], b[0] - a[0]) }; }
// distance travelled along the route at time t (two legs, each eased)
function sAt(t) { return ROUTE.at2 * E.inOutSine(clamp((t - 1.3) / 2.3)) + (ROUTE.total - ROUTE.at2) * E.inOutSine(clamp((t - 5.1) / 2.4)); }

function build() {

        const gy = p.createLinearGradient(0, h / 2 - 30, 0, h / 2 + 30); gy.addColorStop(0, 'rgb(0,0,0)'); gy.addColorStop(0.5, `rgb(${Math.round(0.9 * k.ZS)},0,0)`); gy.addColorStop(1, 'rgb(0,0,0)'); p.fillStyle = gy; p.fillRect(0, h / 2 - 30, w, 60); },

        { const q = 8, lw = Math.ceil(w / q), lh = Math.ceil(h / q), lc = mkc(lw, lh), lg = g2(lc);
          for (let y = 0; y < lh; y++) for (let x = 0; x < lw; x++) {

        g.fillStyle = 'rgba(110,80,50,.7)'; for (let i = 0; i < 26; i++) { const a = R() * 6.28, r = 60 + R() * 260, X = S2[0] - ox - 30 + Math.cos(a) * r * 1.2, Y = S2[1] - oy - 30 + Math.sin(a) * r; g.beginPath(); g.moveTo(X, Y - 14); g.lineTo(X - 10, Y + 6); g.lineTo(X + 10, Y + 6); g.closePath(); g.fill(); }

        g.strokeStyle = 'rgba(190,90,60,.45)'; g.lineWidth = 2.2; for (let i = 0; i < 9; i++) { g.beginPath(); let X = rr(0, w), Y = rr(0, h); g.moveTo(X, Y); for (let s = 0; s < 6; s++) { X += rr(-260, 260); Y += rr(-200, 200); g.lineTo(X, Y); } g.stroke(); }
        // grid + labels
        g.strokeStyle = 'rgba(60,80,110,.28)'; g.lineWidth = 1.2; g.setLineDash([10, 8]);
        for (let x = 200; x < w; x += 420) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
        for (let y = 200; y < h; y += 420) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); } g.setLineDash([]);
        g.fillStyle = 'rgba(60,80,110,.6)'; g.font = '500 20px Inter'; for (let x = 200, i = 0; x < w; x += 420, i++) g.fillText(`${98 + i}°E`, x + 6, 26);
        const lab = (s, x, y, sz, col = 'rgba(50,40,30,.75)', wt = 500) => { g.fillStyle = col; g.font = `${wt} ${sz}px ${SERIF}`; g.fillText(s, x - ox - 30, y - oy - 30); };
        lab('梅 里 雪 山', S2[0] + 90, S2[1] - 120, 34, 'rgba(90,60,40,.8)', 700); lab('高 原 湖', 1490, 700, 24, 'rgba(40,90,130,.8)');
        lab('东 海 岸', 2660, 1220, 40, 'rgba(40,90,130,.7)', 700); lab('古 城', 820, 880, 26); lab('茶 马 古 道', 1500, 1100, 24, 'rgba(120,60,40,.7)'); lab('S E A', 2800, 1500, 54, 'rgba(40,90,130,.45)', 700);
        // compass rose
        const cx0 = 2780 - ox - 30, cy0 = 260 - oy - 30; g.strokeStyle = 'rgba(60,50,40,.7)'; g.fillStyle = 'rgba(60,50,40,.75)'; g.lineWidth = 1.5; g.beginPath(); g.arc(cx0, cy0, 90, 0, 7); g.stroke(); g.beginPath(); g.arc(cx0, cy0, 72, 0, 7); g.stroke();
        for (let i = 0; i < 4; i++) { g.save(); g.translate(cx0, cy0); g.rotate(i * Math.PI / 2); g.beginPath(); g.moveTo(0, -110); g.lineTo(12, 0); g.lineTo(-12, 0); g.closePath(); i ? g.stroke() : g.fill(); g.restore(); }
        g.font = '700 26px Inter'; g.textAlign = 'center'; g.fillText('N', cx0, cy0 - 120); g.textAlign = 'left';
        k.paperTex(g, w, h, { mott: 40, ma: 0.04, fib: 4000, fl: 8, fc: ['rgba(120,100,60,.06)', 'rgba(255,255,255,.12)'], speck: 60 });
      } }), 1430, 800, 0.008, -1);
  }
  k.PIECES.push({ fn: drawRoute });
  // ---- stop 1: boarding pass + "go" stamp
  { const w = 520, h = 210, ol = k.outline(w, h, { sides: 'cccc', cj: 1.4 });
    k.add(k.makePiece({ w, h, pad: 12, ol, z: 1.1, gloss: 0.2, tooth: 0.15, edge: 0.4, relief: k.curl(w, h, 120, 1.6),
      paint: (g) => {
        g.fillStyle = '#f7f4ec'; g.fillRect(-5, -5, w + 10, h + 10); g.fillStyle = '#1f5fa8'; g.fillRect(0, 0, w, 46);
        g.fillStyle = '#fff'; g.font = '800 20px Inter'; g.textBaseline = 'middle'; g.fillText('BOARDING PASS · 登机牌', 18, 24);
        g.fillStyle = '#1b1b1f'; g.font = '800 64px Inter'; g.textBaseline = 'alphabetic'; g.fillText('SHA', 22, 128); g.fillText('LJG', 290, 128);
        g.font = `500 20px ${SANS}`; g.fillStyle = '#555'; g.fillText('上海', 26, 160); g.fillText('丽江', 294, 160);
        g.strokeStyle = '#1f5fa8'; g.lineWidth = 2; g.setLineDash([6, 6]); g.beginPath(); g.moveTo(170, 108); g.lineTo(270, 108); g.stroke(); g.setLineDash([]);
        g.font = '500 16px Inter'; g.fillStyle = '#333'; g.fillText('SEAT 12A · GATE 7 · 07:40', 26, 192);
        g.fillStyle = '#1b1b1f'; for (let i = 0; i < 46; i++) g.fillRect(w - 70 + (i % 2) * 0, 56 + i * 3.1, 46 * (0.4 + hsh(i) * 0.6), 1.6);
      } }), S1[0] + 40, S1[1] + 40, -0.06, 0.25, { from: [-300, 340], frot: -0.15 });
  }
  CP.tape(k, S1[0] - 210, S1[1] - 50, -0.8, 120, 0.6);

  CP.instax(k, scenery('snow'), S2[0] - 40, S2[1] - 40, -0.07, 3.75, { w: 400, h: 330, capCN: 'DAY 3 · 雪山下看日出', capSize: 26, o: { from: [-200, -380], frot: 0.2 } });

  // ---- stop 3: riso sea print + postmark
  { const w = 470, h = 360, ol = k.outline(w, h, { sides: 'cccc', cj: 2.5 }), pic = scenery('sea');
    k.add(k.makePiece({ w, h, pad: 14, ol, z: 1.25, gloss: 0.06, tooth: 0.4, edge: 0.4, relief: k.curl(0, h, 120, 1.5),

      } }), S3[0] + 60, S3[1] + 20, 0.07, 7.75, { from: [380, -200], frot: 0.14 });

function drawRoute(t) {

function cam(t) {

  const c0 = { z: 1.62, cx: S1[0] + 60, cy: S1[1] - 10 };
