<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>08 · 电竞馆 · 零点电竞</title>
<script src="../lib/core.js"></script><script src="../lib/hud.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 08 赛博 HUD · 行业示例：电竞馆 =====
   First person, like the opening of a shooter. We walk down the aisle of an esports hall captured as a
   point cloud - rows of glowing monitors and gaming chairs, neon strips overhead - with a game HUD on top:
   health/armour bars, a minimap, a kill-feed that announces the venue's specs, a crosshair. At the far wall
   the crosshair acquires the dark sign, locks, and it flickers on in neon. */
const { E, clamp, inv, lerp } = Reel;
const stage = Reel.makeStage('#02060a');
const C = Reel.cfg({ brand: '零点电竞', sub: '60 台高配 · 通宵 ¥39 · 开黑包间' });
const ctx = HUD.init(stage); const K = HUD.K, h1 = HUD.h1;
// ---- the hall: a 3 m centre aisle, rows of desks running out to both walls, monitors facing us
const ROOM = { w: 12, len: 84, h: 4.6 };
for (let z = -6; z < ROOM.len; z += 0.33) for (let x = -ROOM.w; x <= ROOM.w; x += 0.33) HUD.add(x, 0, z, 2);           // floor grid
for (let z = -6; z < ROOM.len; z += 0.25) for (const x of [-1.6, 1.6]) HUD.add(x, 0.02, z, 5);                     // aisle LED
for (let z = -6; z < ROOM.len; z += 0.4) for (const x of [-5, 0, 5]) HUD.add(x, ROOM.h, z, x ? 5 : 6);                // ceiling strips
for (let z = 0; z < ROOM.len; z += 6) for (let x = -11; x <= 11; x += 0.4) HUD.add(x, ROOM.h, z, 6);                   // cross beams
for (const sx of [-1, 1]) for (let z = -6; z < ROOM.len; z += 0.4) for (let y = 0; y < ROOM.h; y += 0.4) if (h1(z * 3 + y * 7 + sx) > 0.72) HUD.add(sx * ROOM.w, y, z, 0);   // walls
const SEATS = []; let MON = 0; const MONID = [];
for (let r = 0; r < 16; r++) for (const sx of [-1, 1]) {
  const z = 3 + r * 3.4;
  for (let x = 2.2; x <= 11.5; x += 0.3) for (let d = -0.35; d <= 0.35; d += 0.35) HUD.add(sx * x, 0.75, z + d, 0);       // desk edge
  for (let m = 0; m < 4; m++) {
    const cx = sx * (3.0 + m * 2.2);
    for (let y = 1.0; y < 1.75; y += 0.07) for (let w = -0.62; w <= 0.62; w += 0.07) { HUD.add(cx + w, y, z + 0.2, 1); MONID.push(MON); }
    SEATS.push([cx, 1.38, z + 0.2]); MON++;
    // chair back seen from behind (we walk from -z), seat
    for (let y = 0.45; y < 1.35; y += 0.09) for (let w = -0.28; w <= 0.28; w += 0.09) HUD.add(cx + w, y, z - 0.9 - (y - 0.45) * 0.15, 3);
    for (let w = -0.3; w <= 0.3; w += 0.1) for (let d = 0; d < 0.5; d += 0.1) HUD.add(cx + w, 0.45, z - 0.85 + d, 3);
  }
}
// big broadcast screens on both walls and hexagon lamps hanging over the rows
for (const sx of [-1, 1]) for (let z0 = 8; z0 < 70; z0 += 14) for (let y = 1.9; y < 4.0; y += 0.09) for (let w = -2.2; w <= 2.2; w += 0.09) HUD.add(sx * 11.9, y, z0 + w, 9);
for (let r = 0; r < 16; r += 2) for (const sx of [-1, 1]) { const cx = sx * 6.3, cz = 3 + r * 3.4; for (let a = 0; a < 6.283; a += 0.06) HUD.add(cx + Math.cos(a) * 1.3, 3.6, cz + Math.sin(a) * 1.3, 8); for (let y = 3.6; y < ROOM.h; y += 0.15) HUD.add(cx, y, cz, 8); }
const NWORLD = HUD.PX.length;
// ---- the sign on the back wall, sampled from text
(function () {
  const c = document.createElement('canvas'); c.width = 900; c.height = 220; const g = c.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#fff'; g.font = '900 170px "Noto Sans CJK SC"'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('零点电竞', 450, 115);
  window.__signDraw = () => { const d = g.getImageData(0, 0, 900, 220).data; for (let y = 0; y < 220; y += 3) for (let x = 0; x < 900; x += 3) if (d[(y * 900 + x) * 4 + 3] > 128) HUD.add((x - 450) * 0.018, 3.2 - (y - 110) * 0.018, ROOM.len - 0.5, 7); };
})();
// camera walk
function camAt(t) {
  const walk = E.inOutSine(clamp((t - 0.6) / 9.4));
  const z = lerp(-5, 46, walk) + 13 * E.inOutCubic(clamp((t - 11.5) / 2.4)), bob = Math.sin(walk * 60) * 0.06 * (t > 0.6 && t < 10 ? 1 : 0);
  let yaw = 0.18 * Math.sin(t * 0.8) * (1 - clamp((t - 8.5) / 1.5));
  if (t > 2.6 && t < 4.6) yaw += 0.55 * Math.sin(Math.PI * (t - 2.6) / 2.0);         // glance at the monitors
  return { x: Math.sin(t * 0.6) * 0.4, y: 1.6 + bob, z, yaw, pitch: -0.07 + 0.07 * clamp((t - 9) / 1.5), roll: Math.sin(walk * 30) * 0.008, F: 1100, cx: 960, cy: 540 };
}
const FEED = [[3.0, '▶ RTX 4090 × 60 已就位'], [4.6, '▶ 240Hz 电竞屏 · 0.5ms'], [6.0, '▶ 开黑包间 × 8'], [7.4, '▶ 通宵 ¥39 · 饮料畅饮'], [8.8, '▶ 千兆专线 · 延迟 3ms']];
Reel.scene({
  duration: 15, fps: 30,
  fonts: [`500 20px ${HUD.MONO}`, '900 170px "Noto Sans CJK SC"', '700 26px "Noto Sans CJK SC"'],
  setup() { window.__signDraw(); },
  cues: [{ t: 0.1, sfx: 'boot', gain: 0.6 }, { t: 0.6, sfx: 'whoosh', gain: 0.3 }, ...Array.from({ length: 18 }, (_, i) => ({ t: +(0.9 + i * 0.52).toFixed(2), sfx: 'step_soft', gain: 0.3 })),
    ...FEED.map(([x]) => ({ t: x, sfx: 'beep', gain: 0.45 })), { t: 10.4, sfx: 'beep', gain: 0.4 }, { t: 10.8, sfx: 'beep', gain: 0.5 }, { t: 11.2, sfx: 'lock', gain: 0.7 }, { t: 11.35, sfx: 'neon', gain: 0.7 }, { t: 12.0, sfx: 'impact_soft', gain: 0.6 }],
  render(t) {
    HUD.cam = camAt(t);
    ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#03030a'; ctx.fillRect(0, 0, HUD.W, HUD.H);
    const lit = E.outCubic(clamp((t - 11.3) / 0.25)) * (Math.floor(t * 30) % 7 === 0 && t < 12 ? 0.3 : 1);
    HUD.points((i, d) => {
      const k = HUD.PK[i], fog = clamp(1.25 - d / 70), mfog = clamp(1.35 - d / 34) ** 1.5;
      if (k === 7) { const a = lerp(0.07, 0.55, lit); return [lit > 0.5 ? 'rgba(255,60,150,' : 'rgba(120,120,160,', a * clamp(1.4 - d / 120), 1.3]; }
      if (k === 1) { const hue = (Math.floor(HUD.PZ[i] / 3.4) * 47 + Math.round(HUD.PX[i] / 2.2) * 83 + Math.floor(t * 1.5) * 29) % 360; const hy = HUD.PY[i]; const c = hue < 120 ? [80, 200, 255] : hue < 240 ? [255, 90, 180] : [120, 255, 160]; const scan = 0.6 + 0.4 * Math.sin(hy * 20 + t * 6); return [`rgba(${c[0]},${c[1]},${c[2]},`, 0.85 * mfog * scan, d < 12 ? 1.6 : 1.0]; }
      if (k === 5) return ['rgba(255,46,136,', 0.9 * fog];
      if (k === 8) return ['rgba(255,194,61,', 0.8 * mfog, d < 10 ? 1.4 : 1];
      if (k === 9) { const zz = HUD.PZ[i], yy = HUD.PY[i], sc = Math.round((zz - 8) / 14), u = ((zz - 8) - sc * 14 + 2.2) / 4.4, v = (yy - 1.9) / 2.1;
        // a stylised match broadcast: two team colours split by a moving front + a scoreboard bar
        const front = 0.5 + 0.18 * Math.sin(t * 1.3 + sc), bar = v > 0.86; const red = u < front;
        const c = bar ? [255, 255, 255] : red ? [255, 70, 120] : [70, 200, 255]; const flick = 0.75 + 0.25 * Math.sin(u * 40 + t * 9 + v * 12);
        return [`rgba(${c[0]},${c[1]},${c[2]},`, (bar ? 0.5 : 0.55) * flick * clamp(1.3 - d / 60), d < 14 ? 1.5 : 1.1]; }
      if (k === 6) return ['rgba(95,246,255,', 0.8 * fog];
      if (k === 2) return ['rgba(80,110,230,', 0.42 * fog * clamp(1.6 - d / 30)];
      if (k === 3) return ['rgba(160,140,255,', 0.6 * mfog];
      return ['rgba(95,246,255,', 0.55 * fog];
    }, { near: 0.4, far: 110, pw: 2.0 });
    // neon glow bloom on the lit sign
    if (lit > 0) { const p = HUD.proj(0, 3.2, ROOM.len - 0.5); ctx.save(); ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(p[0] * K, p[1] * K, 10, p[0] * K, p[1] * K, 520 * K); g.addColorStop(0, `rgba(255,60,150,${0.35 * lit})`); g.addColorStop(1, 'rgba(255,60,150,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, HUD.W, HUD.H); ctx.restore(); }
    // tag on a monitor while glancing
    if (t > 3.0 && t < 4.5) { const s = SEATS[3 * 8 + 4]; const p = HUD.proj(...s); if (p[2] > 1) { const a = clamp((t - 3.0) / 0.2) * (1 - clamp((t - 4.2) / 0.3)); HUD.corners(p[0] - 70, p[1] - 50, 140, 100, 18, HUD.AMB, 2, a); HUD.txt('240Hz · 27"', p[0] + 80, p[1] - 40, 18, HUD.AMB, 'left', a); } }
    // ---- game HUD
    const boot = (a, d = 0.35) => E.outCubic(clamp((t - a) / d));
    const b1 = boot(0.3);
    HUD.txt('ROUND 1 · 进入战区', 960, 70, 24, '#ffffff', 'center', b1 * (1 - clamp((t - 2.6) / 0.4)), '"Noto Sans CJK SC"', 700);
    // health / armour
    if (b1 > 0) { HUD.rect(90, 940, 380, 22, '#2b0b18', 0.8, true); HUD.rect(90, 940, 380 * b1, 22, HUD.GRN, 0.9, true); HUD.txt('体力 100', 90, 915, 18, HUD.GRN, 'left', b1, '"Noto Sans CJK SC"', 700);
      HUD.rect(90, 980, 380, 14, '#0b1a2b', 0.8, true); HUD.rect(90, 980, 300 * b1, 14, HUD.CY, 0.9, true); HUD.txt('护甲 80', 480, 987, 16, HUD.CY, 'left', b1, '"Noto Sans CJK SC"', 700); }
    const b2 = boot(0.6);
    if (b2 > 0) { HUD.txt('机位', 1700, 930, 20, HUD.AMB, 'right', b2, '"Noto Sans CJK SC"', 700); HUD.txt(`${String(60 - Math.min(18, Math.floor(clamp((t - 0.6) / 9.4) * 18))).padStart(2, '0')}`, 1830, 960, 64, '#ffffff', 'right', b2, 'Inter', 800); HUD.txt('/ 60', 1830, 1010, 20, HUD.AMB, 'right', b2); }
    // minimap
    const b3 = boot(0.8);
    if (b3 > 0) { const mx = 1600, my = 90, mw = 230, mh = 300; HUD.rect(mx, my, mw, mh, '#06121a', 0.75 * b3, true); HUD.corners(mx, my, mw, mh, 14, HUD.CY, 2, b3);
      for (const sx of [-1, 1]) for (let i = 0; i < 16; i++) HUD.rect(mx + mw / 2 + sx * 60 - 40, my + mh - 20 - (3 + i * 3.4 + 5) / ROOM.len * (mh - 30), 80, 6, HUD.CY, 0.35 * b3, true);
      const pz = my + mh - 20 - (HUD.cam.z + 5) / ROOM.len * (mh - 30); ctx.fillStyle = HUD.AMB; ctx.beginPath(); ctx.moveTo((mx + mw / 2) * K, (pz - 12) * K); ctx.lineTo((mx + mw / 2 - 8) * K, (pz + 8) * K); ctx.lineTo((mx + mw / 2 + 8) * K, (pz + 8) * K); ctx.fill();
      HUD.txt('MINIMAP', mx, my - 16, 14, HUD.CY, 'left', b3); }
    // kill feed
    FEED.forEach(([t0, s], i) => { const a = clamp((t - t0) / 0.2) * (1 - clamp((t - t0 - 3.2) / 0.4)); if (a <= 0) return; const y = 440 + (FEED.filter(([x]) => x <= t && x > t0).length) * 52;
      HUD.rect(1340 + (1 - a) * 80, y - 22, 500, 44, '#1a0612', 0.75 * a, true); HUD.rect(1340 + (1 - a) * 80, y - 22, 6, 44, HUD.PINK, a, true); HUD.txt(s, 1360 + (1 - a) * 80, y, 22, '#ffffff', 'left', a, '"Noto Sans CJK SC"', 700); });
    // crosshair -> lock on the sign
    const sp = HUD.proj(0, 3.2, ROOM.len - 0.5);
    const acq = clamp((t - 10.2) / 1.0), locked = t > 11.2;
    const cx = lerp(960, sp[0], E.inOutCubic(acq)), cy = lerp(540, sp[1], E.inOutCubic(acq));
    const size = locked ? lerp(110, 560, E.outCubic(clamp((t - 11.2) / 0.3))) : 40 + 40 * acq;
    const col = locked ? HUD.PINK : acq > 0 ? HUD.AMB : '#ffffff';
    if (t < 12.0) {
      if (!locked) { HUD.line(cx - 22, cy, cx - 8, cy, col, 2.5); HUD.line(cx + 8, cy, cx + 22, cy, col, 2.5); HUD.line(cx, cy - 22, cx, cy - 8, col, 2.5); HUD.line(cx, cy + 8, cx, cy + 22, col, 2.5); }
      if (acq > 0) { HUD.corners(cx - size / 2, cy - size * 0.28, size, size * 0.56, 22, col, 2.5, Math.min(1, acq * 3)); HUD.txt(locked ? 'LOCKED · 目标锁定' : 'ACQUIRING' + '.'.repeat(1 + Math.floor(t * 4) % 3), cx - size / 2, cy - size * 0.28 - 22, 20, col, 'left', 1, '"Noto Sans CJK SC"', 700); }
    }
    if (t < 1.2) HUD.txt('LOADING MAP...' + (Math.floor(t * 8) % 2 ? '_' : ''), 960, 760, 22, HUD.CY, 'center', clamp(t * 4) * (1 - clamp((t - 0.9) / 0.3)), HUD.MONO, 700);
    if (t > 12.0) { ctx.fillStyle = `rgba(3,3,10,${0.35 * E.outCubic(clamp((t - 12) / 0.4))})`; ctx.fillRect(0, 0, HUD.W, HUD.H); }
    if (t > 12.2) { const a = E.outCubic(clamp((t - 12.2) / 0.5)); const q = HUD.proj(0, 3.2, ROOM.len - 0.5);
      ctx.save(); ctx.font = `700 ${30 * K}px "Noto Sans CJK SC"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; if ('letterSpacing' in ctx) ctx.letterSpacing = `${10 * K}px`;
      ctx.globalAlpha = a; ctx.fillStyle = HUD.CY; ctx.fillText(C.sub, 960 * K, (q[1] + 210 + (1 - a) * 20) * K); ctx.restore();
      HUD.txt('PRESS START · 今晚开黑', 960, q[1] + 270, 22, '#ffffff', 'center', a * (Math.floor(t * 2.5) % 2 ? 1 : 0.35), HUD.MONO, 700); }
    let g = 0; for (const [a, d] of [[11.2, 0.2], [0.5, 0.08], [12.0, 0.15]]) if (t > a && t < a + d) g = Math.max(g, 1 - (t - a) / d);
    HUD.post(t, g, 0.5, 0.15);
  },
});
</script></body></html>
