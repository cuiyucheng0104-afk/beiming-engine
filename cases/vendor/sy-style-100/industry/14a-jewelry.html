<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>14 · 珠宝首饰 · 素银</title>
<script src="../lib/core.js"></script><script src="../lib/gl.js"></script><script src="../lib/rm.js"></script><script src="../lib/chrome.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 14 液态金属 · 行业示例：珠宝首饰 =====
   A slow macro orbit round a jeweller's bench in the dark. A drop of molten silver falls in slow motion and
   spreads into a trembling puddle; the puddle stands up and pulls itself into a ring; a faceted stone drops
   onto it and is soldered in; a second, smaller ring rises and links through the first. The pair turns
   under a passing light bar and the studio's name fades in. */
const { E, clamp, lerp, inv, spring } = Reel;
const stage = Reel.makeStage('#030305');
Reel.ownJitter = true;
const C = Reel.cfg({ brand: '素银', en: 'SUYIN  SILVER', sub: '手工银饰 · 情侣对戒 · 免费刻字' });
const rm = CHROME.make(stage, {
  rm: { sat: 0.72 },
  uniforms: `uniform vec4 uDrop, uPud, uR1, uR2, uGem; uniform float uM, uM2;`,
  map: `
float ring(vec3 p, vec4 c, float R, float r, float plane){
  vec3 q = rotY(c.w) * (p - c.xyz);
  vec2 qq = plane < .5 ? vec2(length(q.xy) - R, q.z) : vec2(length(q.yz) - R, q.x);
  return length(qq) - r;
}
float mapL(vec3 p){
  float d = 1e3;
  if (uDrop.w > 0.) d = sdEllipsoid(p - uDrop.xyz, vec3(uDrop.w*.85, uDrop.w*1.3, uDrop.w*.85));
  float pud = 1e3;
  if (uPud.x > 0.) { vec3 q = p - vec3(0., uPud.y*.3, 0.); float rho = length(q.xz); pud = sdEllipsoid(q, vec3(uPud.x, uPud.y, uPud.x)) - uPud.z*sin(rho*22. - uPud.w)*smoothstep(1.2, .05, rho); }
  float r1 = 1e3;
  if (uM > 0.) r1 = ring(p, uR1, .5, .072, 0.);
  float body = uM <= 0. ? pud : (uM >= 1. ? r1 : mix(pud, r1, uM));
  d = smin(d, body, .12);
  if (uGem.z > 0.) { vec3 g = p - vec3(0., uGem.x, 0.); g = rotY(uR1.w*1.3 + .4) * g; float oct = (abs(g.x) + abs(g.y)*1.2 + abs(g.z) - uGem.y) * .57735; d = smin(d, max(oct, -g.y - uGem.y*.55), .025); }
  if (uM2 > 0.) { vec3 q = rotY(uR1.w) * (p - vec3(0., uR2.y, 0.)) - vec3(.45, 0., 0.); d = min(d, length(vec2(length(q.yz) - .38, q.x)) - .055); }
  return d;
}`,
});
const ov = Reel.canvas2d(stage);
const G = 9.8, Y0 = 3.2, DR = 0.3, TS = 0.15;
const slow = 0.35;                                           // slow-motion factor for the fall
function state(t) {
  const S = {};
  const tf = (t - TS) * slow; const fallT = Math.sqrt(2 * (Y0 - DR) / G);
  if (t < TS) S.drop = [0, Y0 + 1, 0, 0];
  else if (tf < fallT) { const y = Y0 - 0.5 * G * tf * tf; S.drop = [0, y, 0, DR]; }
  else S.drop = [0, 0, 0, 0];
  const hitT = TS + fallT / slow, h = t - hitT;
  // puddle spreading with a slow-motion ripple
  if (h > 0) { const sp = spring(h * 0.6, { k: 160, c: 12 }); S.pud = [0.24 + 0.24 * sp, Math.max(0.16, 0.32 * (1 - 0.45 * sp)), 0.03 * Math.exp(-h * 1.2), h * 9]; } else S.pud = [0, 0, 0, 0];
  // the puddle stands up into a ring
  const m = E.inOutCubic(clamp((t - 3.1) / 1.6)); S.m = m;
  const spin = lerp(-0.9, 0, E.outCubic(clamp((t - 3.1) / 2.0))) + 0.32 * Math.max(0, t - 4.7);
  const rise = lerp(0.58, 0.75, E.outBack(clamp((t - 4.5) / 1.0)));
  S.r1 = [0, rise, 0, spin];
  // the stone drops in and is soldered on
  const gt = t - 5.6; S.gem = gt > 0 ? [lerp(2.6, 0.75 + 0.5 + 0.072 + 0.07, E.outBounce ? E.outBounce(clamp(gt / 0.7)) : E.outCubic(clamp(gt / 0.7))), 0.11, 1, 0] : [0, 0, 0, 0];
  // second ring rises through the first and links
  const r2 = E.inOutCubic(clamp((t - 8.0) / 1.6)); S.m2 = r2;
  S.r2 = [0, lerp(-0.45, 0.75, r2), 0, spin];
  return S;
}
function camera(t) {
  const az = lerp(-0.55, 1.05, E.inOutSine(clamp(t / 15))), el = lerp(0.12, 0.2, E.inOutSine(clamp((t - 3) / 6)));
  const dist = lerp(3.1, 2.65, E.inOutSine(clamp((t - 2) / 6))) + 0.45 * E.inOutSine(clamp((t - 9.5) / 3));
  const ta = [0, lerp(0.15, 0.82, E.inOutSine(clamp((t - 2.6) / 2.4))), 0];
  // the opening tilts up with the falling drop
  if (t < 2.6) ta[1] = Math.max(0.15, Math.min(2.2, state(t).drop[3] > 0 ? state(t).drop[1] : 0.15));
  return { ro: [ta[0] + dist * Math.sin(az) * Math.cos(el), ta[1] + dist * Math.sin(el) + 0.1, ta[2] + dist * Math.cos(az) * Math.cos(el)], ta };
}
Reel.scene({
  duration: 15, fps: 30,
  fonts: ['200 30px "Inter Display"', '600 30px "Inter Display"', '300 40px "Noto Serif CJK SC"', '500 30px "Noto Sans CJK SC"'],
  cues: [{ t: 2.35, sfx: 'drip', gain: 0.7 }, { t: 2.4, sfx: 'splash', gain: 0.6 }, { t: 3.2, sfx: 'stretch', gain: 0.6 }, { t: 4.6, sfx: 'blob', gain: 0.5 }, { t: 6.25, sfx: 'clink', gain: 0.8 }, { t: 8.1, sfx: 'stretch', gain: 0.45 }, { t: 9.55, sfx: 'clink', gain: 0.7 }, { t: 10.6, sfx: 'swell', gain: 0.4 }, { t: 11.6, sfx: 'sparkle', gain: 0.5 }],
  render(t) {
    const S = state(t), cam = camera(t);
    rm.set('uDrop', S.drop).set('uPud', S.pud).set('uM', S.m).set('uR1', S.r1).set('uGem', S.gem).set('uM2', S.m2).set('uR2', S.r2);
    CHROME.common(rm, { ro: cam.ro, ta: cam.ta, f: 2.9, mn: [-1.3, -0.1, -1.3], mx: [1.3, Math.max(1.8, S.drop[1] + 0.5, S.gem[0] + 0.3), 1.3], sweep: [lerp(-1.4, 1.4, E.inOutSine(inv(10.4, 12.4, t))), 3.0 * Math.sin(Math.PI * clamp((t - 10.4) / 2))], irid: 0.08, fade: E.outCubic(clamp(t / 0.5)), step: S.m > 0 && S.m < 1 ? 0.55 : 0.8 });
    const fp = t < 2.6 ? [0, Math.max(S.drop[1], 0.1), 0] : [0, 0.8, 0];
    rm.render(t, { focus: Math.hypot(cam.ro[0] - fp[0], cam.ro[1] - fp[1], cam.ro[2] - fp[2]), aperture: 24, maxCoc: 16 });
    const { ctx, begin } = ov; begin(); ctx.clearRect(0, 0, 1920, 1080);
    const a = E.outCubic(clamp((t - 11.2) / 0.9));
    if (a > 0) {
      ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(240,238,255,.95)';
      ctx.font = '300 92px "Noto Serif CJK SC"'; if ('letterSpacing' in ctx) ctx.letterSpacing = `${lerp(60, 36, a)}px`; ctx.fillText(C.brand, 150, 250);
      ctx.font = '200 26px "Inter Display"'; if ('letterSpacing' in ctx) ctx.letterSpacing = '16px'; ctx.fillStyle = 'rgba(220,215,240,.8)'; ctx.fillText(C.en, 156, 310);
      ctx.globalAlpha = E.outCubic(clamp((t - 11.8) / 0.8)); ctx.font = '500 26px "Noto Sans CJK SC"'; if ('letterSpacing' in ctx) ctx.letterSpacing = '8px'; ctx.fillText(C.sub, 154, 370); ctx.restore();
    }
  },
});
</script></body></html>
