<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>14 · 精酿啤酒 · 铁锚精酿</title>
<script src="../lib/core.js"></script><script src="../lib/gl.js"></script><script src="../lib/rm.js"></script><script src="../lib/chrome.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 14 液态金属 · 行业示例：精酿啤酒 =====
   Cheers, in liquid copper. Side-on tracking shot: two blobs of molten copper fly at each other like two
   glasses in a toast, stretch with speed, and collide in a speed ramp - a sheet of metal flares out
   sideways, droplets spray and fall back - the merged mass wobbles, then snaps into a crimped bottle cap
   that flips like a tossed coin and lands with a ring. Push in on the cap's embossed anchor. */
const { E, clamp, lerp, inv, spring } = Reel;
const stage = Reel.makeStage('#050302');
Reel.ownJitter = true;
const C = Reel.cfg({ brand: '铁锚精酿', en: 'ANCHOR  BREWING', sub: '每周上新 · 鲜啤打酒外带' });
const NS = 10;
const rm = CHROME.make(stage, {
  warm: true, rm: { sat: 1.0 },
  uniforms: `uniform vec4 uA, uB, uSheet, uCap, uCapR; uniform vec4 uSp[${NS}]; uniform int uNS; uniform float uM;`,
  map: `
float anchor(vec2 q){ // embossed anchor on the cap face (2D, in cap units)
  float ring = abs(length(q - vec2(0., .2)) - .045) - .014;
  float shank = max(abs(q.x) - .016, abs(q.y + .0) - .2);
  float bar = max(abs(q.x) - .1, abs(q.y - .12) - .014);
  vec2 a = q - vec2(0., -.05); float arc = max(abs(length(a) - .17) - .016, a.y + .02);
  return min(min(ring, shank), min(bar, arc));
}
float cap(vec3 p){
  vec3 q = p - uCap.xyz; float c = cos(uCapR.x), s = sin(uCapR.x); q.yz = mat2(c, -s, s, c) * q.yz; q.xz = mat2(cos(uCapR.y), -sin(uCapR.y), sin(uCapR.y), cos(uCapR.y)) * q.xz;
  float th = atan(q.z, q.x), rho = length(q.xz);
  float R = .42 + .022 * cos(21. * th);
  float body = max(rho - R, abs(q.y) - .07 + .03 * smoothstep(.3, .45, rho));
  body = max(body, -(q.y - .04) - 1.);                     // solid
  float emb = anchor(q.xz / 1.0 * vec2(1., -1.));
  body -= .012 * smoothstep(.01, -.004, emb) * step(0., q.y);
  return body * .8;
}
float mapL(vec3 p){
  float d = 1e3;
  if (uA.w > 0.) { vec3 q = p - uA.xyz; d = sdEllipsoid(q, vec3(uA.w * (1. + uSheet.z), uA.w / sqrt(1. + uSheet.z), uA.w / sqrt(1. + uSheet.z))); }
  if (uB.w > 0.) { vec3 q = p - uB.xyz; d = smin(d, sdEllipsoid(q, vec3(uB.w * (1. + uSheet.z), uB.w / sqrt(1. + uSheet.z), uB.w / sqrt(1. + uSheet.z))), .25); }
  if (uSheet.x > 0.) { vec3 q = p - vec3(0., uSheet.w, 0.); float r = length(q.yz); float rim = .03 + .02 * sin(9. * atan(q.z, q.y)); float sheet = max(abs(q.x) - (.03 + .05 * (1. - r / max(uSheet.x, .01))), r - uSheet.x - rim); d = smin(d, sheet, .08); }
  for (int i=0;i<${NS};i++){ if (i >= uNS) break; d = smin(d, length(p - uSp[i].xyz) - uSp[i].w, .05); }
  if (uM > 0.) d = uM >= 1. ? cap(p) : mix(d, cap(p), uM);
  return d;
}`,
});
const ov = Reel.canvas2d(stage);
const HIT = 2.6, REND = Number(Reel.Q.get('rend') ?? -0.4);
function ramp(t) { // speed-ramped clock: normal, slow near the hit, normal after
  if (t < HIT - 0.3) return t;
  if (t < HIT + 1.6) { const u = t - (HIT - 0.3); return HIT - 0.3 + u * 0.18; }
  return HIT - 0.3 + 1.9 * 0.18 + (t - HIT - 1.6);
}
function state(t) {
  const S = { a: [0, 0, 0, 0], b: [0, 0, 0, 0], sheet: [0, 0, 0, 0], sp: [], m: 0, cap: [0, 0.8, 0, 0], capR: [0, 0, 0, 0] };
  const tr = ramp(t), hitR = ramp(HIT);
  const Y = 0.8;
  if (tr < hitR) { const u = (hitR - tr); const x = Math.min(2.6, u * 1.6 + 0.0); S.a = [-0.28 - x, Y + 0.05 * Math.sin(t * 3), 0, 0.3]; S.b = [0.28 + x, Y + 0.05 * Math.cos(t * 3), 0, 0.3]; S.sheet = [0, 0, Math.min(0.6, 0.25 + x * 0.1), Y]; }
  else {
    const h = tr - hitR;   // sim seconds after impact
    const sq = spring(h * 3, { k: 140, c: 7 });
    const merge = clamp(h / 0.25);
    S.a = [lerp(-0.28, -0.05, merge), Y, 0, lerp(0.3, 0.34, merge)]; S.b = [lerp(0.28, 0.05, merge), Y, 0, lerp(0.3, 0.34, merge)];
    const fl = Math.sin(Math.PI * clamp(h / 0.75));
    S.sheet = [0.95 * fl, 0, -0.35 * (1 - sq) * 0.6, Y];
    // spray: droplets thrown radially in the yz plane, falling back under gravity
    for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + 0.3, v = 1.6 + (i % 3) * 0.35, w = h - 0.05; if (w <= 0) continue; const y = Y + Math.sin(a) * v * w - 4.9 * w * w, z = Math.cos(a) * v * w; if (y < 0.03) continue; S.sp.push(((i % 2) - 0.5) * 0.08, y, z, 0.035 + (i % 3) * 0.01); }
  }
  // merged mass -> crimped cap
  S.m = E.inOutCubic(clamp((t - 5.2) / 1.1));
  // the cap flips like a tossed coin and lands
  const ft = t - 6.6; let cy = 0.8, rx = 0, ry = 0.3 * t;
  if (ft > 0) { const air = 0.703; if (ft < air) { cy = 0.8 + 2.2 * ft - 4.6 * ft * ft; rx = ft / air * Math.PI * 4; } else { const b = ft - air; cy = 0.075 + 0.05 * Math.abs(Math.sin(b * 14)) * Math.exp(-b * 6); rx = Math.PI * 4 + 0.25 * Math.sin(b * 22) * Math.exp(-b * 4); } }
  if (ft > 0 && cy < 0.075) cy = 0.075;
  const ryE = lerp(ry * 0.4, REND, E.inOutCubic(clamp((t - 6.6) / 1.4))); S.cap = [0, cy, 0, 0]; S.capR = [rx, ryE, 0, 0];
  return S;
}
function camera(t) {
  // side-on, tracking slightly with the action, then tilting down onto the landed cap and pushing in
  const land = E.inOutCubic(clamp((t - 8.2) / 2.2));
  const ta = [0, lerp(0.8, 0.07, land), 0];
  const az = lerp(0.0, 0.25, E.inOutSine(clamp(t / 8))) + 0.15 * land, el = lerp(0.08, 1.05, land), dist = lerp(lerp(3.6, 3.1, E.inOutSine(clamp(t / 6))), 1.95, land) - 0.15 * E.inOutSine(clamp((t - 10.5) / 4));
  return { ro: [ta[0] + dist * Math.sin(az) * Math.cos(el), ta[1] + dist * Math.sin(el), ta[2] + dist * Math.cos(az) * Math.cos(el)], ta };
}
Reel.scene({
  duration: 15, fps: 30,
  fonts: ['200 30px "Inter Display"', '900 60px "Noto Sans CJK SC"', '500 30px "Noto Sans CJK SC"'],
  cues: [{ t: 0.3, sfx: 'whoosh', gain: 0.4 }, { t: 1.8, sfx: 'riser_short', gain: 0.4 }, { t: HIT, sfx: 'clink', gain: 0.9 }, { t: HIT + 0.02, sfx: 'splash', gain: 0.7 }, { t: 4.4, sfx: 'drip', gain: 0.5 }, { t: 5.2, sfx: 'morph', gain: 0.6 }, { t: 6.6, sfx: 'whoosh', gain: 0.4 }, { t: 7.3, sfx: 'clink', gain: 0.8 }, { t: 7.5, sfx: 'tick', gain: 0.4 }, { t: 10.8, sfx: 'swell', gain: 0.35 }, { t: 11.6, sfx: 'sparkle', gain: 0.45 }],
  render(t) {
    const S = state(t), cam = camera(t);
    const sp = new Float32Array(NS * 4); S.sp.slice(0, NS * 4).forEach((v, i) => (sp[i] = v));
    rm.set('uA', S.a).set('uB', S.b).set('uSheet', S.sheet).set('uSp', sp).set('uNS', { __ints: 1, v: Math.min(NS, S.sp.length / 4) }).set('uM', S.m).set('uCap', S.cap).set('uCapR', S.capR);
    CHROME.common(rm, { ro: cam.ro, ta: cam.ta, f: 2.9, mn: [-3.2, -0.1, -1.6], mx: [3.2, 2.6, 1.6], metal: [0.95, 0.62, 0.48], sweep: [lerp(-1.4, 1.4, E.inOutSine(inv(10.6, 12.6, t))), 3.0 * Math.sin(Math.PI * clamp((t - 10.6) / 2))], irid: 0.05, fade: E.outCubic(clamp(t / 0.4)), step: S.m > 0 && S.m < 1 ? 0.55 : 0.75 });
    rm.render(t, { focus: Math.hypot(cam.ro[0] - cam.ta[0], cam.ro[1] - cam.ta[1], cam.ro[2] - cam.ta[2]), aperture: 26, maxCoc: 16 });
    const { ctx, begin } = ov; begin(); ctx.clearRect(0, 0, 1920, 1080);
    if (t > HIT - 0.05 && t < HIT + 0.08) { ctx.fillStyle = `rgba(255,220,180,${0.35 * (1 - Math.abs(t - HIT) / 0.08)})`; ctx.fillRect(0, 0, 1920, 1080); }
    const a = E.outCubic(clamp((t - 11.3) / 0.8));
    if (a > 0) {
      ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,236,215,.96)';
      ctx.font = '900 80px "Noto Sans CJK SC"'; if ('letterSpacing' in ctx) ctx.letterSpacing = `${lerp(40, 22, a)}px`; ctx.fillText(C.brand, 970, 170);
      ctx.font = '200 24px "Inter Display"'; if ('letterSpacing' in ctx) ctx.letterSpacing = '16px'; ctx.fillStyle = 'rgba(240,200,170,.85)'; ctx.fillText(C.en, 968, 222);
      ctx.globalAlpha = E.outCubic(clamp((t - 11.9) / 0.8)); ctx.font = '500 26px "Noto Sans CJK SC"'; if ('letterSpacing' in ctx) ctx.letterSpacing = '8px'; ctx.fillText(C.sub, 966, 1000); ctx.restore();
    }
  },
});
</script></body></html>
