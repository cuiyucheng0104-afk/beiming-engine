<script>
/* ===== 01 剧情动画 · 巷口咖啡 =====
   Golden-age theatrical cartoon: gouache background, inked cels, animated on twos, film gate weave.
   A sleepwalking bear drifts to the coffee hatch, yawns, falls asleep standing; the steam curls into a finger,
   tickles his nose, he floats to the cup, gulps - TAKE (eyes pop, fur bristles, cap flies) - zips off, zips back:
   "再来一杯！". Iris out on a wink, title card. */
const { E, clamp, inv, lerp, hash, noise1 } = Reel;
const T = Toon;
const stage = Reel.makeStage('#0c0807');
const C = Reel.cfg({ brand: '巷口咖啡', tag: '每天第一杯 · 叫醒整条街', say: '再来一杯！', sig: '肖雄 2026' });
const L = Reel.canvas2d(stage);
const ctx = L.ctx, K = L.k;
const WW = 2100;                                   // painted background width (world units)
let BG = null, FILM = null;

  fur: '#9b6541', furS: '#71452a', cream: '#f5ddb2', creamS: '#d9b585', nose: '#2b1a14',

  cat: '#e8944a', catS: '#bf6f30', cuff: '#f4efe3', cuffS: '#c9c0ad',

// ---------------------------------------------------------------- painted background
function paintBG() {

  }

  for (let i = 0; i < 6; i++) T.wash(g, R(840, 720 + i * 30, 280, 6), 'rgba(120,90,70,.35)', null, { edge: 0 });

  T.wash(g, LB, '#efc095', '#d9966a', { edge: 0.3, edgeW: 26, blur: 14 });
  // plaster patches & stains

  for (let i = 0; i < 9; i++) { const x = hash(i * 7.1) * 860, y = hash(i * 2.9) * 700 + 60; g.fillStyle = 'rgba(150,80,40,.10)'; g.fill(T.blob(x, y, 60 + hash(i) * 70, 30 + hash(i + 3) * 40, (a) => 1 + 0.25 * Math.sin(a * 3 + i), 24)); }

  g.restore();
  // windows with teal shutters + geraniums
  for (const [x, y] of [[120, 150], [500, 150]]) {
    T.wash(g, R(x - 64, y, 60, 230), '#3f8c86', '#2d6e6a', { edge: 0.25 });          // shutters
    T.wash(g, R(x + 200, y, 60, 230), '#3f8c86', '#2d6e6a', { edge: 0.25 });
    for (let k = 0; k < 7; k++) { g.fillStyle = 'rgba(20,50,50,.35)'; g.fillRect(x - 60, y + 14 + k * 31, 52, 5); g.fillRect(x + 204, y + 14 + k * 31, 52, 5); }
    T.wash(g, R(x, y, 196, 230), '#f4e2c4', '#ead2ab', { edge: 0.2 });               // frame
    T.wash(g, R(x + 14, y + 14, 168, 200), '#4b6f8f', '#2f4a63', { edge: 0.3 });     // glass
    g.fillStyle = 'rgba(255,240,210,.32)'; g.fill(T.poly([[x + 30, y + 14], [x + 80, y + 14], [x + 30, y + 120]]));
    g.fillStyle = '#ead2ab'; g.fillRect(x + 94, y + 14, 8, 200); g.fillRect(x + 14, y + 110, 168, 8);
    T.wash(g, R(x - 10, y + 230, 216, 34), '#8a5236', '#6e3e28', { edge: 0.2 });     // flower box

  g.fillStyle = '#d8b25a'; g.fill(T.ell(372, 760, 7, 7));

  for (const [col, x, y, ww] of cloth) { T.wash(g, T.poly([[x, y], [x + ww, y + 2], [x + ww - 4, y + ww * 0.9], [x + 4, y + ww * 0.95]]), col, null, { edge: 0.25, edgeW: 8 }); }

  // ---- café building
  const CB = R(1060, -10, 1060, 902);
  T.wash(g, CB, '#f2e2c2', '#e5cda3', { edge: 0.25, edgeW: 22, blur: 12 });
  g.save(); g.clip(CB); for (let i = 0; i < 7; i++) { const x = 1080 + hash(i * 5.7) * 1000, y = 40 + hash(i * 1.3) * 260; g.fillStyle = 'rgba(160,110,60,.09)'; g.fill(T.blob(x, y, 70, 36, (a) => 1 + 0.2 * Math.sin(a * 4 + i), 24)); } g.restore();
  // upper window
  T.wash(g, R(1460, 60, 230, 200), '#f8ecd2', '#ecd9b6', { edge: 0.2 });
  T.wash(g, R(1476, 76, 198, 168), '#5b7ea0', '#3c5a78', { edge: 0.3 });
  g.fillStyle = 'rgba(255,240,210,.3)'; g.fill(T.poly([[1490, 76], [1560, 76], [1490, 190]]));
  g.fillStyle = '#ecd9b6'; g.fillRect(1571, 76, 8, 168);
  // shop front (deep green wood)
  T.wash(g, R(1100, 440, 990, 452), '#2f5f52', '#24493f', { edge: 0.3, edgeW: 18 });
  // hatch interior (warm)
  const HX = 1290, HY = 470, HW = 380, HH = 222;
  const hatch = R(HX, HY, HW, HH);
  T.wash(g, hatch, '#6a3a20', '#b9733a', { edge: 0.45, edgeW: 30, blur: 18, y0: HY, y1: HY + HH });
  g.save(); g.clip(hatch);
  const lg = g.createRadialGradient(1500, 500, 10, 1500, 520, 260); lg.addColorStop(0, 'rgba(255,214,140,.75)'); lg.addColorStop(1, 'rgba(255,200,120,0)'); g.fillStyle = lg; g.fillRect(HX, HY, HW, HH);
  for (let s = 0; s < 2; s++) { g.fillStyle = '#4a2814'; g.fillRect(HX + 10, HY + 70 + s * 64, 150, 7); for (let j = 0; j < 5; j++) { g.fillStyle = ['#d9b47a', '#9c5a2e', '#e9d7b0', '#7a4628', '#c98d4e'][(j + s * 2) % 5]; g.fill(T.rrect(HX + 18 + j * 28, HY + 36 + s * 64, 20, 34, 5)); } }
  // espresso machine (domed, chrome)
  T.wash(g, T.rrect(1470, 575, 170, 95, 12), '#cfc9bb', '#8d887c', { edge: 0.3, y0: 575, y1: 670 });
  const dome = new Path2D(); dome.moveTo(1490, 578); dome.quadraticCurveTo(1555, 500, 1620, 578); dome.closePath();
  T.wash(g, dome, '#e2dccd', '#a7a193', { edge: 0.3, y0: 520, y1: 580 });
  g.fillStyle = '#b8863c'; g.fill(T.ell(1555, 524, 9, 9));
  g.fillStyle = '#3a2c22'; for (const gx of [1510, 1598]) { g.fillRect(gx - 14, 640, 28, 14); g.fillRect(gx - 4, 616, 8, 26); }
  g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(1480, 590, 10, 70);
  g.fillStyle = '#3a2618'; g.fillRect(1470, 668, 170, 8);
  g.restore();

  g.strokeStyle = '#1d3a32'; g.lineWidth = 16; g.strokeRect(HX - 8, HY - 8, HW + 16, HH + 16);
  g.fillStyle = 'rgba(230,190,90,.95)'; g.font = '700 30px "Noto Serif CJK SC"'; g.textAlign = 'center'; g.fillText('COFFEE · 手冲 · 拿铁', HX + HW / 2, HY - 26);
  // counter ledge (wood)
  T.wash(g, R(1262, 690, 436, 14), '#d7a067', '#c28650', { edge: 0.15 });
  T.wash(g, R(1262, 704, 436, 26), '#9a5f34', '#7b4624', { edge: 0.3 });

  // panels under ledge

  // glass door

  T.wash(g, T.rrect(1840, 560, 100, 40, 6), '#f6ecd2', null, { edge: 0.2 }); g.fillStyle = '#2f5f52'; g.font = '700 22px "Noto Sans CJK SC"'; g.fillText('营业中', 1890, 588);

    T.wash(g, T.poly([[xt0, AT], [xt1, AT], [xb1, AB], [xb0, AB]]), i % 2 ? '#f4e6c8' : '#c9452f', i % 2 ? '#e2cca3' : '#a8341f', { edge: 0, y0: AT, y1: AB });
  }
  g.restore();
  g.save(); g.clip(aw); g.fillStyle = 'rgba(255,240,200,.22)'; g.fillRect(A0, AT, A1 - A0, 18); g.restore();
  for (let i = 0; i < 16; i++) {

  g.fillStyle = sh; g.fillRect(A0 + 10, AB + 30, A1 - A0 - 20, 110);
  // wall lantern
  g.strokeStyle = '#1f1a16'; g.lineWidth = 6; g.beginPath(); g.moveTo(1730, 470); g.lineTo(1730, 500); g.stroke();
  T.wash(g, T.poly([[1712, 500], [1748, 500], [1756, 560], [1704, 560]]), '#f2c46a', '#e09a3e', { edge: 0.35, y0: 500, y1: 560 });
  // blade sign hanging over the alley gap
  g.strokeStyle = '#1f1a16'; g.lineWidth = 9; g.beginPath(); g.moveTo(1062, 170); g.lineTo(900, 170); g.stroke();
  g.lineWidth = 3; g.beginPath(); g.moveTo(1062, 150); g.quadraticCurveTo(990, 150, 960, 172); g.stroke();
  for (const x of [920, 1040]) { g.beginPath(); g.moveTo(x, 172); g.lineTo(x, 196); g.stroke(); }
  const sg = T.rrect(866, 196, 228, 112, 18);
  T.wash(g, sg, '#2f5f52', '#244a40', { edge: 0.3, y0: 196, y1: 308 });
  g.strokeStyle = '#d7b15e'; g.lineWidth = 5; g.stroke(T.rrect(876, 206, 208, 92, 12));
  g.fillStyle = '#f3dfae'; g.font = '900 50px "Noto Sans CJK SC"'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(C.brand, 980, 254);
  // pavement
  const PV = R(-10, 886, WW + 20, 200);
  T.wash(g, PV, '#d7c3a2', '#b9a07c', { edge: 0, y0: 886, y1: 1080 });
  g.save(); g.clip(PV);
  for (let r = 0; r < 7; r++) {

    for (let i = -1; i < 40; i++) {

    }

  g.restore();

  T.wash(g, T.poly([[1975, 880], [2075, 880], [2060, 965], [1990, 965]]), '#b8653b', '#93482a', { edge: 0.3 });
  for (let i = 0; i < 9; i++) { const a = -Math.PI / 2 + (i - 4) * 0.32; g.fillStyle = i % 2 ? '#4f7d3a' : '#3f6a2e'; g.fill(T.ell(2025 + Math.cos(a) * 70, 880 + Math.sin(a) * 80, 22, 50, a + Math.PI / 2)); }

// ---------------------------------------------------------------- props
function cup(x, y, rot = 0, s = 1, steam = 0, t = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  const body = T.poly([[-27, 0], [27, 0], [35, -88], [-35, -88]]);
  T.ink(ctx, body, { fill: '#fbf6ea', shade: '#dcd2bd', sh: [-10, 0], lw: 4.5 });
  const slv = T.poly([[-31, -28], [31, -28], [34, -66], [-34, -66]]);
  T.ink(ctx, slv, { fill: '#2f5f52', shade: '#234a40', sh: [-9, 0], lw: 4 });
  ctx.fillStyle = '#f3dfae'; ctx.fill(T.ell(0, -47, 11, 11)); ctx.fillStyle = '#2f5f52'; ctx.fill(T.ell(0, -47, 5, 6));
  const lid = new Path2D(); lid.moveTo(-40, -86); lid.lineTo(40, -86); lid.lineTo(36, -98); lid.quadraticCurveTo(0, -112, -36, -98); lid.closePath();
  T.ink(ctx, lid, { fill: '#e9e1d0', shade: '#bdb39e', sh: [-8, 0], lw: 4.5 });
  ctx.restore();
}
function steamRibbon(x, y, t, seed, hgt = 120, a = 0.6) {
  const pts = [];
  for (let i = 0; i <= 18; i++) { const u = i / 18; pts.push([x + Math.sin(u * 5 + t * 3 + seed) * 12 * u + seed * 4, y - u * hgt]); }
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#fffaf0'; ctx.fill(T.tube(pts, (u) => 14 * Math.sin(Math.PI * u) * (1 - u * 0.5))); ctx.restore();
}
// the luring steam: from cup top (x0,y0) to target (x1,y1); grows with g in [0,1]; ends in a beckoning finger
function lure(x0, y0, x1, y1, g, t) {
  if (g <= 0) return;
  const pts = [], n = 40;
  for (let i = 0; i <= n; i++) {
    const u = (i / n) * g;
    const bx = lerp(x0, x1, u), by = lerp(y0, y1, u) - Math.sin(u * Math.PI) * 120 - u * (1 - u) * 60;
    pts.push([bx + Math.sin(u * 9 - t * 6) * 10, by + Math.cos(u * 7 - t * 5) * 14]);
  }
  ctx.save(); ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#fffaf0'; ctx.fill(T.tube(pts, (u) => 22 * (0.6 + 0.4 * Math.sin(u * 3)) * (1 - 0.35 * u)));
  // finger curl at tip
  const e = pts[pts.length - 1], wig = Math.sin(t * 16) * 0.5;
  const f = T.qbez(e, [e[0] - 30, e[1] - 34 - wig * 10], [e[0] - 48 + wig * 12, e[1] - 6], 10);
  ctx.fill(T.tube(f, (u) => 16 * (1 - u * 0.4)));
  ctx.globalAlpha = 0.5; ctx.strokeStyle = '#e6dccb'; ctx.lineWidth = 2.5; ctx.stroke(T.tube(pts, (u) => 22 * (0.6 + 0.4 * Math.sin(u * 3)) * (1 - 0.35 * u)));
  ctx.restore();
}
function catPaw(px, py) {
  // the barista's arm reaching out of the hatch (from inside, upper right)
  const a = [1700, 600], c = [lerp(1700, px, 0.5), py - 30];
  T.limb(ctx, a, c, [px + 30, py], 50, 44, { fill: P.cuff, shade: P.cuffS, sh: [-6, -8], lw: 5 });
  ctx.save(); ctx.fillStyle = 'rgba(80,120,170,.6)'; for (let i = 0; i < 4; i++) { const u = 0.2 + i * 0.2, q = T.qbez(a, c, [px + 30, py], 10)[Math.round(u * 10)]; ctx.fillRect(q[0] - 2, q[1] - 22, 4, 44); } ctx.restore();
  T.ink(ctx, T.blob(px, py, 32, 26, (a2) => 1 + 0.08 * Math.cos(a2 * 4), 32), { fill: P.cat, shade: P.catS, sh: [6, -6], lw: 5 });
  for (let i = 0; i < 3; i++) T.taper(ctx, [[px - 22 + i * 4, py - 14 + i * 12], [px - 32 + i * 4, py - 12 + i * 12]], 3.5);
}

// ---------------------------------------------------------------- the bear (local coords: feet at 0,0, facing +x, up = -y)
const DEF = { x: 0, y: 0, s: 1, dir: 1, sq: 1, lean: 0, walk: 0, stride: 0, float: 0, tilt: 0, hy: 0,
  open: 1, pop: 0, px: 0, py: 0, ps: 1, happy: 0, wink: 0, spark: 0, browY: 0, browA: 0,
  mo: 0, ms: 0, mr: 0, teeth: 0, hN: [90, -170], hF: [-80, -170], armFront: 0, finger: 0, cap: 1, capSw: 0,
  bristle: 0, snot: 0, cup: null, shake: [0, 0], smear: 0 };
function bear(o) {
  const p = Object.assign({}, DEF, o);

        const u = ((t * 3 + i / 4) % 1), ex = 1420 + (k ? 70 : -60), ey = 966 - 640 * 1.4;
        T.puff(ctx, ex + (k ? 1 : -1) * u * 60, ey - u * 160, 14 + u * 26, i + k * 5, 1 - u, '#fbf7ee', '#d9d2c4');
      }
    }
    // zip: dust cloud in his shape + speed lines
    if (t > 11.62 && t < 12.6) {
      const u = (t - 11.62) / 0.98;
      // dust cloud keeps his silhouette for a beat, then crumbles
      const hold = clamp(1 - (u - 0.3) / 0.25), crumble = clamp((u - 0.3) / 0.7);
      if (hold > 0) {
        ctx.save(); ctx.globalAlpha = hold; ctx.translate(1420, 966);
        const bump = (k) => (ang) => 1 + 0.07 * Math.sin(ang * 11 + k) + 0.04 * Math.sin(ang * 23 + k * 2);
        for (const [x, y, r] of [[-60, -456, 38], [58, -468, 40]]) T.ink(ctx, T.blob(x, y, r, r, bump(x), 40), { fill: '#eadfc9', shade: '#cdbb9b', sh: [-8, -8], lw: 5 });
        T.ink(ctx, T.blob(0, -182, 112, 124, bump(1), 64), { fill: '#eadfc9', shade: '#cdbb9b', sh: [-20, -18], lw: 6 });
        T.ink(ctx, T.blob(10, -372, 122, 108, bump(2), 64), { fill: '#eadfc9', shade: '#cdbb9b', sh: [-20, -18], lw: 6 });
        for (const x of [-40, 40]) T.ink(ctx, T.blob(x, -40, 40, 44, bump(x + 3), 30), { fill: '#eadfc9', shade: '#cdbb9b', sh: [-8, -8], lw: 5 });
        ctx.restore();
      }
      if (crumble > 0) for (let n = 0; n < 34; n++) {
        const sx = (hash(n * 3.1) - 0.5) * 220, sy = -40 - hash(n * 7.7) * 460, fall = E.inQuad(crumble);
        T.puff(ctx, 1420 + sx + (hash(n) - 0.5) * fall * 160, 966 + sy + fall * (966 - (966 + sy)) * 0.9, (20 + hash(n * 5.3) * 18) * (1 - fall * 0.6), n, 1 - E.inQuad(clamp((crumble - 0.4) / 0.6)), '#eadfc9', '#cdbb9b');
      }
      for (let i = 0; i < 7; i++) { const y = 966 - 80 - i * 60, len = 600 * (1 - u); ctx.globalAlpha = 1 - u; T.taper(ctx, [[1300 - len, y], [1300, y]], 6); ctx.globalAlpha = 1; }
    }
    // skid in
    if (t > 12.55 && t < 13.6) {
      const u = (t - 12.55) / 1.05;
      for (let i = 0; i < 5; i++) T.puff(ctx, 1390 - 120 - i * 50 - u * 40, 966 - 20 - hash(i) * 30 - u * 20, 26 + i * 6 + u * 20, i + 3, 1 - u);
      if (u < 0.5) for (let i = 0; i < 4; i++) T.taper(ctx, [[1390 - 500 * (1 - u * 2), 966 - 60 - i * 70], [1300, 966 - 60 - i * 70]], 5);
    }
    // speech balloon
    const bs = T.trk(t, [[12.95, 0], [13.15, 1, E.outBack], [13.75, 1], [13.95, 0, E.inQuad]]);
    balloon(1330, 290, bs, C.say, 1440, 520, 1);
    ctx.restore();
    // iris in / out
    const [headX, headY] = toScr(t, 1390 + 40, 966 - 380);
    const sgn = toScr(t, 980, 250);
    if (t < 0.9) T.iris(ctx, sgn[0], sgn[1], T.trk(t, [[0, 0], [0.9, 1500, E.inQuad]]));
    if (t > 13.55) T.iris(ctx, headX, headY, T.trk(t, [[13.55, 1500], [14.3, 270, E.inOutQuad]]));
    // title card on black, left of the iris
    if (t > 14.15) {
      const chars = [...C.brand];
      chars.forEach((ch, i) => {
        const k = clamp((t - 14.2 - i * 0.07) / 0.28);
        if (k > 0) T.letter(ctx, ch, 270 + i * 150, 470 - (1 - E.outBack(k)) * 80, { size: 140, sx: E.outBack(k), sy: E.outBack(k), rot: (i % 2 ? 0.05 : -0.05) * (1 - k), fill: '#ffe9b8', line: '#3a1d12', drop: 'rgba(200,80,40,.85)' });
      });
      const k2 = clamp((t - 14.55) / 0.3);
      if (k2 > 0) T.letter(ctx, C.tag, 495, 620, { size: 44, weight: 700, fill: '#f6e7c8', line: 'rgba(0,0,0,0)', drop: 'rgba(0,0,0,0)', lw: 0, alpha: k2 });
      ctx.save(); ctx.globalAlpha = clamp((t - 14.5) / 0.3) * 0.55; ctx.fillStyle = '#e8d8b8'; ctx.font = '500 20px "Noto Sans CJK SC"'; ctx.textAlign = 'right'; ctx.fillText(C.sig, 1880, 1050); ctx.restore();
    }
    FILM.finish(ctx, t);
  },
});
