<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>13 · 独立游戏工作室 · 八位元工作室</title>
<script src="../lib/core.js"></script><script src="../lib/pixel.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 13 像素 · 行业示例：独立游戏工作室 =====
   A top-down RPG overworld. The little hero walks the map from building to building - the art tower,
   the music hall, the harbour - and at each one an NPC dialog box types out what the studio does. The
   camera follows like a real 16-bit game; then the hero reaches the studio and we iris to its title screen. */
const { E, clamp, lerp } = Reel;
const stage = Reel.makeStage('#07061a');
const C = Reel.cfg({ brand: '八位元工作室', sub: '独立游戏 · 从想法到上架', d1: '像素美术：角色、场景、动画', d2: '原创音乐：8-bit 配乐与音效', d3: '上架发行：Steam / 手机双平台' });
const X = PX.init(stage);
const { P, put, rect, frame, text, cjk, cw, sprite, box, bay, h1 } = X;
const vh = (x, y) => h1(x * 57.13 + y * 113.7);
const vn = (x, y) => { const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy); return lerp(lerp(vh(i, j), vh(i + 1, j), u), lerp(vh(i, j + 1), vh(i + 1, j + 1), u), v); };
// ---- world (map px) ----
const WP = [[40, 300], [70, 240], [150, 215], [230, 260], [330, 290], [400, 240], [470, 200], [540, 230], [600, 300]];
const STOPS = [[150, 210], [330, 285], [470, 198], [600, 296]];      // where the hero stops
const BLD = [[150, 172, 'tower'], [330, 247, 'hall'], [470, 160, 'dock'], [600, 258, 'hq']];
function distPath(x, y) { let d = 1e9; for (let i = 0; i < WP.length - 1; i++) { const [ax, ay] = WP[i], [bx, by] = WP[i + 1], dx = bx - ax, dy = by - ay, u = clamp(((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy)); d = Math.min(d, Math.hypot(x - ax - dx * u, y - ay - dy * u)); } return d; }
const PATHD = {}; const pd = (x, y) => { const k = (x >> 1) + ',' + (y >> 1); return PATHD[k] ?? (PATHD[k] = distPath(x, y)); };
const water = (x, y) => { const l1 = Math.hypot((x - 500) / 70, (y - 120) / 40), l2 = Math.hypot((x - 250) / 50, (y - 360) / 35); return Math.min(l1, l2) + (vn(x * 0.05, y * 0.05) - 0.5) * 0.35 < 1; };
function ground(t, cx, cy) {
  for (let y = 0; y < 171; y++) for (let x = 0; x < 304; x++) {
    const wx = x + cx, wy = y + cy;
    let c;
    if (water(wx, wy)) { const r = Math.sin(wx * 0.4 + t * 3) + Math.sin(wy * 0.6 - t * 2); c = bay(wx, wy) < 0.12 + 0.1 * r ? P(4, 4) : P(4, 2); if (!water(wx, wy - 2) && bay(wx, wy) < 0.6) c = P(4, 5); }
    else if (pd(wx, wy) < 5.5) { c = vh(wx, wy) > 0.93 ? P(5, 2) : (pd(wx, wy) > 4.5 ? P(5, 3) : P(5, 4)); }
    else { const n = vn(wx * 0.06, wy * 0.06); c = bay(wx, wy) < n * 0.7 ? P(3, 4) : P(3, 3); const f = vh(wx >> 1, wy >> 1); if (f > 0.994) c = [P(12, 5), P(9, 5), P(10, 0)][(wx + wy) % 3]; if (water(wx, wy + 2) && bay(wx, wy) < 0.7) c = P(5, 4); }
    put(x, y, c, 1);
  }
}
const TREES = []; for (let gy = 0; gy < 420; gy += 18) for (let gx = 0; gx < 680; gx += 18) { const x = gx + Math.floor(vh(gx, gy) * 10), y = gy + Math.floor(vh(gy, gx) * 10); if (vh(gx * 3, gy * 7) < 0.45) continue; if (water(x, y) || water(x, y + 8) || distPath(x, y) < 14) continue; if (BLD.some(([bx, by]) => Math.abs(x - bx) < 34 && Math.abs(y - by) < 40)) continue; TREES.push([x, y]); }
function tree(x, y) { for (let j = -10; j <= 0; j++) for (let i = -8; i <= 8; i++) { const d = Math.hypot(i, (j + 5) * 1.15); if (d < 7.5) { const l = (-i - (j + 5)) / 8; put(x + i, y + j, d > 6.6 ? P(3, 0) : (l > 0.35 ? P(3, 5) : l > -0.2 ? P(3, 4) : P(3, 2)), 5); } } rect(x - 1, y + 1, 3, 4, P(5, 2), 5); for (let i = -6; i <= 6; i++) put(x + i, y + 5, P(3, 1), 4); }
function building(kind, x, y, t) {
  if (kind === 'tower') { rect(x - 10, y - 30, 20, 38, P(6, 4), 5); for (let j = 0; j < 38; j += 6) rect(x - 10, y - 30 + j, 20, 1, P(6, 3), 5); for (let i = -14; i <= 14; i++) for (let j = 0; j < 16; j++) if (Math.abs(i) <= 14 - j) put(x + i, y - 31 - j, Math.abs(i) > 11 - j ? P(12, 1) : P(12, 3), 5); rect(x - 3, y - 2, 6, 10, P(5, 1), 5); rect(x - 3, y - 20, 6, 6, P(9, 4), 5);
    for (let k = 0; k < 4; k++) put(x + 12 + k, y - 22 - k, P(5, 3), 5); rect(x + 16, y - 28, 3, 4, P(13, 4), 5); }
  if (kind === 'hall') { rect(x - 26, y - 18, 52, 26, P(14, 4), 5); for (let i = -30; i <= 30; i++) for (let j = 0; j < 12; j++) if (Math.abs(i) <= 30 - j * 2.2) put(x + i, y - 19 - j, j < 2 ? P(13, 2) : P(13, 3), 5); for (const dx of [-18, -6, 6, 18]) rect(x + dx - 2, y - 14, 4, 22, P(14, 5), 5); rect(x - 4, y - 2, 8, 10, P(5, 1), 5);
    // a note bouncing on the beat
    const by = Math.round(Math.abs(Math.sin(t * Math.PI * 2)) * -4); rect(x + 30, y - 40 + by, 2, 10, P(10, 0), 6); rect(x + 26, y - 31 + by, 5, 3, P(10, 0), 6); rect(x + 32, y - 40 + by, 4, 2, P(10, 0), 6); }
  if (kind === 'dock') { rect(x - 30, y + 2, 60, 6, P(5, 3), 5); for (let i = -30; i < 30; i += 6) rect(x + i, y + 2, 1, 6, P(5, 1), 5); for (const dx of [-28, -4, 20]) rect(x + dx, y + 8, 2, 5, P(5, 1), 5);
    const bob = Math.round(Math.sin(t * 2)); rect(x - 14, y - 6 + bob, 28, 7, P(7, 3), 5); rect(x - 12, y + 1 + bob, 24, 2, P(7, 1), 5); rect(x, y - 30 + bob, 1, 24, P(5, 2), 5);
    for (let j = 0; j < 20; j++) for (let i = 1; i < 14 - j * 0.6; i++) put(x + i, y - 29 + j + bob, P(14, 5), 5); for (let j = 0; j < 4; j++) rect(x + 1, y - 34 + j + bob, 6 - j, 1, P(9, 4), 5); }
  if (kind === 'hq') { rect(x - 24, y - 20, 48, 30, P(5, 4), 5); for (let j = 0; j < 30; j += 5) rect(x - 24, y - 20 + j, 48, 1, P(5, 3), 5); for (let i = -28; i <= 28; i++) for (let j = 0; j < 14; j++) if (Math.abs(i) <= 28 - j * 2) put(x + i, y - 21 - j, j < 2 ? P(7, 1) : P(7, 3), 5); rect(x - 5, y - 2, 10, 12, P(9, 4), 5); rect(x - 18, y - 12, 8, 6, P(4, 5), 5); rect(x + 10, y - 12, 8, 6, P(4, 5), 5);
    rect(x + 22, y - 52, 1, 20, P(6, 5), 5); const w = Math.floor(t * 6) % 2; rect(x + 23, y - 52, 9, 6 + w, P(9, 4), 5); text('8', x + 25, y - 52, P(0, 0), 1, null, 6); }
}
const HERO = ['....hhhh....', '...hhhhhh...', '..hhhhhhhh..', '..hsssssh...', '..ssesseS...', '..sssssss...', '...rrrrr....', '..rrrrrrr...', '.srrrrrrrs..', '..rrbbbrr...', '...bb.bb....', '...ff.ff....'];
function hero(x, y, walking, t, dir) {
  const fr = walking ? Math.floor(t * 8) % 2 : 0;
  const rows = HERO.map((r, j) => (j >= 10 && fr ? (j === 10 ? '...b..bb....' : '...f..ff....') : r));
  sprite(rows, { h: P(5, 1), s: P(8, 3), S: P(8, 2), e: P(0, 0), r: P(13, 4), b: P(13, 2), f: P(5, 1) }, Math.round(x) - 6, Math.round(y) - 12 + (walking && fr ? -1 : 0), 6, dir < 0, P(0, 0));
}
// timeline: walk legs and dialogs
const LEG = [[0.2, 1.7], [3.6, 5.3], [7.1, 8.8], [10.6, 11.5]];
const DLG = [[1.8, 3.4, C.d1], [5.4, 7.0, C.d2], [8.9, 10.5, C.d3]];
const SEG = (() => { const L = [0]; for (let i = 1; i < WP.length; i++) L.push(L[i - 1] + Math.hypot(WP[i][0] - WP[i - 1][0], WP[i][1] - WP[i - 1][1])); return L; })();
const near = (p) => { let best = 0, bd = 1e9; for (let i = 0; i < WP.length - 1; i++) { const [ax, ay] = WP[i], [bx, by] = WP[i + 1], dx = bx - ax, dy = by - ay, u = clamp(((p[0] - ax) * dx + (p[1] - ay) * dy) / (dx * dx + dy * dy)); const d = Math.hypot(p[0] - ax - dx * u, p[1] - ay - dy * u); if (d < bd) { bd = d; best = SEG[i] + u * Math.hypot(dx, dy); } } return best; };
const SS = [0, ...STOPS.map(near)];
function at(s) { let i = 1; while (i < SEG.length - 1 && SEG[i] < s) i++; const u = clamp((s - SEG[i - 1]) / (SEG[i] - SEG[i - 1])); return [lerp(WP[i - 1][0], WP[i][0], u), lerp(WP[i - 1][1], WP[i][1], u), Math.sign(WP[i][0] - WP[i - 1][0]) || 1]; }
function heroS(t) { let s = 0, walking = false; LEG.forEach(([a, b], k) => { if (t >= b) s = SS[k + 1]; else if (t > a) { s = lerp(SS[k], SS[k + 1], E.inOutSine((t - a) / (b - a))); walking = true; } }); return { s, walking }; }
Reel.scene({
  duration: 15, fps: 30,
  fonts: ['700 12px "Noto Sans CJK SC"', '700 16px "Noto Sans CJK SC"'],
  cues: [...LEG.flatMap(([a, b]) => Array.from({ length: Math.floor((b - a) / 0.25) }, (_, i) => ({ t: +(a + 0.1 + i * 0.25).toFixed(2), sfx: 'step_soft', gain: 0.25 }))), ...DLG.flatMap(([a, b, s]) => [{ t: a, sfx: 'tick', gain: 0.6 }, ...Array.from({ length: 6 }, (_, i) => ({ t: +(a + 0.15 + i * 0.12).toFixed(2), sfx: 'type', gain: 0.3 }))]),
    { t: 11.5, sfx: 'powerup', gain: 0.6 }, { t: 12.1, sfx: 'levelup', gain: 0.6 }],
  render(t) {
    X.clear();
    if (t < 12.0) {
      const { s, walking } = heroS(t), [hx, hy, dir] = at(s);
      const cx = Math.round(clamp(hx - 152, 0, 680 - 304)), cy = Math.round(clamp(hy - 95, 0, 420 - 171));
      ground(t, cx, cy);
      // draw trees, buildings and the hero sorted by y
      const items = [];
      for (const [x, y] of TREES) if (x - cx > -12 && x - cx < 316 && y - cy > -4 && y - cy < 186) items.push([y, () => tree(x - cx, y - cy)]);
      for (const [x, y, k] of BLD) if (x - cx > -60 && x - cx < 364) items.push([y + 8, () => building(k, x - cx, y - cy, t)]);
      items.push([hy, () => hero(hx - cx, hy - cy, walking, t, dir)]);
      items.sort((a, b) => a[0] - b[0]).forEach(([, f]) => f());
      // HUD
      box(4, 4, 92, 14, P(0, 1), P(10, 0)); cjk(C.brand, 8, 4, P(9, 4), 12, null);
      text(`DAY ${1 + Math.floor(t / 4)}`, 250, 8, P(10, 0), 1, P(0, 0));
      // dialogs (typewriter)
      for (const [a, b, msg] of DLG) {
        if (t < a || t > b) continue; const n = Math.floor(clamp((t - a - 0.1) / 0.9) * [...msg].length);
        const y = Math.round(lerp(171, 118, E.outCubic(clamp((t - a) / 0.2)) * (1 - E.inCubic(clamp((t - b + 0.2) / 0.2)))));
        box(10, y, 284, 46, P(0, 1), P(10, 0));
        // NPC portrait
        rect(16, y + 6, 30, 34, P(1, 2), 9); frame(16, y + 6, 30, 34, P(10, 0), 9); for (let j = 0; j < 14; j++) for (let i = 0; i < 14; i++) { const d = Math.hypot(i - 7, j - 7); if (d < 7) put(24 + i, y + 12 + j, d > 6 ? P(0, 0) : P(8, 3), 9); } put(28, y + 18, P(0, 0), 9); put(33, y + 18, P(0, 0), 9); rect(29, y + 22, 4, 1, P(7, 2), 9); rect(22, y + 9, 18, 4, P(5, 2), 9);
        cjk([...msg].slice(0, n).join(''), 54, y + 10, P(10, 0), 12, null);
        if (n >= [...msg].length && Math.floor(t * 4) % 2) { put(282, y + 38, P(10, 0), 9); put(283, y + 39, P(10, 0), 9); put(284, y + 38, P(10, 0), 9); }
      }
      if (t > 11.5) X.iris(Math.round(hx - cx), Math.round(hy - cy - 6), lerp(200, 0, E.inCubic(clamp((t - 11.5) / 0.5))));
    } else {
      // title screen
      for (let y = 0; y < 171; y++) for (let x = 0; x < 304; x++) put(x, y, bay(x, y) < y / 200 ? P(0, 2) : P(0, 0), 0);
      for (let i = 0; i < 40; i++) if ((Math.sin(t * 3 + i) + 1) / 2 > 0.3) put(Math.floor(h1(i) * 304), Math.floor(h1(i * 3) * 120), P(10, 0), 1);
      // mountains + castle silhouette
      for (let x = 0; x < 304; x++) { const h = 30 + X.n1(x * 0.03) * 30; for (let y = 171 - h; y < 171; y++) put(x, y, P(1, 1), 2); const h2 = 14 + X.n1(x * 0.05 + 9) * 18; for (let y = 171 - h2; y < 171; y++) put(x, y, P(0, 1), 3); }
      const u = t - 12.0, sc = 2, w = cw(C.brand, 16, sc), y0 = Math.round(lerp(-40, 30, E.outBack(clamp(u / 0.45))));
      cjk(C.brand, Math.round(152 - w / 2), y0, P(9, 4), 16, P(0, 0), 9, sc);
      if (u > 0.5) cjk(C.sub, Math.round(152 - cw(C.sub) / 2), 76, P(10, 0), 12, P(0, 0));
      if (u > 0.9 && Math.floor(t * 2.5) % 2) text('PRESS START', 152 - 33, 104, P(9, 5), 1, P(0, 0));
      hero(152, 150, true, t, 1);
      if (u < 0.5) X.iris(152, 140, lerp(0, 220, E.outCubic(clamp(u / 0.5))));
    }
    X.flush();
  },
});
</script></body></html>
