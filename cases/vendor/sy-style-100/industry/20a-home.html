<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>20 · 全屋定制 · 木作家</title>
<script src="../lib/core.js"></script><script src="../lib/gl.js"></script><script src="../lib/rm.js"></script><script src="../lib/blueprint.js"></script>
<style>
  #cap{position:absolute;left:120px;top:96px;text-align:left;color:#2b2622;opacity:0}
  #cap .zh{font:300 84px 'Noto Sans CJK SC';letter-spacing:.14em;line-height:1.2}
  #cap .sub{margin-top:18px;font:400 29px 'Noto Sans CJK SC';letter-spacing:.12em;color:rgba(43,38,34,.82)}
  #cap .en{margin-top:16px;font:500 16px Inter;letter-spacing:.5em;color:rgba(43,38,34,.5)}
  #cap .rule{width:64px;height:2px;background:#b07a4a;margin:24px 0 0}
</style>
</head><body><div id="stage"></div>
<script>
/* ===== 20 蓝图工程图 · 行业示例：全屋定制 =====
   It starts as a floor plan seen from straight above: the plotter draws the walls, the wardrobe, the media
   wall, the desk and bookcase. The camera cranes down out of the plan while everything extrudes up into an
   elevation drawing, and the cabinetry gets its callouts and sizes. A scan line turns the drawing into the
   finished room: oak floor, walnut and white lacquer, afternoon sun through the window. A wardrobe door
   swings open to show the fitted interior. */
const C = Reel.cfg({ brand: '木作家 · 全屋定制', sub: '免费上门量尺 · 3D 设计 · 环保板材', en: 'CUSTOM CABINETRY · WHOLE HOME',
  labels: [['定制衣柜', '2400 × 600 × 2300'], ['悬浮电视柜', '胡桃木饰面'], ['书柜书桌一体', '1000 × 350 × 2200'], ['飘窗采光', '1500 × 1200']],
  tb: ['主卧 · 平面 / 立面', 'DWG. NO. MZJ-2026-108', 'SCALE  1 : 50', 'DRAWN  XIAOXIONG', 'DATE  2026.10.18'] });
const { E, clamp, inv, lerp } = Reel;
const stage = Reel.makeStage('#0c3480');
Reel.ownJitter = true;
const B = BP.make(stage, {
  foc: 3.4,
  uniforms: `uniform float uH, uF1, uF2, uF3, uDoor, uSun;`,
  fns: `
float bx(vec3 p, vec3 c, vec3 h){ vec3 q = abs(p - c) - h; return length(max(q,0.)) + min(max(q.x,max(q.y,q.z)),0.); }`,
  map: `
vec2 obj(vec3 p){
  vec2 d = vec2(1e3, -1.);
  // floor slab
  float fl = bx(p, vec3(0.,-.06,0.), vec3(3.2,.06,2.2)); if (fl < d.x) d = vec2(fl, 2.);
  // walls (extruded from the plan), window and door openings
  float H = 2.6*uH;
  float w = min(bx(p, vec3(0.,H*.5,-2.14), vec3(3.2,H*.5,.06)), bx(p, vec3(-3.14,H*.5,0.), vec3(.06,H*.5,2.2)));
  w = max(w, -bx(p, vec3(.7,1.5,-2.14), vec3(.75,.6*uH,.2)));
  w = max(w, -bx(p, vec3(-3.14,1.05*uH,1.45), vec3(.2,1.05*uH,.45)));
  if (w < d.x) d = vec2(w, 1.);
  // window frame + mullion
  if (uH > .5){ float wf = max(bx(p, vec3(.7,1.5,-2.12), vec3(.75,.6,.03)), -bx(p, vec3(.7,1.5,-2.12), vec3(.71,.56,.1))); wf = min(wf, bx(p, vec3(.7,1.5,-2.12), vec3(.015,.58,.025))); if (wf < d.x) d = vec2(wf, 6.); }
  // wardrobe along the left wall: four doors, the last bay hollow behind a door that swings open
  float h1 = 2.3*uF1;
  float wb = bx(p, vec3(-2.78,h1*.5,-.88), vec3(.3,h1*.5,1.2)) - .004;
  wb = max(wb, -bx(p, vec3(-2.74,h1*.5,.02), vec3(.3,h1*.5 - .03,.28)));
  for (int i=0;i<3;i++){ float zs = -1.48 + float(i)*.6; wb = max(wb, -bx(p, vec3(-2.48,h1*.5,zs), vec3(.012,h1*.5 - .04,.005))); }
  if (wb < d.x) d = vec2(wb, 3.);
  if (uF1 > .05){
    // the swinging door, hinged at z = 0.32 on the front face
    vec3 q = p - vec3(-2.48, 0., -.28); float a = -uDoor*1.75; float c = cos(a), s = sin(a); q.xz = mat2(c, -s, s, c)*q.xz;
    float dr = bx(q, vec3(.018, h1*.5, .3), vec3(.018, h1*.5 - .02, .295)) - .003; if (dr < d.x) d = vec2(dr, 3.);
    float hd = bx(q, vec3(.05, 1.1*uF1, .55), vec3(.012, .2*uF1, .012)); if (hd < d.x) d = vec2(hd, 5.);
    for (int i=0;i<3;i++){ float zs = -1.48 + float(i)*.6; float hb = bx(p, vec3(-2.45, 1.1*uF1, zs + .05), vec3(.012,.2*uF1,.012)); if (hb < d.x) d = vec2(hb, 5.); }
    // interior: shelves, hanging rail, clothes
    float sh = min(bx(p, vec3(-2.76,1.85*uF1,.02), vec3(.27,.012,.27)), bx(p, vec3(-2.76,.45*uF1,.02), vec3(.27,.012,.27))); if (sh < d.x) d = vec2(sh, 4.);
    float rail = length(p.xy - vec2(-2.76, 1.72*uF1)) - .012; rail = max(rail, abs(p.z - .02) - .27); if (rail < d.x) d = vec2(rail, 5.);
    for (int i=0;i<4;i++){ float z = -.18 + float(i)*.13; float cl = bx(p, vec3(-2.76, 1.3*uF1, z), vec3(.2, .38*uF1, .025)) - .02; if (cl < d.x) d = vec2(cl, 8. + mod(float(i), 2.)); }
  }
  // floating media cabinet + two wall shelves (walnut)
  float h2 = uF2;
  float mc = bx(p, vec3(-1.15,.47,-1.87), vec3(1.05,.22*h2,.21)) - .004; mc = max(mc, -bx(p, vec3(-1.55,.47,-1.66), vec3(.38,.13*h2,.12)));
  mc = min(mc, bx(p, vec3(-1.25,1.35,-1.95), vec3(.65,.016*h2,.13)) - .002); mc = min(mc, bx(p, vec3(-1.25,1.75,-1.95), vec3(.65,.016*h2,.13)) - .002);
  if (mc < d.x) d = vec2(mc, 4.);
  // desk under the window + bookcase with cubbies
  float h3 = uF3;
  float dk = bx(p, vec3(.7,.75*h3,-1.8), vec3(.72,.02,.28)) - .003; dk = min(dk, bx(p, vec3(1.25,.55*h3,-1.8), vec3(.17,.18*h3,.26)) - .003);
  dk = min(dk, bx(p, vec3(.02,.375*h3,-1.8), vec3(.02,.375*h3,.26)));
  if (dk < d.x) d = vec2(dk, 4.);
  float bk = bx(p, vec3(2.1,1.1*h3,-1.9), vec3(.5,1.1*h3,.175)) - .003;
  vec2 cell = vec2(.333, .44*h3); vec2 cc = vec2(p.x - 1.6, p.y); vec2 ci = clamp(floor(cc/cell), vec2(0.), vec2(2., 4.)); vec2 cp = cc - (ci + .5)*cell;
  bk = max(bk, -bx(vec3(cp, p.z), vec3(0.,0.,-1.82), vec3(.145, .2*h3, .2)));
  if (bk < d.x) d = vec2(bk, 3.);
  return d;
}`,
  real: `
const vec3 SUN = normalize(vec3(-.35,.55,-.76));
float shadowR(vec3 ro, vec3 L){ float r = 1., t = .02; for (int i=0;i<40;i++){ float h = mapS(ro + L*t); r = min(r, 10.*h/t); t += clamp(h, .02, .25); if (r < .002 || t > 7.) break; } return clamp(r,0.,1.); }
float aoR(vec3 p, vec3 n){ float o = 0., s = 1.; for (int i=0;i<5;i++){ float h = .02 + .09*float(i); o += (h - mapS(p + n*h))*s; s *= .72; } return clamp(1. - 1.6*o, 0., 1.); }
vec3 shadeReal(vec3 p, vec3 rd, vec3 n, float id){
  vec3 a; float spec = .04, rough = 30.;
  if (id < 1.5) a = vec3(.86,.84,.8)*(.97 + .03*vnoise(p*30.));
  else if (id < 2.5){ float pl = floor(p.z*4.2); float off = hash11(pl)*3.; float seg = floor(p.x*.55 + off); float hv = hash11(pl*1.7 + seg*3.1);
    a = mix(vec3(.6,.44,.29), vec3(.7,.53,.36), hv)*(.93 + .07*vnoise(vec3(p.x*6., p.z*40., 1.)));
    float sz = smoothstep(.012, .0, abs(fract(p.z*4.2) - .5) - .486), sx = smoothstep(.006, .0, abs(fract(p.x*.55 + off) - .5) - .495);
    a *= 1. - .35*max(sz, sx); spec = .07; rough = 40.; }
  else if (id < 3.5){ a = vec3(.9,.89,.86); spec = .08; rough = 60.; }
  else if (id < 4.5){ float g = sin(p.x*16. + 5.*vnoise(vec3(p.x*1.5, p.y*14., p.z*14.))); a = mix(vec3(.22,.12,.065), vec3(.32,.19,.1), .5 + .5*g); spec = .06; rough = 30.; }
  else if (id < 5.5){ a = vec3(.85,.62,.3); spec = .6; rough = 80.; }
  else if (id < 6.5){ a = vec3(.12,.12,.13); spec = .2; }
  else if (id < 8.5) a = vec3(.62,.66,.7); else a = vec3(.78,.62,.52);
  float sh = shadowR(p + n*.004, SUN), oc = aoR(p, n);
  float ndl = max(dot(n, SUN), 0.);
  vec3 col = a*vec3(1.,.84,.64)*3.6*ndl*sh*uSun;
  col += a*vec3(.62,.7,.85)*.55*oc*(.6 + .4*n.y);                          // sky / bounce
  col += a*vec3(.95,.82,.65)*.28*oc*max(dot(n, normalize(vec3(.6,.2,.75))), 0.);   // warm fill from the room
  vec3 hv = normalize(SUN - rd); col += vec3(1.,.9,.75)*spec*pow(max(dot(n, hv), 0.), rough)*sh*3.*uSun;
  float fr = pow(1. - max(dot(n, -rd), 0.), 5.); col += vec3(.8,.85,.9)*fr*spec*1.5*oc;
  return col;
}`,
  bg: `mix(vec3(.74,.72,.69), vec3(.88,.86,.83), smoothstep(-.3, .6, rd.y))`,
  floor: `vec3 c = vec3(.66,.64,.61)*(.55 + .45*shadowR(p + vec3(0.,.002,0.), SUN)); return mix(c, bg, smoothstep(5., 14., length(p.xz)));`,
});
const O = BP.overlay(stage, B.FOC);
const cap = document.createElement('div'); cap.id = 'cap'; cap.innerHTML = `<div class="zh">${C.brand}</div><div class="rule"></div><div class="sub">${C.sub}</div><div class="en">${C.en}</div>`; stage.appendChild(cap);
function camAt(t) {
  const u = E.inOutCubic(inv(2.5, 5.4, t));
  const top = [0.1, 13.5, 0.9], persp = [5.6, 2.3, 6.6];
  const ro = [lerp(top[0], persp[0], u), lerp(top[1], persp[1], Math.pow(u, 0.7)), lerp(top[2], persp[2], u)];
  const ta = [lerp(0.0, -0.45, u), lerp(0, 1.0, u) + 0.3 * E.inOutSine(inv(8.5, 10.5, t)), lerp(0.0, -0.7, u)];
  const k = E.inOutSine(inv(8.5, 15, t));
  ro[0] += lerp(0, -1.0, k); ro[2] += lerp(0, -0.8, k); ro[1] += lerp(0, -0.25, k);
  ta[0] += lerp(0, -0.25, k);
  return { ro, ta };
}
Reel.scene({
  duration: 15, fps: 30,
  fonts: ['500 26px "Noto Sans CJK SC"', '300 84px "Noto Sans CJK SC"', '400 29px "Noto Sans CJK SC"', '500 24px "Latin Modern Mono"', '500 16px Inter'],
  cues: [{ t: 0.3, sfx: 'pen' }, { t: 1.4, sfx: 'pencil', gain: 0.5 }, { t: 2.6, sfx: 'whoosh' }, { t: 3.0, sfx: 'riser_short', gain: 0.5 }, { t: 5.4, sfx: 'tick' }, { t: 5.7, sfx: 'tick' }, { t: 6.0, sfx: 'tick' }, { t: 6.3, sfx: 'tick' },
    { t: 7.2, sfx: 'swell' }, { t: 8.6, sfx: 'sparkle', gain: 0.5 }, { t: 10.2, sfx: 'door_creak', gain: 0.5 }, { t: 11.0, sfx: 'chime', gain: 0.5 }],
  render(t) {
    const cam = camAt(t); const hx = 0.006 * Math.sin(t * 1.2), hy = 0.005 * Math.sin(t * 1.6 + 1);
    const ro = [cam.ro[0] + hx, cam.ro[1] + hy, cam.ro[2]];
    const H = lerp(0.012, 1, E.inOutCubic(inv(2.9, 4.4, t)));
    const F1 = lerp(0.012, 1, E.inOutCubic(inv(3.3, 4.7, t))), F2 = lerp(0.03, 1, E.inOutCubic(inv(3.6, 4.9, t))), F3 = lerp(0.012, 1, E.inOutCubic(inv(3.9, 5.1, t)));
    const scan = t < 7.2 ? -1 : t > 8.6 ? 2 : E.inOutSine(inv(7.2, 8.6, t)) * 1.02 - 0.01;
    const door = E.inOutSine(inv(10.2, 11.6, t));
    B.rm.set('uH', H).set('uF1', F1).set('uF2', F2).set('uF3', F3).set('uDoor', door).set('uSun', 1 + 0.08 * Math.sin(t * 0.7)).set('uScan', scan).set('uRo', ro).set('uTa', cam.ta).set('uRoll', 0)
      .set('uBound', [-0.1, 1.2, 0, 4.4]).set('uRevA', lerp(-3.8, 4.0, E.inOutSine(inv(0.3, 2.4, t)))).set('uRevB', 3.8).set('uRevDir', [1, 0, 0]).set('uCutOn', 0).set('uCut', [0, 0, 1, 9])
      .set('uFloorY', -0.12).set('uFloorOn', 1).set('uT', t).set('uFade', E.outCubic(clamp(t / 0.4)));
    B.rm.render(t, { focus: Math.hypot(ro[0] + 0.8, ro[1] - 1, ro[2] + 0.6), aperture: t > 8 ? 8 : 0, maxCoc: t > 8 ? 6 : 0 });
    O.begin(); const oc = O.ctx; oc.clearRect(0, 0, 1920, 1080); O.camera(ro, cam.ta, 0);
    const P = (x, y, z) => O.project([x, y, z]);
    oc.save(); if (scan >= 0) { oc.beginPath(); oc.rect(0, Math.max(0, scan) * 1080, 1920, 1080); oc.clip(); }
    // plan dimensions (top view), then elevation callouts
    const pk = E.outCubic(inv(1.6, 2.2, t)) * (1 - inv(2.6, 2.9, t));
    O.dim(P(-3.2, 0, 2.2), P(3.2, 0, 2.2), '6400', 50, pk); O.dim(P(3.2, 0, -2.2), P(3.2, 0, 2.2), '4400', -50, pk);
    const out = 1 - inv(6.9, 7.2, t);
    const L = [[P(-2.48, 1.6, -1.2), 1, 300, 330, -1], [P(-0.6, 0.6, -1.66), 2, 300, 560, -1], [P(2.4, 1.5, -1.72), 3, 1600, 250, 1], [P(0.9, 2.05, -2.1), 4, 1600, 140, 1]];
    L.forEach(([a, num, bx, by, side], i) => O.callout(a, String(num), C.labels[num - 1][0], bx, by, side, E.outCubic(inv(5.2 + i * 0.25, 5.9 + i * 0.25, t)) * out, C.labels[num - 1][1]));
    const ek = E.outCubic(inv(5.9, 6.5, t)) * out;
    O.dim(P(-2.48, 0, -2.08), P(-2.48, 0, 0.32), '2400', -44, ek); O.dim(P(-2.48, 0, 0.32), P(-2.48, 2.3, 0.32), '2300', 44, ek);
    O.title(E.outCubic(inv(0.5, 1.1, t)), C.tb);
    oc.restore();
    const ck = E.outCubic(inv(9.0, 9.9, t)); cap.style.opacity = ck; cap.style.transform = `translateY(${(1 - ck) * 16}px)`;
  },
});
</script></body></html>
