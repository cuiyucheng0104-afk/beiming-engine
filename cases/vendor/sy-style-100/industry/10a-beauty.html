<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>10 · 美业预约小程序 · 约美</title>
<script src="../lib/core.js"></script><script src="../lib/gl.js"></script><script src="../lib/glass.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 10 玻璃拟态 · 行业示例：美业预约小程序 =====
   The booking flow as liquid glass, every step grown out of the one before it: the search pill sheds four
   service tiles, the chosen tile stretches into a menu card while three stylist orbs pop up, the chosen
   stylist slides away as six time slots bead out, the tapped slot drips down and fuses into the confirm
   bar, which rolls up into a success disc and finally pours itself into the brand pill. One continuous
   morph, no cuts - the glass is the editor. */
const { E, clamp, lerp, spring } = Reel;
const stage = Reel.makeStage('#2a0c26');
Reel.ownJitter = true;
const C = Reel.cfg({ brand: '约美', sub: '美业预约小程序', sub2: '顾客自己约 · 不用再打电话排队' });
const g = GLS.init(stage, { ns: 10 });
const { b, u, K, W, H } = g;
const sp = (t, t0, k = 150, c = 14) => spring(Math.max(0, t - t0), { k, c });
const out = (t, t0, d = 0.35) => 1 - E.inOutCubic(clamp((t - t0) / d));

function wallpaper(t) {
  b.globalCompositeOperation = 'source-over';
  const base = b.createLinearGradient(0, 0, W, H); base.addColorStop(0, '#2a0b2c'); base.addColorStop(0.6, '#4a1038'); base.addColorStop(1, '#2b0d1e'); b.fillStyle = base; b.fillRect(0, 0, W, H);
  b.globalCompositeOperation = 'screen';
  for (const [x, y, r, c, p] of [[0.18, 0.25, 0.42, '#ff4f9a', 0], [0.85, 0.2, 0.4, '#a77bff', 1.6], [0.7, 0.9, 0.48, '#ffa36b', 3.0], [0.2, 0.92, 0.36, '#ff7ab8', 4.2], [0.5, 0.5, 0.28, '#ffd27a', 2.4]]) {
    const cx = (x + 0.05 * Math.sin(t * 0.32 + p)) * W, cy = (y + 0.05 * Math.cos(t * 0.27 + p * 1.3)) * H, rr = r * W;
    const gr = b.createRadialGradient(cx, cy, 0, cx, cy, rr); gr.addColorStop(0, c + 'bb'); gr.addColorStop(0.5, c + '44'); gr.addColorStop(1, c + '00'); b.fillStyle = gr; b.fillRect(0, 0, W, H);
  }
  b.globalCompositeOperation = 'source-over';
  // something crisp for the glass to bend: compact-mirror rings, a dot grid, sparkles
  b.strokeStyle = 'rgba(255,255,255,.10)'; b.lineWidth = 1.5 * K;
  for (let r = 120; r < 1100; r += 70) { b.beginPath(); b.arc(1500 * K, 300 * K, r * K, 0, 7); b.stroke(); }
  b.fillStyle = 'rgba(255,255,255,.16)'; for (let y = 30; y < 1080; y += 46) for (let x = 30; x < 1920; x += 46) b.fillRect(x * K, y * K, 2.2 * K, 2.2 * K);
  for (let i = 0; i < 40; i++) { const x = (Math.sin(i * 91.3) * 0.5 + 0.5) * 1920, y = (Math.sin(i * 47.7) * 0.5 + 0.5) * 1080, a = 0.3 + 0.6 * Math.abs(Math.sin(t * 1.6 + i)); b.fillStyle = `rgba(255,240,250,${a})`; const s = (2 + (i % 3)) * K; b.fillRect(x * K - s, y * K - 0.6 * K, s * 2, 1.2 * K); b.fillRect(x * K - 0.6 * K, y * K - s, 1.2 * K, s * 2); }
  b.save(); b.font = `400 ${300 * K}px "Noto Serif CJK SC"`; b.fillStyle = 'rgba(255,255,255,.04)'; b.textAlign = 'left'; b.textBaseline = 'alphabetic'; b.fillText('Beauty', 40 * K, 1030 * K); b.restore();
  // end caption written into the wallpaper so the glass bends it
  const ca = E.outCubic(clamp((t - 11.6) / 0.6));
  if (ca > 0) { g.text(b, C.sub, 960, 690, 64, `rgba(255,255,255,${ca})`, { wt: 900, ls: 14 }); g.text(b, C.sub2, 960, 770, 32, `rgba(255,230,240,${0.85 * ca})`, { wt: 500, ls: 6 }); }
}

const TILES = ['美甲', '美睫', '皮肤管理', '头疗'];
const STY = [['小鹿', '5 年 · 4.9 分'], ['阿宁', '8 年 · 5.0 分'], ['Mia', '3 年 · 4.8 分']];
const SLOTS = ['10:00', '11:30', '14:00', '15:30', '19:00', '20:30'], FULL = [1, 3];
function layout(t) {
  const S = [], L = {};
  // A. search pill
  const pd = sp(t, 0.3, 140, 13), pOut = out(t, 3.1);
  L.pill = { x: 960, y: lerp(-80, 300, pd), w: 560 * pOut, h: 92 * pOut, a: pd * pOut };
  S.push({ c: [L.pill.x, L.pill.y], h: [L.pill.w / 2, L.pill.h / 2], r: 46, k: 60, frost: 2, bev: 30 });
  // tiles come out of the pill
  L.tiles = TILES.map((_, i) => {
    const e = sp(t, 1.25 + i * 0.12, 120, 12);
    let x = lerp(960, 960 + (i - 1.5) * 300, e), y = lerp(300, 580, e), s = t < 1.25 + i * 0.12 ? 0 : lerp(30, 125, e);
    const tap = i === 0 ? Math.sin(Math.PI * clamp((t - 2.6) / 0.35)) * 0.08 : 0; s *= 1 + tap;
    if (i === 0) { // chosen tile becomes the menu card on the left
      const m = sp(t, 3.1, 110, 14); x = lerp(x, 500, m); y = lerp(y, 560, m);
      return { x, y, hw: lerp(s, 190, m), hh: lerp(s, 290, m), m, e };
    }
    const o = out(t, 3.05 + i * 0.06, 0.4); return { x, y: y + (1 - o) * 60, hw: s * o, hh: s * o, m: 0, e: e * o };
  });
  L.tiles.forEach((q, i) => S.push({ c: [q.x, q.y], h: [q.hw, q.hh], r: i === 0 ? lerp(48, 44, q.m) : 48, k: 60, frost: 2, bev: 32 }));
  // B. stylist orbs
  L.sty = STY.map((_, i) => {
    const e = sp(t, 3.5 + i * 0.15, 150, 11); const pick = i === 1;
    let x = 1050 + i * 260, y = 470, r = 84 * e;
    if (pick) { r *= 1 + 0.12 * E.outBack(clamp((t - 4.9) / 0.35)); const m = sp(t, 6.0, 110, 14); x = lerp(x, 1600, m); y = lerp(y, 250, m); r = lerp(r, 62, m); return { x, y, r, e, m }; }
    const o = out(t, 5.8 + i * 0.05, 0.4); return { x, y, r: r * o, e: e * o, m: 0 };
  });
  L.sty.forEach((q) => S.push({ c: [q.x, q.y], h: [q.r, q.r], r: 400, k: 40, frost: 1, bev: 34 }));
  // C. time slots
  L.slots = SLOTS.map((_, i) => {
    const e = sp(t, 6.2 + i * 0.09, 160, 12); const row = Math.floor(i / 3), col = i % 3;
    let x = 960 + col * 230, y = 560 + row * 110, hw = 100 * e, hh = 38 * e;
    if (i === 4) { const drip = E.inOutCubic(clamp((t - 7.65) / 0.55)); y = lerp(y, 800, drip); hw = lerp(hw, 60, drip); hh = lerp(hh, 30, drip); return { x, y, hw, hh, e, drip }; }
    const o = out(t, 8.9 + i * 0.04, 0.35); return { x, y, hw: hw * o, hh: hh * o, e: e * o, drip: 0 };
  });
  L.slots.forEach((q, i) => S.push({ c: [q.x, q.y], h: [q.hw, q.hh], r: 38, k: i === 4 ? 70 : 18, frost: 2, bev: 24 }));
  // confirm bar grows out of the drip
  const cb = sp(t, 7.95, 130, 15);
  L.conf = { x: 1260, y: 840, hw: lerp(10, 400, cb) * (t > 7.9 ? 1 : 0), hh: lerp(10, 54, cb) * (t > 7.9 ? 1 : 0), e: cb };
  // D. success disc: confirm bar + card + stylist all pour into the centre disc
  const dv = E.inOutCubic(clamp((t - 9.1) / 0.6));
  if (dv > 0) {
    L.conf.x = lerp(L.conf.x, 960, dv); L.conf.y = lerp(L.conf.y, 480, dv); L.conf.hw = lerp(L.conf.hw, 140, dv); L.conf.hh = lerp(L.conf.hh, 140, dv);
    const c0 = L.tiles[0]; c0.x = lerp(c0.x, 960, dv); c0.y = lerp(c0.y, 480, dv); c0.hw = lerp(c0.hw, 4, dv); c0.hh = lerp(c0.hh, 4, dv);
    const s1 = L.sty[1]; s1.x = lerp(s1.x, 960, dv); s1.y = lerp(s1.y, 480, dv); s1.r = lerp(s1.r, 4, dv);
    const d4 = L.slots[4]; d4.x = lerp(d4.x, 960, dv); d4.y = lerp(d4.y, 480, dv); d4.hw = lerp(d4.hw, 4, dv); d4.hh = lerp(d4.hh, 4, dv);
  }
  // E. disc -> brand pill
  const bp = sp(t, 10.9, 120, 14);
  if (t > 10.9) { L.conf.hw = lerp(140, 330, bp); L.conf.hh = lerp(140, 100, bp); L.conf.y = lerp(480, 440, bp); }
  S.length = 0;   // rebuild in a stable order with the live geometry
  S.push({ c: [L.pill.x, L.pill.y], h: [L.pill.w / 2, L.pill.h / 2], r: 46, k: 60, frost: 2, bev: 30 });
  L.tiles.forEach((q, i) => S.push({ c: [q.x, q.y], h: [q.hw, q.hh], r: 44, k: 60, frost: 2, bev: 32 }));
  L.sty.forEach((q) => S.push({ c: [q.x, q.y], h: [q.r, q.r], r: 400, k: 40, frost: 1, bev: 34 }));
  L.slots.forEach((q, i) => S.push({ c: [q.x, q.y], h: [q.hw, q.hh], r: 38, k: i === 4 ? 70 : 18, frost: 2, bev: 24 }));
  S.push({ c: [L.conf.x, L.conf.y], h: [L.conf.hw, L.conf.hh], r: dv > 0 ? lerp(54, 400, dv) * (t > 10.9 ? lerp(1, 0.25, bp) : 1) : 54, k: 50, frost: 2, bev: 34 });
  // lens orb across the caption at the end
  const oe = E.inOutSine(clamp((t - 12.1) / 2.6)), on = t > 12.0 && t < 14.9 ? Math.sin(Math.PI * clamp((t - 12.0) / 2.9)) : 0;
  L.orb = [lerp(600, 1320, oe), 715, 110 * Math.min(1, on * 2.2), on > 0.02 ? 1 : 0];
  const live = S.filter((s) => s.h[0] > 0.8 && s.h[1] > 0.8);
  if (L.orb[3]) live.push({ c: [L.orb[0], L.orb[1]], h: [L.orb[2], L.orb[2]], r: 400, k: 0, frost: 0, bev: 34 });
  return { S: live.slice(0, 10), L };
}
function icon(kind, x, y, s, a) {
  u.save(); u.globalAlpha = a; u.translate(x * K, y * K); u.scale(s * K, s * K); u.strokeStyle = '#fff'; u.fillStyle = '#fff'; u.lineWidth = 3; u.lineCap = 'round'; u.lineJoin = 'round';
  if (kind === 0) { u.beginPath(); u.roundRect(-10, -26, 20, 30, 10); u.stroke(); u.beginPath(); u.moveTo(-14, 4); u.lineTo(-14, 22); u.lineTo(14, 22); u.lineTo(14, 4); u.stroke(); }                  // nail
  if (kind === 1) { u.beginPath(); u.arc(0, 4, 22, Math.PI * 1.1, Math.PI * 1.9); u.stroke(); for (let i = 0; i < 6; i++) { const a = Math.PI * (1.15 + i * 0.14); u.beginPath(); u.moveTo(Math.cos(a) * 22, 4 + Math.sin(a) * 22); u.lineTo(Math.cos(a) * 32, 4 + Math.sin(a) * 32); u.stroke(); } }   // lashes
  if (kind === 2) { u.beginPath(); u.arc(0, 0, 22, 0, 7); u.stroke(); for (let i = 0; i < 3; i++) { u.beginPath(); u.arc(-6 + i * 7, -4 + (i % 2) * 8, 2.5, 0, 7); u.fill(); } }   // skin
  if (kind === 3) { u.beginPath(); u.moveTo(-22, 10); u.quadraticCurveTo(-22, -24, 0, -24); u.quadraticCurveTo(22, -24, 22, 10); u.stroke(); for (let i = -2; i <= 2; i++) { u.beginPath(); u.moveTo(i * 7, 14); u.lineTo(i * 7, 24); u.stroke(); } }   // head spa
  if (kind === 'search') { u.beginPath(); u.arc(-4, -4, 13, 0, 7); u.stroke(); u.beginPath(); u.moveTo(6, 6); u.lineTo(16, 16); u.stroke(); }
  u.restore();
}
function drawUI(t, L) {
  u.clearRect(0, 0, W, H);
  // pill
  if (L.pill.a > 0.05 && L.pill.w > 300) { const a = clamp((L.pill.w - 300) / 200) * clamp((t - 0.6) / 0.3); icon('search', L.pill.x - 220, L.pill.y, 1.1, a); g.text(u, '搜索 美甲 · 美睫 · 皮肤管理', L.pill.x - 185, L.pill.y + 1, 30, 'rgba(255,255,255,.92)', { a, align: 'left', wt: 500 }); }
  // tiles
  L.tiles.forEach((q, i) => { const a = clamp((q.hw - 90) / 30) * clamp((q.e - 0.7) / 0.3) * (i === 0 ? 1 - clamp(q.m * 3) : 1); if (a <= 0) return; icon(i, q.x, q.y - 28, 1.5, a); g.text(u, TILES[i], q.x, q.y + 48, 32, '#fff', { a, wt: 700 }); });
  // tap ripples
  const ripple = (x, y, t0) => { const p = clamp((t - t0) / 0.5); if (p <= 0 || p >= 1) return; u.save(); u.globalAlpha = (1 - p) * 0.9; u.strokeStyle = '#fff'; u.lineWidth = 3 * K; u.beginPath(); u.arc(x * K, y * K, (20 + 70 * p) * K, 0, 7); u.stroke(); u.fillStyle = `rgba(255,255,255,${0.35 * (1 - p)})`; u.beginPath(); u.arc(x * K, y * K, 26 * K, 0, 7); u.fill(); u.restore(); };
  ripple(510, 580, 2.6);
  // menu card
  const c0 = L.tiles[0]; const ma = clamp((c0.m - 0.7) / 0.3) * (1 - clamp((t - 9.0) / 0.25));
  if (ma > 0) { const x0 = c0.x - c0.hw + 34, y0 = c0.y - c0.hh + 50; g.text(u, '美甲', x0, y0, 44, '#fff', { a: ma, align: 'left', wt: 900 }); g.text(u, 'NAIL · 门店价目', x0, y0 + 46, 20, 'rgba(255,255,255,.75)', { a: ma, align: 'left', font: 'Inter', wt: 600, ls: 3 });
    [['单色美甲', '¥98'], ['猫眼', '¥168'], ['法式', '¥138'], ['延长', '¥228']].forEach(([n, p], i) => { const y = y0 + 130 + i * 92; u.save(); u.globalAlpha = ma * 0.3; u.fillStyle = '#fff'; u.fillRect(x0 * K, (y + 34) * K, 310 * K, 1.2 * K); u.restore(); g.text(u, n, x0, y, 30, '#fff', { a: ma, align: 'left', wt: 600 }); g.text(u, p, x0 + 310, y, 32, '#ffd9ea', { a: ma, align: 'right', font: 'Inter', wt: 700 }); }); }
  // stylists
  L.sty.forEach((q, i) => { const a = clamp((q.e - 0.75) / 0.25) * clamp((q.r - 50) / 20) * (1 - clamp((t - 9.0) / 0.25)); if (a <= 0) return;
    const ag = u.createLinearGradient((q.x - 40) * K, (q.y - 40) * K, (q.x + 40) * K, (q.y + 40) * K); ag.addColorStop(0, ['#ffb3d1', '#ffd28a', '#b9a6ff'][i]); ag.addColorStop(1, ['#ff6fa8', '#ff8f6b', '#7f6bff'][i]);
    const rr = Math.min(q.r * 0.72, 58); u.save(); u.globalAlpha = a; u.fillStyle = ag; u.beginPath(); u.arc(q.x * K, q.y * K, rr * K, 0, 7); u.fill(); u.restore();
    g.text(u, STY[i][0].slice(0, 1), q.x, q.y + 2, rr * 0.9, '#fff', { a, wt: 900, font: STY[i][0] === 'Mia' ? 'Inter' : '"Noto Sans CJK SC"' });
    if (q.m < 0.3) { g.text(u, STY[i][0], q.x, q.y + q.r + 34, 30, '#fff', { a: a * (1 - q.m * 3), wt: 700 }); g.text(u, STY[i][1], q.x, q.y + q.r + 70, 22, 'rgba(255,255,255,.75)', { a: a * (1 - q.m * 3), wt: 500 }); }
    if (i === 1) { const ck = E.outBack(clamp((t - 5.0) / 0.3)); if (ck > 0) { u.save(); u.globalAlpha = a; u.fillStyle = '#ff4f9a'; u.beginPath(); u.arc((q.x + q.r * 0.7) * K, (q.y - q.r * 0.7) * K, 22 * ck * K, 0, 7); u.fill(); u.strokeStyle = '#fff'; u.lineWidth = 4 * K; u.beginPath(); u.moveTo((q.x + q.r * 0.7 - 9) * K, (q.y - q.r * 0.7) * K); u.lineTo((q.x + q.r * 0.7 - 2) * K, (q.y - q.r * 0.7 + 7) * K); u.lineTo((q.x + q.r * 0.7 + 10) * K, (q.y - q.r * 0.7 - 7) * K); u.stroke(); u.restore(); } }
  });
  ripple(1310, 470, 4.85);
  // slots
  if (t > 6.2 && t < 9.2) g.text(u, '周六 · 10 月 24 日', 1190, 470, 30, '#fff', { a: clamp((t - 6.3) / 0.3) * (1 - clamp((t - 8.9) / 0.3)), wt: 700 });
  L.slots.forEach((q, i) => { const a = clamp((q.e - 0.8) / 0.2) * clamp((q.hw - 70) / 20) * (1 - (q.drip || 0)); if (a <= 0) return; const full = FULL.includes(i);
    g.text(u, SLOTS[i], q.x, q.y - (full ? 8 : 0), 30, full ? 'rgba(255,255,255,.4)' : '#fff', { a, font: 'Inter', wt: 700 }); if (full) g.text(u, '已约满', q.x, q.y + 20, 16, 'rgba(255,255,255,.45)', { a, wt: 500 }); });
  ripple(1190, 670, 7.45);
  // confirm
  const cf = L.conf; const ca = clamp((cf.e - 0.8) / 0.2) * (1 - clamp((t - 8.95) / 0.2));
  if (ca > 0) g.text(u, '确认预约 · 周六 19:00 · 阿宁', cf.x, cf.y, 34, '#fff', { a: ca, wt: 700 });
  ripple(1260, 840, 8.85);
  // success tick
  const ok = clamp((t - 9.75) / 0.4), okOut = 1 - clamp((t - 10.85) / 0.2);
  if (ok > 0 && okOut > 0) { u.save(); u.globalAlpha = okOut; u.strokeStyle = '#fff'; u.lineWidth = 12 * K; u.lineCap = 'round'; u.lineJoin = 'round'; u.beginPath(); const P = [[905, 482], [948, 525], [1022, 440]]; const n = ok * 2; u.moveTo(P[0][0] * K, P[0][1] * K); if (n < 1) u.lineTo(lerp(P[0][0], P[1][0], n) * K, lerp(P[0][1], P[1][1], n) * K); else { u.lineTo(P[1][0] * K, P[1][1] * K); u.lineTo(lerp(P[1][0], P[2][0], n - 1) * K, lerp(P[1][1], P[2][1], n - 1) * K); } u.stroke(); u.restore();
    g.text(u, '预约成功', 960, 680, 40, '#fff', { a: okOut * clamp((t - 10.0) / 0.3), wt: 800, ls: 8 }); }
  // brand
  const ba = clamp((t - 11.3) / 0.4);
  if (ba > 0) { g.text(u, C.brand, 960, 442, 104, '#fff', { a: ba, wt: 900, ls: 16 }); }
}
Reel.scene({
  duration: 15, fps: 30,
  fonts: ['900 100px "Noto Sans CJK SC"', '700 40px "Noto Sans CJK SC"', '500 40px "Noto Sans CJK SC"', '400 100px "Noto Serif CJK SC"', '700 40px Inter', '600 40px Inter'],
  cues: [{ t: 0.3, sfx: 'blob', gain: 0.7 }, { t: 1.25, sfx: 'stretch', gain: 0.6 }, { t: 1.4, sfx: 'blob', gain: 0.4 }, { t: 1.55, sfx: 'blob', gain: 0.4 }, { t: 1.7, sfx: 'blob', gain: 0.4 },
    { t: 2.6, sfx: 'tick', gain: 0.7 }, { t: 3.05, sfx: 'stretch', gain: 0.6 }, { t: 3.5, sfx: 'blob', gain: 0.45 }, { t: 3.65, sfx: 'blob', gain: 0.45 }, { t: 3.8, sfx: 'blob', gain: 0.45 }, { t: 4.85, sfx: 'tick', gain: 0.7 }, { t: 5.85, sfx: 'whoosh', gain: 0.35 },
    ...[0, 1, 2, 3, 4, 5].map((i) => ({ t: +(6.25 + i * 0.09).toFixed(2), sfx: 'blob', gain: 0.32 })), { t: 7.45, sfx: 'tick', gain: 0.7 }, { t: 7.7, sfx: 'stretch', gain: 0.6 }, { t: 7.95, sfx: 'expand', gain: 0.5 },
    { t: 8.85, sfx: 'tick', gain: 0.7 }, { t: 9.1, sfx: 'morph', gain: 0.6 }, { t: 9.8, sfx: 'chime', gain: 0.7 }, { t: 10.9, sfx: 'expand', gain: 0.5 }, { t: 11.6, sfx: 'whoosh', gain: 0.3 }, { t: 12.1, sfx: 'glass', gain: 0.4 }],
  render(t) {
    wallpaper(t);
    const { S, L } = layout(t);
    g.draw(t, S, L.orb);
    drawUI(t, L);
  },
});
</script></body></html>
