<script>
/* ===== 01 日式手绘动画电影 · 云栖小院 =====
   Hand-painted anime-feature look: luminous painted skies with sculpted cumulus, thin coloured lines and hard
   two-tone cel shading, wet-stone reflections, god rays, bloom, drifting leaves, foreground bokeh.
   A fox traveller walks the lane in the rain under an oil-paper umbrella. He pushes the courtyard gate open,
   the rain stops and the sun breaks through. Inside, he settles into the hammock; a time-lapse sky carries the
   day into a starry night, lanterns and fireflies come on, a shooting star crosses. Title in a quiet serif. */
const { E, clamp, inv, lerp, hash } = Reel;
const T = Toon;
const stage = Reel.makeStage('#0c0807');
const C = Reel.cfg({ brand: '云栖小院', tag: '推开门，把疲惫留在门外', plaque: '云栖小院', sign: '云栖小院 200m', sig: '肖雄 2026' });
const L = Reel.canvas2d(stage);
let ctx = L.ctx; const K = L.k;
const CW = ctx.canvas.width, CH = ctx.canvas.height;
const WA = 2100, WB = 2500;
let SKYA = null, SKYAR = null, FGA = null, FGAR = null, FGB = null, CLOUDS = [], FILM = null, LAY = null, lctx = null, MSK = null, mctx = null, BLM = null, bctx = null;

// ---------- anime line + cel: thin coloured line, hard two-tone shade, no cartoon drop line ----------
T.LINE = '#4a2a1c';
T.ink = (c, path, o) => {
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (o.fill) { c.fillStyle = o.fill; c.fill(path); }
  if (o.shade) {
    const sh = o.sh || [-12, -14];
    c.save(); c.clip(path); c.fillStyle = o.shade; c.fill(path);
    c.translate(sh[0], sh[1]); c.fillStyle = o.fill; c.fill(path); c.restore();
  }
  if (!o.noLine) { c.strokeStyle = o.lc || 'rgba(74,38,24,.92)'; c.lineWidth = Math.max(1.6, (o.lw ?? 5) * 0.42); c.stroke(path); }
};
T.line = (c, path, lw = 4) => { c.lineJoin = 'round'; c.lineCap = 'round'; c.strokeStyle = 'rgba(74,38,24,.92)'; c.lineWidth = Math.max(1.6, lw * 0.45); c.stroke(path); };
// anime eye: amber iris, dark pupil, two catch-lights, heavy upper lash line
T.eye = (c, e) => {
  const { x, y, rx, ry } = e;
  const open = clamp(e.open ?? 1);
  if (open < 0.06) {
    const pts = e.happy ? T.qbez([x - rx, y + ry * 0.2], [x, y - ry * 0.6], [x + rx, y + ry * 0.2]) : T.qbez([x - rx * 1.05, y - ry * 0.05], [x, y + ry * 0.5], [x + rx * 1.1, y - ry * 0.1]);
    T.taper(c, pts, Math.max(3.5, rx * 0.26), '#3a1d12');
    if (!e.happy) { const b = pts[pts.length - 1]; T.taper(c, [b, [b[0] + rx * 0.3, b[1] - ry * 0.12]], 3, '#3a1d12'); }
    return;
  }
  const P0 = T.ell(x, y, rx, ry);
  c.fillStyle = '#fffaf2'; c.fill(P0);
  c.save(); c.clip(P0);
  const ix = x + (e.px || 0) * rx * 0.38, iy = y + (e.py || 0) * ry * 0.34 + ry * 0.08;
  const ir = rx * 0.78 * (e.ps ? lerp(0.85, 1, e.ps) : 1), iry = ry * 0.8;
  const ig = c.createLinearGradient(0, iy - iry, 0, iy + iry); ig.addColorStop(0, '#6b3a14'); ig.addColorStop(0.55, '#c27a26'); ig.addColorStop(1, '#f2c057');
  c.fillStyle = ig; c.fill(T.ell(ix, iy, ir, iry));
  c.fillStyle = '#24110a'; c.fill(T.ell(ix, iy + iry * 0.05, ir * 0.42 * (e.ps ?? 1), iry * 0.5 * (e.ps ?? 1)));
  c.fillStyle = '#ffffff'; c.fill(T.ell(ix - ir * 0.35, iy - iry * 0.42, ir * 0.3, iry * 0.26));
  c.fillStyle = 'rgba(255,255,255,.85)'; c.fill(T.ell(ix + ir * 0.35, iy + iry * 0.45, ir * 0.15, iry * 0.11));
  if (e.spark) { c.fillStyle = 'rgba(255,250,220,.95)'; c.fill(T.ell(ix + ir * 0.2, iy - iry * 0.55, ir * 0.12, iry * 0.1)); }
  // eyelid shadow
  c.fillStyle = 'rgba(120,60,40,.25)'; c.fill(T.ell(x, y - ry * 0.95, rx * 1.4, ry * 0.45));
  if (open < 0.999) {
    const ly = y - ry + (1 - open) * ry * 2.05;
    c.fillStyle = e.lid || '#c06a2a';
    const lp = new Path2D(); lp.moveTo(x - rx * 1.3, y - ry * 1.4); lp.lineTo(x + rx * 1.3, y - ry * 1.4); lp.lineTo(x + rx * 1.3, ly - ry * 0.1); lp.quadraticCurveTo(x, ly + ry * 0.28, x - rx * 1.3, ly - ry * 0.1); lp.closePath(); c.fill(lp);
  }
  c.restore();
  const ly = open < 0.999 ? y - ry + (1 - open) * ry * 2.05 : y - ry;
  T.taper(c, T.qbez([x - rx * 1.08, ly + ry * 0.35], [x, ly - ry * 0.22], [x + rx * 1.15, ly + ry * 0.2]), Math.max(4, rx * 0.34), '#2e160c', (u) => Math.sin(Math.PI * clamp(u * 0.85 + 0.12)));
  c.strokeStyle = 'rgba(74,38,24,.6)'; c.lineWidth = 1.5; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0.35, Math.PI - 0.35); c.stroke();
};

const P = {
  fur: '#e07a2e', furS: '#b2561a', furW: '#9a5d36', furWS: '#6d3f22', wht: '#fbf1e2', whtS: '#dccdb6', sock: '#3a2418', sockS: '#24150d',
  case: '#3f8c86', caseS: '#2d6a65', cloud: '#8f99a9', cloudS: '#6c7586',
};
const hx2 = (c) => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const mixc = (a, b, u) => { const A = hx2(a), B = hx2(b); return `rgb(${lerp(A[0], B[0], u) | 0},${lerp(A[1], B[1], u) | 0},${lerp(A[2], B[2], u) | 0})`; };
const R = (x, y, w, h) => { const p = new Path2D(); p.rect(x, y, w, h); return p; };
function mkCanvas(ww) { const c = document.createElement('canvas'); c.width = Math.round(ww * K); c.height = Math.round(1080 * K); const g = c.getContext('2d', { willReadFrequently: true }); g.setTransform(K, 0, 0, K, 0, 0); return [c, g]; }
function finishTex(c, g, seed) {
  const tex = T.paintTex(c.width >> 1, c.height >> 1, seed, { blot: 0.55, grain: 0.6, streak: 0.45 });
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-atop'; g.globalAlpha = 1;
  // multiply-like darkening via a temp: draw tex with multiply only where painted
  g.globalCompositeOperation = 'multiply'; g.globalAlpha = 0.45; g.drawImage(tex, 0, 0, c.width, c.height);
  g.globalCompositeOperation = 'overlay'; g.globalAlpha = 0.3; g.drawImage(tex, 0, 0, c.width, c.height);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
}
// tiled roof with upturned eaves (side elevation)
function roof(g, x0, x1, yTop, yEave, col = '#4b5059', colB = '#363a42') {
  const up = 26, ov = 40;
  const p = new Path2D(); p.moveTo(x0 - ov, yEave - up); p.quadraticCurveTo(x0 - ov * 0.4, yEave + 4, x0 + 60, yEave);
  p.lineTo(x1 - 60, yEave); p.quadraticCurveTo(x1 + ov * 0.4, yEave + 4, x1 + ov, yEave - up);
  p.quadraticCurveTo(x1 - 40, yTop + 20, x1 - 90, yTop); p.lineTo(x0 + 90, yTop); p.quadraticCurveTo(x0 + 40, yTop + 20, x0 - ov, yEave - up); p.closePath();
  T.wash(g, p, col, colB, { edge: 0.3, edgeW: 12, y0: yTop, y1: yEave });
  g.save(); g.clip(p); g.strokeStyle = 'rgba(20,22,28,.35)'; g.lineWidth = 3;
  for (let x = x0 - ov; x < x1 + ov; x += 22) { g.beginPath(); g.moveTo(x, yTop); g.lineTo(x + (x - (x0 + x1) / 2) * 0.06, yEave + 6); g.stroke(); }
  g.restore();
  // ridge with curled ends
  const rp = new Path2D(); rp.moveTo(x0 + 70, yTop + 4); rp.lineTo(x1 - 70, yTop + 4); rp.quadraticCurveTo(x1 - 40, yTop - 2, x1 - 30, yTop - 26); rp.quadraticCurveTo(x1 - 60, yTop - 14, x1 - 80, yTop - 12); rp.lineTo(x0 + 80, yTop - 12); rp.quadraticCurveTo(x0 + 60, yTop - 14, x0 + 30, yTop - 26); rp.quadraticCurveTo(x0 + 40, yTop - 2, x0 + 70, yTop + 4); rp.closePath();
  T.wash(g, rp, '#3b3f47', null, { edge: 0.2 });
  // eave lip
  g.strokeStyle = '#2b2e35'; g.lineWidth = 7; g.beginPath(); g.moveTo(x0 - ov, yEave - up); g.quadraticCurveTo(x0 - ov * 0.4, yEave + 4, x0 + 60, yEave); g.lineTo(x1 - 60, yEave); g.quadraticCurveTo(x1 + ov * 0.4, yEave + 4, x1 + ov, yEave - up); g.stroke();
}
function mountains(g, ww, y0, cols) {
  cols.forEach((c, k) => {
    const pts = [[-10, 1080]]; for (let x = -10; x <= ww + 20; x += 40) pts.push([x, y0 + k * 60 - 90 * Math.abs(Math.sin(x * 0.0021 + k * 1.7)) - 50 * Math.abs(Math.sin(x * 0.0057 + k)) + 20 * Math.sin(x * 0.02 + k)]);
    pts.push([ww + 20, 1080]); T.wash(g, T.poly(pts), c[0], c[1], { edge: 0.12, edgeW: 8, y0: y0 - 160, y1: y0 + 200 });
  });
}
function cloudsBG(g, ww, seed) {
  for (let i = 0; i < 6; i++) {
    const x = hash(i * 3.3 + seed) * ww, y = 90 + hash(i * 1.7 + seed) * 180, w = 140 + hash(i + seed) * 160;
    g.fillStyle = 'rgba(255,252,240,.75)'; g.fill(T.blob(x, y, w, w * 0.28, (a) => 1 + 0.18 * Math.sin(a * 5 + i), 32));
    g.fillStyle = 'rgba(200,190,200,.25)'; g.fill(T.blob(x + 10, y + w * 0.12, w * 0.8, w * 0.12, null, 24));
  }
}
function canopy(g, cx, cy, rx, ry, seed) {
  for (let i = 0; i < 14; i++) {
    const a = hash(i * 2.1 + seed) * 6.28, d = Math.sqrt(hash(i * 5.3 + seed));
    const x = cx + Math.cos(a) * rx * d * 0.75, y = cy + Math.sin(a) * ry * d * 0.7, r = 70 + hash(i + seed) * 60;
    T.wash(g, T.blob(x, y, r, r * 0.85, (b) => 1 + 0.1 * Math.sin(b * 6 + i), 28), i % 3 ? '#5f8a46' : '#4c7638', '#3e6430', { edge: 0.25, edgeW: 10, y0: y - r, y1: y + r });
  }
  for (let i = 0; i < 60; i++) { const a = hash(i * 9.1 + seed) * 6.28, d = Math.sqrt(hash(i * 4.3)); g.fillStyle = 'rgba(244,206,90,.85)'; g.fill(T.ell(cx + Math.cos(a) * rx * d, cy + Math.sin(a) * ry * d, 4, 4)); }
  for (let i = 0; i < 8; i++) { const a = hash(i * 7.7 + seed) * 6.28; g.fillStyle = 'rgba(220,240,180,.35)'; g.fill(T.ell(cx + Math.cos(a) * rx * 0.4 - 40, cy + Math.sin(a) * ry * 0.4 - 40, 50, 30)); }
}
function lattice(g, x, y, w, h, lit = false) {
  T.wash(g, R(x - 10, y - 10, w + 20, h + 20), '#6b4630', '#55361f', { edge: 0.2 });
  T.wash(g, R(x, y, w, h), lit ? '#ffd690' : '#e9dcc0', lit ? '#f2a95a' : '#d8c6a2', { edge: 0.25, y0: y, y1: y + h });
  g.strokeStyle = '#5e3c26'; g.lineWidth = 5;
  for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(x + w * i / 4, y); g.lineTo(x + w * i / 4, y + h); g.stroke(); }
  for (let i = 1; i < 5; i++) { g.beginPath(); g.moveTo(x, y + h * i / 5); g.lineTo(x + w, y + h * i / 5); g.stroke(); }
}


// ---------------------------------------------------------------- scene A: lane + gate
const DOOR = { x0: 1030, x1: 1210, y0: 610, y1: 905 };
function paintAFg() {
  const [c, g] = mkCanvas(WA);
  mountains(g, WA, 520, [['#86a3c6', '#b4c9dc'], ['#5f8f6e', '#8ab089']]);
  // courtyard beyond: tree tops and the main roof
  canopy(g, 1520, 470, 260, 120, 3); canopy(g, 380, 520, 200, 90, 7);
  roof(g, 1300, 1960, 430, 540);
  // wall
  const wall = R(-10, 560, WA + 20, 345);
  T.wash(g, wall, '#f4efe4', '#e2d8c5', { edge: 0.25, edgeW: 22, y0: 560, y1: 905 });
  g.save(); g.clip(wall);
  for (let i = 0; i < 10; i++) { const x = hash(i * 7.1) * WA, y = 620 + hash(i * 2.9) * 200; g.fillStyle = 'rgba(140,120,90,.08)'; g.fill(T.blob(x, y, 80, 40, (a) => 1 + 0.25 * Math.sin(a * 3 + i), 24)); }
  const st = g.createLinearGradient(0, 780, 0, 905); st.addColorStop(0, 'rgba(90,80,60,0)'); st.addColorStop(1, 'rgba(90,80,60,.3)'); g.fillStyle = st; g.fillRect(0, 780, WA, 125);
  g.restore();
  T.wash(g, R(-10, 845, WA + 20, 60), '#9b978d', '#827e75', { edge: 0.2 });  // stone base
  for (let x = 0; x < WA; x += 110) { g.strokeStyle = 'rgba(50,48,44,.35)'; g.lineWidth = 3; g.strokeRect(x + (Math.floor(x / 110) % 2) * 20, 848, 110, 28); }
  // wall cap tiles
  const cap = T.poly([[-10, 575], [WA + 10, 575], [WA + 10, 548], [-10, 548]]);
  T.wash(g, cap, '#555a63', '#3d4048', { edge: 0.2 });
  for (let x = -10; x < WA; x += 24) { g.fillStyle = '#3a3d45'; g.fill(T.ell(x, 578, 11, 7)); }
  g.fillStyle = 'rgba(60,70,130,.2)'; g.fill(T.poly([[-10, 582], [WA + 10, 582], [WA + 10, 618], [-10, 604]]));
  // moon window (right)
  g.save(); const mw = T.ell(1640, 720, 92, 92); T.wash(g, mw, '#f6d9a0', '#e9b46b', { edge: 0.3, y0: 630, y1: 810 }); g.clip(mw);
  canopy(g, 1640, 700, 90, 50, 11); g.restore();
  g.strokeStyle = '#8c8578'; g.lineWidth = 14; g.stroke(T.ell(1640, 720, 98, 98));
  // gatehouse
  for (const px of [975, 1235]) T.wash(g, R(px, 520, 30, 385), '#6a3d28', '#4f2c1c', { edge: 0.3 });
  roof(g, 950, 1290, 400, 520, '#4a4f58', '#33363d');
  T.wash(g, R(965, 520, 310, 22), '#5a3524', null, { edge: 0.2 });
  // doorway interior: warm courtyard glimpse
  const dw = R(DOOR.x0, DOOR.y0, DOOR.x1 - DOOR.x0, DOOR.y1 - DOOR.y0);
  T.wash(g, dw, '#ffefc4', '#f2c27c', { edge: 0.35, edgeW: 20, y0: DOOR.y0, y1: DOOR.y1 });
  g.save(); g.clip(dw); canopy(g, 1150, 650, 70, 40, 5); T.wash(g, R(1140, 680, 14, 230), '#7a5634', null, { edge: 0 });
  T.wash(g, R(DOOR.x0, 860, 180, 50), '#e8c48e', '#d6a96c', { edge: 0 }); g.restore();
  g.strokeStyle = '#3e2416'; g.lineWidth = 12; g.strokeRect(DOOR.x0 - 6, DOOR.y0 - 6, DOOR.x1 - DOOR.x0 + 12, DOOR.y1 - DOOR.y0 + 6);
  // plaque
  T.wash(g, T.rrect(1045, 548, 150, 52, 6), '#3a2416', '#2a180e', { edge: 0.3, y0: 548, y1: 600 });
  g.strokeStyle = '#c9a052'; g.lineWidth = 3; g.stroke(T.rrect(1051, 554, 138, 40, 4));
  g.fillStyle = '#e8c46a'; g.font = '700 30px "Noto Serif CJK SC"'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(C.plaque, 1120, 575);
  // step
  T.wash(g, R(990, 900, 260, 22), '#b8b0a0', '#a29a8a', { edge: 0.25 });
  // bamboo cluster left of gate + signpost
  for (let i = 0; i < 7; i++) {
    const x = 760 + i * 26 + hash(i) * 10, top = 330 + hash(i * 3) * 120;
    T.wash(g, R(x, top, 12, 905 - top), '#6f9a4c', '#55803a', { edge: 0.2, y0: top, y1: 905 });
    for (let k = top + 40; k < 900; k += 70) { g.fillStyle = '#4c7034'; g.fillRect(x - 1, k, 14, 4); }
    for (let k = 0; k < 5; k++) { const ly = top + 20 + k * 50, s = k % 2 ? 1 : -1; g.fillStyle = k % 2 ? '#5f8a40' : '#4e7934'; g.fill(T.ell(x + 6 + s * 34, ly, 38, 9, s * 0.4)); }
  }
  T.wash(g, R(546, 650, 14, 260), '#7a5532', '#5e3f22', { edge: 0.2 });
  const sgn = T.poly([[440, 680], [640, 680], [670, 712], [640, 744], [440, 744]]);
  T.wash(g, sgn, '#ead7b0', '#d9c08f', { edge: 0.3, y0: 680, y1: 744 });
  g.fillStyle = '#5a3a22'; g.font = '700 26px "Noto Sans CJK SC"'; g.textAlign = 'center'; g.fillText(C.sign, 548, 713);
  // lane pavement
  const PV = R(-10, 905, WA + 20, 180);
  T.wash(g, PV, '#cbc2b1', '#aea590', { edge: 0, y0: 905, y1: 1080 });
  g.save(); g.clip(PV);
  for (let r = 0; r < 6; r++) {
    const y = 910 + r * r * 4 + r * 16, hh = 12 + r * 6;
    for (let i = -1; i < 30; i++) { const ww = 90 + r * 16, x = i * ww + (r % 2) * ww * 0.5; g.fillStyle = `rgba(${130 + hash(i + r * 3) * 40 | 0},${125 + hash(i * 2 + r) * 30 | 0},${112 + hash(i + r) * 25 | 0},.4)`; g.fill(T.rrect(x + 3, y + 2, ww - 6, hh - 3, hh * 0.4)); }
  }
  const gs = g.createLinearGradient(0, 905, 0, 945); gs.addColorStop(0, 'rgba(60,50,40,.4)'); gs.addColorStop(1, 'rgba(60,50,40,0)'); g.fillStyle = gs; g.fillRect(0, 905, WA, 40);
  g.restore();
  for (const [px, col] of [[1300, '#b8653b'], [1390, '#3f6f8f']]) {
    T.wash(g, T.poly([[px - 40, 870], [px + 40, 870], [px + 30, 935], [px - 30, 935]]), col, null, { edge: 0.3, y0: 870, y1: 935 });
    for (let i = 0; i < 7; i++) { const a = -Math.PI / 2 + (i - 3) * 0.35; g.fillStyle = i % 2 ? '#5f8a40' : '#4c7034'; g.fill(T.ell(px + Math.cos(a) * 40, 870 + Math.sin(a) * 55, 14, 38, a + Math.PI / 2)); }
  }
  texLight(c, g, 2.2);
  puddles(c, g, WA, [[300, 990, 150, 26], [720, 950, 110, 18], [1380, 1010, 190, 30], [1760, 960, 120, 20], [1050, 1060, 140, 18]]);
  return c;
}

// ---------------------------------------------------------------- scene B: courtyard (sky separate for night)
const WIN = [[300, 580, 170, 180], [620, 580, 170, 180], [940, 580, 170, 180]];
const LANT = [[300, 470, 0], [1130, 470, 1], [1520, 0, 2], [1620, 0, 3], [1720, 0, 4], [1810, 0, 5]];
const HA = [1430, 690], HB = [1890, 700];
const ropeY = (x) => { const u = (x - 1430) / (1890 - 1430); return lerp(455, 440, u) + Math.sin(u * Math.PI) * 60; };
function paintBFg() {
  const [c, g] = mkCanvas(WB);
  mountains(g, WB, 560, [['#86a3c6', '#b4c9dc'], ['#5f8f6e', '#8ab089']]);

  // house
  T.wash(g, R(150, 430, 1110, 450), '#f4eee2', '#e1d6c1', { edge: 0.25, edgeW: 20, y0: 430, y1: 880 });
  for (const px of [150, 520, 860, 1230]) T.wash(g, R(px, 440, 28, 440), '#6a3d28', '#4f2c1c', { edge: 0.3 });
  for (const w of WIN) lattice(g, ...w);
  T.wash(g, R(1110, 600, 100, 280), '#6a3d28', '#4a2a1a', { edge: 0.3 });   // door
  g.fillStyle = '#c9a052'; g.fill(T.ell(1130, 740, 6, 6));
  T.wash(g, R(150, 845, 1110, 38), '#9b978d', '#827e75', { edge: 0.2 });
  roof(g, 140, 1270, 300, 440);
  // couplet / small sign on door
  T.wash(g, R(1125, 618, 70, 36), '#c8392c', null, { edge: 0.2 }); g.fillStyle = '#f6d98a'; g.font = '700 22px "Noto Serif CJK SC"'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('福', 1160, 637);
  // courtyard floor
  const PV = R(-10, 880, WB + 20, 210);
  T.wash(g, PV, '#d4c9b4', '#b7aa90', { edge: 0, y0: 880, y1: 1080 });
