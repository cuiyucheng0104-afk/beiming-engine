<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>08 · 智能安防 · 守望安防</title>
<script src="../lib/core.js"></script><script src="../lib/hud.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 08 赛博 HUD · 行业示例：智能安防（门店监控）=====
   A monitoring wall. Four live feeds of a shop at night, each a LiDAR-style point cloud with AI detection
   boxes on the people. A stranger lingers at the back door: the box turns amber, the counter climbs, the
   feed flashes red and expands to full screen; the AI panel types out what it did (push to the owner's
   phone, strobe + siren) and the stranger leaves. Then the wall opens out to nine feeds. */
const { E, clamp, inv, lerp } = Reel;
const stage = Reel.makeStage('#02060a');
const C = Reel.cfg({ brand: '守望安防', sub: 'AI 监控 · 7×24 小时替你看店' });
const ctx = HUD.init(stage); const K = HUD.K, h1 = HUD.h1;
// ---- four mini scenes at different world offsets
const OFF = [[0, 0], [400, 0], [800, 0], [1200, 0]];
function sceneStore(ox) {     // aisle with shelves
  for (const sx of [-6, 6]) for (let z = 0; z < 40; z += 0.5) for (let y = 0; y < 5; y += 0.5) { const sh = Math.abs(y % 1.25) < 0.12; if (sh || h1(z * 7 + y * 3 + sx) > 0.72) HUD.add(ox + sx + (sx > 0 ? -1 : 1) * (sh ? 0 : h1(z + y) * 1.2), y, z, sh ? 0 : 1); }
  for (let z = 0; z < 40; z += 1) for (let x = -8; x <= 8; x += 1) HUD.add(ox + x, 0, z, 2);
}
function sceneLot(ox) {       // parking lot with cars
  for (let z = 0; z < 50; z += 1.2) for (let x = -20; x <= 20; x += 1.2) HUD.add(ox + x, 0, z, 2);
  for (let r = 0; r < 2; r++) for (let c = 0; c < 6; c++) { const cx = ox - 16 + c * 6.4, cz = 10 + r * 18; for (let x = -1.1; x <= 1.1; x += 0.35) for (let z = -2.2; z <= 2.2; z += 0.35) { HUD.add(cx + x, 1.1, cz + z, 0); if (Math.abs(z) < 1.2) HUD.add(cx + x, 1.75, cz + z * 0.8, 0); } for (let z = 0; z < 5; z += 0.7) HUD.add(cx - 3.2, 0.02, cz - 2.5 + z, 3); }
}
function sceneDoor(ox) {      // back door / loading area
  for (let x = -12; x <= 12; x += 0.4) for (let y = 0; y < 9; y += 0.4) { const door = Math.abs(x) < 3.5 && y < 6; if (door ? (y % 0.8 < 0.2) : h1(x * 3 + y * 7) > 0.55) HUD.add(ox + x, y, 30, door ? 1 : 0); }
  for (let z = 0; z < 30; z += 1) for (let x = -12; x <= 12; x += 1) HUD.add(ox + x, 0, z, 2);
  for (const [bx, bz] of [[7, 26], [8.5, 26.5], [7.6, 24.6], [-9, 27]]) for (let x = 0; x < 1.4; x += 0.3) for (let y = 0; y < 1.4; y += 0.3) for (let z = 0; z < 1.4; z += 0.7) HUD.add(ox + bx + x, y, bz + z, 3);
  for (let a = 0; a < 6.28; a += 0.25) HUD.add(ox + Math.cos(a) * 0.5, 7.4 + Math.sin(a) * 0.3, 29.6, 4);    // lamp
}
function sceneCounter(ox) {   // front counter + entrance
  for (let x = -10; x <= 10; x += 0.5) for (let y = 0; y < 1.1; y += 0.3) HUD.add(ox + x * 0.4 - 2, y, 18 + (x + 10) * 0.05, 0);
  for (let x = -12; x <= 12; x += 0.4) for (let y = 0; y < 7; y += 0.4) { const glass = x > 2 && x < 8; if (glass ? (x % 1.2 < 0.15 || y % 3.5 < 0.15) : h1(x * 5 + y) > 0.6) HUD.add(ox + x, y, 30, glass ? 1 : 0); }
  for (let z = 0; z < 30; z += 1) for (let x = -12; x <= 12; x += 1) HUD.add(ox + x, 0, z, 2);
}
sceneStore(OFF[0][0]); sceneLot(OFF[1][0]); sceneDoor(OFF[2][0]); sceneCounter(OFF[3][0]);
// ---- people (drawn per frame)
function person(x, z, ph, walk = 1) {
  const P = [];
  for (let k = 0; k < 40; k++) { const a = k / 40 * 6.28; P.push([x + Math.cos(a) * 0.32, 1.7 + Math.sin(a) * 0.3, z + Math.sin(a * 2) * 0.1]); }
  for (let y = 0.9; y < 1.45; y += 0.06) for (let a = 0; a < 6.28; a += 0.5) P.push([x + Math.cos(a) * 0.32, y, z + Math.sin(a) * 0.2]);
  const sw = Math.sin(ph) * 0.35 * walk;
  for (let y = 0; y < 0.9; y += 0.06) { P.push([x - 0.15, y, z + sw * (0.9 - y)]); P.push([x + 0.15, y, z - sw * (0.9 - y)]); }
  for (let y = 0.85; y < 1.4; y += 0.08) { P.push([x - 0.42, y, z - sw * 0.5 * (1.4 - y)]); P.push([x + 0.42, y, z + sw * 0.5 * (1.4 - y)]); }
  return P;
}
const PEOPLE = (t) => [
  { f: 0, x: OFF[0][0] + 1.5 * Math.sin(t * 0.4), z: 12 + t * 1.6, ph: t * 7 },
  { f: 1, x: OFF[1][0] - 6 + t * 1.4, z: 19, ph: t * 7 },
  { f: 2, x: OFF[2][0] + (t < 4.6 ? lerp(-10, -2.2, t / 4.6) : t < 9.0 ? -2.2 : lerp(-2.2, -14, (t - 9.0) / 2)), z: t < 4.6 ? 22 + t : t < 9.0 ? 26.6 : 26.6 - (t - 9.0) * 2, ph: t * 7, walk: t > 4.6 && t < 9.0 ? 0.08 : 1 },
  { f: 3, x: OFF[3][0] + 4.5, z: 28 - ((t * 2.3) % 20), ph: t * 7 },
];
// feed cameras
const CAMS = [
  { x: 0, y: 6, z: -2, yaw: 0, pitch: -0.22 }, { x: 400, y: 14, z: -6, yaw: 0, pitch: -0.42 },
  { x: 800, y: 6.5, z: 8, yaw: 0, pitch: -0.18 }, { x: 1200, y: 6, z: 4, yaw: 0, pitch: -0.2 },
];
const LAB = ['CAM 01 · 货架区', 'CAM 02 · 停车场', 'CAM 03 · 后门', 'CAM 04 · 收银台'];
function feed(i, vx, vy, vw, vh, t, focus = 0) {
  const c = CAMS[i % 4], push = focus;
  HUD.cam = { x: c.x + (i > 3 ? (i - 3) * 1.5 : 0), y: c.y - push * 1.8, z: c.z + push * 5.5, yaw: c.yaw + (i > 3 ? 0.25 * ((i % 3) - 1) : 0), pitch: c.pitch + push * 0.04, roll: 0, F: 1450 * vw / 1920, cx: vx + vw / 2, cy: vy + vh / 2 };
  ctx.save(); ctx.beginPath(); ctx.rect(vx * K, vy * K, vw * K, vh * K); ctx.clip();
  ctx.fillStyle = '#03080d'; ctx.fillRect(vx * K, vy * K, vw * K, vh * K);
  const strobe = i === 2 && t > 8.4 && t < 10.2 ? (Math.floor(t * 8) % 2 ? [255, 60, 90] : [70, 120, 255]) : null;
  HUD.points((j, d) => { const k = HUD.PK[j], X = HUD.PX[j]; if (Math.abs(X - OFF[i % 4][0]) > 60) return null; const fog = clamp(1.3 - d / 60);
    let col = k === 1 ? [255, 190, 60] : k === 2 ? [60, 120, 220] : k === 3 ? [255, 120, 200] : k === 4 ? [255, 250, 200] : [95, 246, 255];
    if (strobe) col = col.map((v, q) => lerp(v, strobe[q], 0.45));
    return [`rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},`, (k === 2 ? 0.45 : 0.8) * fog]; }, { clip: [vx, vy, vx + vw, vy + vh], far: 90, pw: 1.8 * Math.max(0.7, vw / 1920 * 1.6) });
  // people + detection box
  const P = PEOPLE(t).find((p) => p.f === i % 4);
  if (P) {
    const pts = person(P.x, P.z, P.ph, P.walk ?? 1); let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    ctx.globalCompositeOperation = 'lighter';
    for (const q of pts) { const p = HUD.proj(...q); if (p[2] < 1) continue; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(p[0] * K, p[1] * K, 2.4 * K, 2.4 * K); x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
    ctx.globalCompositeOperation = 'source-over';
    if (x1 > x0) {
      const loiter = i % 4 === 2 && t > 4.6 && t < 9.4, alert = i % 4 === 2 && t > 5.6 && t < 9.4;
      const col = alert ? HUD.PINK : loiter ? HUD.AMB : HUD.GRN, pad = 8;
      HUD.corners(x0 - pad, y0 - pad, x1 - x0 + pad * 2, y1 - y0 + pad * 2, Math.min(18, (x1 - x0) / 3), col, 2);
      const sz = Math.max(11, vw / 1920 * 22);
      HUD.txt(alert ? '⚠ 陌生人逗留' : loiter ? `逗留 ${Math.floor((t - 4.6) * 6)}s` : `人员 0.${96 + (i % 3)}`, x0 - pad, y0 - pad - sz, sz, col, 'left', 1, '"Noto Sans CJK SC"', 700);
    }
  }
  ctx.restore();
  // frame + labels
  const alertF = i % 4 === 2 && t > 5.6 && t < 9.4 && Math.floor(t * 6) % 2 === 0;
  HUD.rect(vx, vy, vw, vh, alertF ? HUD.PINK : HUD.CY, alertF ? 1 : 0.6, false, alertF ? 4 : 1.5);
  const ls = Math.max(11, vw / 1920 * 24);
  HUD.txt(LAB[i % 4] + (i > 3 ? ` -${i}` : ''), vx + 14, vy + ls + 4, ls, '#e8fbff', 'left', 0.9, '"Noto Sans CJK SC"', 700);
  const sec = 8 + Math.floor(t);
  HUD.txt(`2026-10-17 23:41:${String(sec).padStart(2, '0')}`, vx + vw - 14, vy + ls + 4, ls * 0.8, HUD.CY, 'right', 0.8);
  if (Math.floor(t * 2) % 2 === 0) { ctx.fillStyle = '#ff3b4d'; ctx.beginPath(); ctx.arc((vx + 18) * K, (vy + vh - 18) * K, 5 * K * Math.max(0.6, vw / 960), 0, 7); ctx.fill(); }
  HUD.txt('REC', vx + 30, vy + vh - 18, ls * 0.7, '#ff7a86', 'left', 0.9);
}
const G2 = (i) => [60 + (i % 2) * 910, 80 + Math.floor(i / 2) * 470, 890, 450];
const G3 = (i) => [60 + (i % 3) * 605, 80 + Math.floor(i / 3) * 315, 590, 300];
Reel.scene({
  duration: 15, fps: 30,
  fonts: [`500 20px ${HUD.MONO}`, '900 84px "Noto Sans CJK SC"', '700 26px "Noto Sans CJK SC"'],
  cues: [{ t: 0.1, sfx: 'boot', gain: 0.6 }, { t: 0.5, sfx: 'click', gain: 0.4 }, { t: 4.6, sfx: 'beep', gain: 0.45 }, { t: 5.2, sfx: 'beep', gain: 0.45 }, { t: 5.6, sfx: 'glitch', gain: 0.5 },
    ...[5.6, 5.95, 6.3].map((x) => ({ t: x, sfx: 'beep', gain: 0.6 })), { t: 6.2, sfx: 'zoom', gain: 0.5 }, { t: 7.2, sfx: 'type', gain: 0.4 }, { t: 7.8, sfx: 'type', gain: 0.4 }, { t: 8.4, sfx: 'lock', gain: 0.6 },
    { t: 8.45, sfx: 'neon', gain: 0.5 }, { t: 10.3, sfx: 'whoosh', gain: 0.4 }, { t: 10.6, sfx: 'blocks', gain: 0.4 }, { t: 11.75, sfx: 'glitch', gain: 0.5 }, { t: 12.0, sfx: 'impact_soft', gain: 0.6 }],
  render(t) {
    ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#010407'; ctx.fillRect(0, 0, HUD.W, HUD.H);
    const exp = E.inOutCubic(inv(6.2, 7.0, t)) * (1 - E.inOutCubic(inv(10.2, 10.9, t)));   // CAM03 full screen
    const nine = E.inOutCubic(inv(10.3, 11.0, t));
    const boot = (i) => E.outCubic(clamp((t - 0.15 - i * 0.12) / 0.3));
    if (nine < 0.01) {
      for (let i = 0; i < 4; i++) { if (i === 2) continue; const b = boot(i); if (b <= 0) continue; const [x, y, w, h] = G2(i); ctx.globalAlpha = 1 - exp; if (exp < 0.99) feed(i, x + w * (1 - b) / 2, y, w * b, h, t); ctx.globalAlpha = 1; }
      const [x, y, w, h] = G2(2), b = boot(2);
      if (b > 0) feed(2, lerp(x, 0, exp), lerp(y, 0, exp), lerp(w * b, 1920, exp), lerp(h, 1080, exp), t, exp * E.inOutSine(inv(7.0, 10.0, t)));
    } else {
      for (let i = 0; i < 9; i++) { const [x, y, w, h] = G3(i), [x2, y2, w2, h2] = i < 4 ? G2(i) : [960, 540, 0, 0]; const k = clamp(nine * 1.4 - i * 0.05); if (i >= 4 && k <= 0) continue; feed(i, lerp(x2, x, k), lerp(y2, y, k), lerp(w2, w, k), lerp(h2, h, k), t); }
    }
    // AI panel during the full-screen alert
    const pa = exp * clamp((t - 7.0) / 0.3);
    if (pa > 0) {
      const x0 = 1300, y0 = 240; HUD.rect(x0, y0, 520, 420, '#1a0610', 0.75 * pa, true); HUD.corners(x0, y0, 520, 420, 20, HUD.PINK, 2, pa);
      HUD.txt('AI 安防分析', x0 + 26, y0 + 40, 26, HUD.PINK, 'left', pa, '"Noto Sans CJK SC"', 900);
      const L = ['非营业时间 · 23:41', '后门逗留 > 30 秒', '人脸未登记', '已推送店主手机', '联动声光警告'];
      L.forEach((s, i) => { const a = clamp((t - 7.3 - i * 0.35) / 0.3); if (a <= 0) return; HUD.txt('▶ ' + s.slice(0, Math.ceil(s.length * a)), x0 + 26, y0 + 110 + i * 58, 24, i >= 3 ? HUD.GRN : '#ffffff', 'left', pa, '"Noto Sans CJK SC"', 700); });
      if (t > 9.3) HUD.txt('目标已离开 · 记录已存档', 960, 960, 26, HUD.GRN, 'center', pa * clamp((t - 9.3) / 0.3), '"Noto Sans CJK SC"', 700);
    }
    if (nine > 0.5) HUD.txt('9 路全覆盖 · 一部手机看全店', 960, 1028, 24, HUD.CY, 'center', clamp((nine - 0.5) * 2) * (1 - clamp((t - 11.6) / 0.3)), '"Noto Sans CJK SC"', 700);
    if (t > 11.9) { ctx.fillStyle = `rgba(1,4,7,${0.7 * E.outCubic(clamp((t - 11.9) / 0.4))})`; ctx.fillRect(0, 0, HUD.W, HUD.H); }
    HUD.title(t, 12.0, C.brand, C.sub, 520);
    let g = 0; for (const [a, d] of [[5.6, 0.15], [11.75, 0.25], [6.15, 0.08]]) if (t > a && t < a + d) g = Math.max(g, 1 - (t - a) / d);
    HUD.post(t, g, 0.45, 0.14);
  },
});
</script></body></html>
