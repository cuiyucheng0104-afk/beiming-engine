<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>19 · 宠物用品 · 毛球宠物</title>
<script src="../lib/core.js"></script><script src="../lib/gl.js"></script><script src="../lib/rm.js"></script><script src="../lib/clay.js"></script>
</head><body><div id="stage"></div>
<script>
/* ===== 19 黏土定格 · 行业示例：宠物用品 =====
   A character piece at the puppy's eye level, 12 drawings a second. A clay shiba trots in (the camera dollies
   along with it), stops at an empty bowl and sniffs; kibble rattles in from above; it eats, looks up at us,
   wags. A striped ball rolls in, it hops after it twice. The camera pulls back and up and a bone-shaped
   plaque with the shop's name hops up behind them. */
const { E, clamp, lerp, inv } = Reel;
const stage = Reel.makeStage('#cfe0e8');
Reel.ownJitter = true;
const C = Reel.cfg({ brand: '毛球宠物', sub: '主粮 · 玩具 · 洗护' });
let K;
const PI = Math.PI;
const D = (t, t0, h, d) => CLAY.drop(t, t0, h, d);
const FUR = '#e59a4e', WHITE = '#fbf3e6', DARK = '#7a4a26', BLACK = '#17110d';
const ry = (v, a) => [v[0] * Math.cos(a) + v[2] * Math.sin(a), v[1], -v[0] * Math.sin(a) + v[2] * Math.cos(a)];
const rz = (v, a) => [v[0] * Math.cos(a) - v[1] * Math.sin(a), v[0] * Math.sin(a) + v[1] * Math.cos(a), v[2]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
function pupX(t) { return lerp(-2.5, 0.02, clamp(t / 3.0)); }
function pose(t) {
  const P = { x: pupX(t), y: 0, yaw: 0, hy: 0, hp: 0, tail: 0.3 * Math.sin(t * 6), walk: t < 3.0 ? t * 2.2 : 0, step: t < 3.0 ? 1 : 0, eye: 1, ear: 0, bob: 0, sq: 1 };
  if (t < 3.0) P.bob = 0.02 * Math.abs(Math.sin(t * 2.2 * PI));
  if (t >= 3.0 && t < 3.6) P.hp = 0.28 * (0.5 - 0.5 * Math.cos((t - 3.0) * 4 * PI));            // sniff, sniff
  if (t >= 4.4 && t < 5.7) P.hp = 0.75 + 0.14 * Math.sin((t - 4.4) * 7 * PI);                    // eating
  if (t >= 5.7) { const u = E.outBack(clamp((t - 5.7) / 0.4)); P.hy = -1.0 * u; P.hp = -0.12 * u; P.ear = u; }
  if ((t > 6.1 && t < 6.25) || (t > 12.0 && t < 12.15)) P.eye = 0.1;
  if (t > 6.3 && t < 7.6) { P.tail = 0.7 * Math.sin((t - 6.3) * 22); P.sq = 1 + 0.04 * Math.sin((t - 6.3) * 22); }
  if (t >= 7.6 && t < 9.4) { const u = E.inOutSine(clamp((t - 7.6) / 0.5)); P.hy = lerp(-1.0, 0.35, u); P.hp = -0.05; }
  if (t >= 8.5 && t < 9.5) { for (const h0 of [8.5, 9.0]) { const u = (t - h0) / 0.42; if (u >= 0 && u < 1) P.y = 0.22 * 4 * u * (1 - u); if (u >= 1 && u < 1.25) P.sq = 0.85; if (u > -0.2 && u < 0) P.sq = 0.88; } P.tail = 0.6 * Math.sin(t * 20); }
  if (t >= 9.5) { const u = E.inOutSine(clamp((t - 9.5) / 0.8)); P.yaw = -0.62 * u; P.hy = lerp(0.35, -0.45, u); P.tail = 0.6 * Math.sin(t * 16); P.ear = 1; }
  return P;
}
function puppy(t, O) {
  const P = pose(t), base = [P.x, P.y + P.bob, 0];
  const W = (v) => add(base, ry([v[0], v[1] * P.sq, v[2]], P.yaw));
  const g = 1, k = 0.06;
  O.push({ t: 0, p: W([0, 0.38, 0]), s: [0.36, 0.24, 0.22], c: FUR, g, k, r: [P.yaw, 0, 0], sq: P.sq });
  O.push({ t: 0, p: W([0.12, 0.31, 0]), s: [0.22, 0.17, 0.17], c: WHITE, g, k, r: [P.yaw, 0, 0] });
  // head with its own turn (yaw) and nod (pitch about the body's side axis)
  const H = [0.36, 0.62, 0];
  const HW = (v) => { let q = rz(v, -P.hp); q = ry(q, P.hy); return W(add(H, q)); };
  const hr = [P.yaw + P.hy, 0, -P.hp];
  O.push({ t: 0, p: HW([0, 0, 0]), s: [0.21, 0.19, 0.2], c: FUR, g, k, r: hr });
  O.push({ t: 0, p: HW([0.16, -0.06, 0]), s: [0.12, 0.08, 0.11], c: WHITE, g, k: 0.04, r: hr });
  O.push({ t: 0, p: HW([0.28, -0.02, 0]), s: [0.045, 0.034, 0.05], c: BLACK, gloss: 1, fp: false, r: hr });
  for (const s of [-1, 1]) {
    if (P.eye > 0.5) O.push({ t: 0, p: HW([0.15, 0.06, 0.095 * s]), s: [0.035, 0.038, 0.035], c: BLACK, gloss: 1, fp: false });
    else O.push({ t: 2, p: HW([0.16, 0.055, 0.095 * s]), s: [0.009, 0.03, 1], c: BLACK, r: [P.yaw + P.hy + PI / 2, PI / 2, 0], fp: false });
    O.push({ t: 5, p: HW([-0.01, 0.17 + 0.015 * P.ear, 0.12 * s]), s: [0.08, 0.055, 0.01, 0.018], c: FUR, r: [P.yaw + P.hy, 0.5 * s * (1 - 0.3 * P.ear), -P.hp + 0.15], g, k: 0.035 });
    O.push({ t: 0, p: HW([0.19, -0.035, 0.13 * s]), s: [0.035, 0.02, 0.02], c: '#ff9c8f', fp: false, r: hr });
  }
  // legs: swing opposite pairs while walking
  [[0.21, 0.12, 0], [0.21, -0.12, 1], [-0.21, 0.12, 1], [-0.21, -0.12, 0]].forEach(([lx, lz, ph], i) => {
    const sw = P.step * 0.45 * Math.sin(P.walk * PI + ph * PI);
    const top = [lx, 0.25, lz], foot = add(top, rz([0, -0.2, 0], sw));
    O.push({ t: 2, p: W([(top[0] + foot[0]) / 2, (top[1] + foot[1]) / 2 + 0.02, lz]), s: [0.068, 0.09, 0.9], c: FUR, r: [P.yaw, 0, sw], g, k: 0.05 });
    O.push({ t: 0, p: W([foot[0] + 0.02, Math.max(0.045, foot[1]), lz]), s: [0.08, 0.045, 0.07], c: WHITE, r: [P.yaw, 0, 0], g, k: 0.04 });
  });
  // tail: a curled arc that wags
  O.push({ t: 8, p: W([-0.36, 0.55, 0]), s: [0.11, 0.045, 1.4], c: FUR, r: [P.yaw + P.tail, 0, 1.2], g, k: 0.04 });
  // collar + tag
  O.push({ t: 3, p: W([0.27, 0.52, 0]), s: [0.155, 0.026], c: '#d93a3a', r: [P.yaw, 0, -0.95], fp: false, gloss: 0.4 });
  O.push({ t: 4, p: W([0.37, 0.43, 0]), s: [0.045, 0.012, 0.008], c: '#f2c14e', r: [P.yaw, PI / 2, 0], gloss: 1, fp: false });
}
function objs(t) {
  const O = [];
  // bowl
  const BX = 0.62;
  O.push({ t: 4, p: [BX, 0.06, 0.05], s: [0.24, 0.06, 0.03], c: '#4f8fd6', gloss: 0.5, g: 2, k: 0.03 });
  O.push({ t: 3, p: [BX, 0.11, 0.05], s: [0.21, 0.045], c: '#4f8fd6', gloss: 0.5, g: 2, k: 0.03 });
  for (let i = 0; i < 9; i++) { const t0 = 3.45 + Math.floor(i / 2) / 12 * 2; const d = D(t, t0, 1.1, 0.24); if (!d.on) continue;
    const eaten = t > 4.6 + i * 0.1 && t < 5.7 && i % 3 === 0; if (eaten) continue;
    const a = i * 2.4, r = 0.05 + 0.11 * Reel.hash(i * 3.3);
    O.push({ t: 0, p: [BX + Math.cos(a) * r, 0.14 + d.y + (i > 5 ? 0.04 : 0), 0.05 + Math.sin(a) * r], s: [0.045, 0.03, 0.04], c: i % 2 ? '#8a4f24' : '#a8652f', r: [a, 0.4, 0] }); }
  // striped ball rolls in from the right, bounces after the pup's hops
  if (t > 7.4) { const u = E.outQuad(clamp((t - 7.4) / 1.1)); let y = 0; for (const h0 of [8.62, 9.12]) { const v = (t - h0) / 0.36; if (v > 0 && v < 1) y = 0.12 * 4 * v * (1 - v); }
    const x = lerp(3.2, 1.3, u); O.push({ t: 0, p: [x, 0.15 + y, 0.45], s: [0.15, 0.15, 0.15], c: '#ffffff', pat: 2, pc: '#e8453c', r: [0, 0, -(x - 1.3) / 0.15], fp: false, gloss: 0.4 }); }
  // the bone-shaped plaque behind them
  const pl = D(t, 10.0, 1.2, 0.24);
  if (pl.on) { const cx = 1.05, cy = 0.82 + pl.y + 0.12 * (pl.sq - 1), cz = -0.75;
    O.push({ t: 10, p: [cx, cy, cz], s: [0.62, 0.19, 0.06, 0.06], c: '#f3e4ca', g: 3, k: 0.05, sq: pl.sq, matte: true });
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) O.push({ t: 0, p: [cx + sx * 0.64, cy + sy * 0.1, cz], s: [0.13, 0.13, 0.08], c: '#f3e4ca', g: 3, k: 0.05 });
    for (const sx of [-0.3, 0.3]) O.push({ t: 2, p: [cx + sx, (cy - 0.2) / 2, cz - 0.02], s: [0.03, (cy - 0.2) / 2, 1], c: '#c98a4b', fp: false }); }
  puppy(t, O);
  return O;
}
function camAt(t) {
  const px = pupX(t), u = E.inOutCubic(inv(9.8, 11.6, t));
  const ro = [lerp(px + 0.25, 0.42, clamp((t - 2.6) / 0.8)), 0.52, 2.35];
  const ta = [lerp(px + 0.45, 0.5, clamp((t - 2.6) / 0.8)), 0.45, 0];
  return { p: [lerp(ro[0], 0.62, u) + 0.05 * Math.sin(t * 0.4), lerp(ro[1], 0.9, u), lerp(ro[2], 2.95, u)], a: [lerp(ta[0], 0.64, u), lerp(ta[1], 0.5, u), lerp(ta[2], -0.25, u)], fov: 3.0 };
}
function decal() {
  const g = K.decal, w = K.decalCv.width, h = K.decalCv.height; g.clearRect(0, 0, w, h);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `900 160px "Noto Sans CJK SC"`; g.fillStyle = '#5a3418'; g.fillText(C.brand, w / 2, h * 0.4);
  g.font = `800 74px "Noto Sans CJK SC"`; g.fillStyle = '#e07b2e'; g.fillText(C.sub, w / 2, h * 0.82);
  K.markDecal();
}
Reel.scene({
  duration: 15, fps: 30,
  fonts: ['900 150px "Noto Sans CJK SC"', '700 58px "Noto Sans CJK SC"'],
  frameKey: (t) => Math.floor(t * 12 + 1e-6),
  cues: [...[0.2, 0.65, 1.1, 1.55, 2.0, 2.45, 2.9].map((t) => ({ t, sfx: 'step_soft', gain: 0.5 })), { t: 3.1, sfx: 'sniff' }, { t: 3.45, sfx: 'coin', gain: 0.25 }, { t: 3.6, sfx: 'ticks', gain: 0.5 },
    { t: 4.5, sfx: 'gulp', gain: 0.5 }, { t: 5.0, sfx: 'gulp', gain: 0.4 }, { t: 5.75, sfx: 'boing', gain: 0.4 }, { t: 6.3, sfx: 'laugh', gain: 0.3 }, { t: 7.4, sfx: 'roll', gain: 0.5 },
    { t: 8.5, sfx: 'jump' }, { t: 9.0, sfx: 'jump' }, { t: 9.8, sfx: 'whoosh', gain: 0.4 }, { t: 10.25, sfx: 'land' }, { t: 10.5, sfx: 'chime', gain: 0.5 }],
  async setup() { K = CLAY.make(stage, { n: 44, decalSize: [1024, 314], rm: { bloom: 0.18, th: 1.45 } }); decal(); },
  render(tRaw) {
    const t = Math.floor(tRaw * 12 + 1e-6) / 12;
    K.set(objs(t));
    const cam = camAt(t); const P = pose(t);
    const fu = E.inOutSine(inv(9.8, 11.6, t)); const fp = [lerp(P.x + 0.3, 0.45, fu), 0.5, lerp(0, -0.32, fu)];
    K.render(t, cam, { floorType: 0, floor: '#e3cfa2', sky0: '#a9d4ea', sky1: '#fde3c8', bulb: [1, 0.82, 0.55], backZ: 2.9, bulbY: 1.55, focus: Math.hypot(cam.p[0] - fp[0], cam.p[1] - fp[1], cam.p[2] - fp[2]), aperture: lerp(130, 55, E.inOutSine(inv(9.8, 11.6, t))), maxCoc: 22, ldir: CLAY.norm([-0.45, 0.8, 0.5]) });
  },
});
</script></body></html>
