<script>
/* ===== 18 水墨国风 · 行业示例：古镇文旅 =====

   poled along the canal keeps pace with us, ripples drift, willow strands sway, red lanterns bloom under the

const BACK = [[300, 180, 200, 1], [820, 200, 230, 1], [2160, 170, 210, 1], [2460, 200, 220, 1]];
