<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>大桥的五十九分钟</title>
<style>
@font-face{font-family:SansSC;src:url(fonts/sans700.woff2) format('woff2');font-weight:700}
@font-face{font-family:Mono;src:url(fonts/mono400.woff2) format('woff2');font-weight:400}
@font-face{font-family:Mono;src:url(fonts/mono600.woff2) format('woff2');font-weight:600}
html,body{margin:0;background:#0B0C0E;overflow:hidden}canvas{display:block}
</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script src="timeline.js"></script>
<script>
// 大桥的五十九分钟 · visual investigation · Canvas 2D, window.render(t) is deterministic (seeded noise only, frame-indexed).
// All timing comes from timeline.js (TL). Footage frames load on demand (render awaits them), so any frame renders alone.
const W = 1920, H = 1080, FPS = TL.FPS;
const cv = document.getElementById('c'), x = cv.getContext('2d');
const C = { bg:'#0B0C0E', panel:'#141619', line:'#2E3238', text:'#ECEAE4', dim:'#8B9097', faint:'#4A4F57', acc:'#FF4A2E', paper:'#E4E0D4', ink:'#1D1D1B' };
const F = { sans:'SansSC', mono:'Mono, SansSC' };
const B = b => TL.T(b), A = TL.AT, SEC = TL.SEC;
let FR = 0, REC = null;

// ── utilities ──
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3), ei = k => k * k * k, eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
function rnd(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const inSec = (t, k) => t >= B(SEC[k][0]) && t < B(SEC[k][1]);

// ── footage frames: lazy, cached, awaited by render ──
const CACHE = new Map(), STILL = {}; let GRAIN = [];
const N = { side: 135, deck: 270, fall: 183 };
const fk = (s, i) => `${s}/${String(clamp(Math.round(i), 1, N[s])).padStart(3, '0')}`;
function loadKey(k) {
  if (CACHE.has(k)) { const v = CACHE.get(k); CACHE.delete(k); CACHE.set(k, v); return v.p; }
  const im = new Image(); const p = new Promise(r => { im.onload = () => im.decode().then(() => r(im), () => r(im)); im.onerror = () => { console.warn('missing', k); r(null); }; });
  im.src = `assets/${k}.jpg`; CACHE.set(k, { im, p }); return p;
}
const IMG = k => { const v = CACHE.get(k); return v && v.im.naturalWidth ? v.im : null; };
function loadImg(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => { console.warn('missing', src); r(null); }; i.src = src; }); }

// event clock (minutes after 00:00 PST); rewind accelerates (ease-in), elsewhere ease-in-out
function clockMin(t) { const K = TL.CLOCK; let i = 0; while (i < K.length - 1 && t >= B(K[i + 1][0])) i++; const a = K[i], b = K[i + 1]; if (!b) return a[1];
  const k = seg(t, B(a[0]), B(b[0])); return lerp(a[1], b[1], a[0] === 3 ? ei(k) : eio(k)); }
const hm = m => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(Math.floor(m % 60)).padStart(2, '0')}`;
const hms = m => `${hm(m)}:${String(Math.floor((m * 60) % 60)).padStart(2, '0')}`;
const tplus = m => { const s = Math.max(0, Math.round(m * 60)); return `T+${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };

// ── drawing primitives ──
function txt(s, X, Y, o = {}) {
  x.save(); x.font = `${o.w || 700} ${o.s || 24}px ${o.f || F.sans}`; x.fillStyle = o.c || C.text; x.globalAlpha *= (o.a ?? 1);
  x.textAlign = o.al || 'left'; x.textBaseline = 'alphabetic'; x.letterSpacing = (o.ls || 0) + 'px';
  if (x.globalAlpha > 0.001) x.fillText(s, X, Y);
  const w = x.measureText(s).width; const ga = x.globalAlpha; x.restore();
  if (REC && o.id && ga > 0.5) { const sz = o.s || 24, x0 = o.al === 'right' ? X - w : o.al === 'center' ? X - w / 2 : X; REC.push({ id: o.id, text: s, x0, y0: Y - sz * .9, x1: x0 + w, y1: Y + sz * .25 }); }
  return w;
}
function tw(s, o = {}) { x.save(); x.font = `${o.w || 700} ${o.s || 24}px ${o.f || F.sans}`; x.letterSpacing = (o.ls || 0) + 'px'; const w = x.measureText(s).width; x.restore(); return w; }
function hair(x0, y0, x1, y1, c = C.line, w = 1, dash) { x.save(); x.strokeStyle = c; x.lineWidth = w; if (dash) x.setLineDash(dash); x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); x.restore(); }
function rect(X, Y, w, h, c = C.line, lw = 1, dash) { x.save(); x.strokeStyle = c; x.lineWidth = lw; if (dash) x.setLineDash(dash); x.strokeRect(X + .5, Y + .5, w - 1, h - 1); x.restore(); }
function fill(X, Y, w, h, c) { x.fillStyle = c; x.fillRect(X, Y, w, h); }
function flash(t, at, X, Y, w, h, d = .12) { if (t < at) return; const k = 1 - seg(t, at, at + d); if (k <= 0) return; x.save(); x.globalAlpha = k * .95; fill(X, Y, w, h, '#fff'); x.restore(); }
// a source picture: one grade + one grain (sources only); returns source → screen mapping
function plate(img, sx, sy, sw, sh, X, Y, w, h, o = {}) {
  x.save(); fill(X, Y, w, h, '#000');
  if (img) { x.filter = o.map ? 'grayscale(1) brightness(0.62) contrast(1.15)' : 'grayscale(1) contrast(1.22) brightness(0.94)'; x.drawImage(img, sx, sy, sw, sh, X, Y, w, h); x.filter = 'none'; }
  if (GRAIN.length) { x.beginPath(); x.rect(X, Y, w, h); x.clip(); x.globalCompositeOperation = 'overlay'; x.globalAlpha = o.map ? .10 : .22;
    const g = GRAIN[FR % 6], ox = (FR * 37) % 256, oy = (FR * 91) % 256; for (let gy = Y - oy; gy < Y + h; gy += 256) for (let gx = X - ox; gx < X + w; gx += 256) x.drawImage(g, gx, gy); }
  x.restore();
  if (!o.noborder) rect(X, Y, w, h, o.border || C.line, o.bw || 1);
  const k = w / sw; return (px, py) => [X + (px - sx) * k, Y + (py - sy) * k];
}
// push inside the picture: source window shrinks by z around focus (fx, fy in source px)
function pushed(img, X, Y, w, h, z, fx, fy, o) {
  if (!img) { fill(X, Y, w, h, '#000'); return (px, py) => [X, Y]; }
  const iw = img.naturalWidth, ih = img.naturalHeight; let sw = iw / z, sh = sw * h / w; if (sh > ih / z) { sh = ih / z; sw = sh * w / h; }
  const sx = clamp(fx - sw / 2, 0, iw - sw), sy = clamp(fy - sh / 2, 0, ih - sh); return plate(img, sx, sy, sw, sh, X, Y, w, h, o);
}
function tag(s, X, Y, o = {}) { const a = o.a ?? 1; x.save(); x.globalAlpha *= a; fill(X, Y - 11, 6, 12, o.chip || C.acc); x.restore();
  return txt(s, X + 14, Y, { s: 16, f: F.mono, w: 600, ls: 1, c: C.text, a, id: o.id }); }
// red circle, clockwise, ease-out over its progress k; label on a leader at 60 %
function ring(cx, cy, r, k, label, side = 1, id) {
  if (k <= 0) return; x.save(); x.strokeStyle = C.acc; x.lineWidth = 2.5; x.beginPath(); x.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * eo(clamp(k))); x.stroke(); x.restore();
  if (label && k > .6) { const a = seg(k, .6, .72), lx = cx + side * r * .72, ly = cy - r * .72, ex = lx + side * 46, ey = ly - 40;
    x.save(); x.globalAlpha *= a; hair(lx, ly, ex, ey, C.acc, 1.5); hair(ex, ey, ex + side * 16, ey, C.acc, 1.5); x.restore();
    txt(label, ex + side * 24, ey + 13, { s: 36, al: side > 0 ? 'left' : 'right', a, id }); }
}
function badge(X, Y, t, at) { const k = seg(t, at, at + .06); if (k <= 0) return; x.save(); x.globalAlpha *= k; const s = 1 + .25 * (1 - seg(t, at, at + .18)); x.translate(X, Y); x.scale(s, s);
  x.fillStyle = 'rgba(11,12,14,0.9)'; x.fillRect(-17, -17, 34, 34); x.strokeStyle = C.acc; x.lineWidth = 2; x.strokeRect(-17, -17, 34, 34);
  x.beginPath(); x.moveTo(-9, 0); x.lineTo(-2, 8); x.lineTo(10, -8); x.lineWidth = 3.2; x.stroke(); x.restore(); }
// typeset telegram card (paper). k = typing progress 0..1; TEXTS reports the whole line from the first visible frame
function card(X, Y, w, h, time, zh, k, o = {}) {
  x.save(); fill(X, Y, w, h, C.paper); if (o.red) fill(X, Y, 8, h, C.acc); x.restore();
  const all = [...time, ...' ', ...zh], n = Math.floor(clamp(k) * all.length + 1e-6), tShown = all.slice(0, Math.min(n, time.length)).join(''), zShown = n > time.length + 1 ? zh.slice(0, n - time.length - 1) : '';
  const sz = o.s || 34, base = Y + h / 2 + sz * .36;
  x.save(); x.font = `600 ${sz}px ${F.mono}`; x.fillStyle = C.ink; x.fillText(tShown, X + 28, base); const tw0 = x.measureText(time).width; x.restore();
  x.save(); x.font = `700 ${sz}px ${F.sans}`; x.fillStyle = C.ink; x.fillText(zShown, X + 28 + tw0 + 22, base); const zw = x.measureText(zh).width; x.restore();
  if (k < 1 && k > 0) { const cx0 = X + 28 + (n <= time.length ? tw(tShown, { f: F.mono, w: 600, s: sz }) : tw0 + 22 + tw(zShown, { s: sz })); fill(cx0 + 3, base - sz * .8, 3, sz * .95, C.ink); }
  if (REC && o.id) REC.push({ id: o.id, text: `${time} ${zh}`, x0: X + 28, y0: base - sz * .9, x1: X + 28 + tw0 + 22 + zw, y1: base + sz * .25 });
}
const typeK = (t, at, n) => seg(t, at, at + n * .035);

// ── layouts ──
const P1 = { X: 60, Y: 144, w: 1056, h: 792 };            // big footage panel (S1, S5)
const COL = [{ X: 60, Y: 270, w: 560, h: 420 }, { X: 680, Y: 270, w: 560 }, { X: 1300, Y: 270, w: 560, h: 420 }];
const RING_FALL = [290, 330, 170];      // source px (912×684 frame) of the tearing deck in fall/019
const RING_DECK = [372, 410, 92];       // the far deck tilting, deck/079
const NOAA_C = [980, 720];               // the low off the Washington coast on the NOAA analysis (source px)

// ── S1 cold open (b0–5): decisive frame → sources slam in → sync sweep → rewind ──
function sOpen(t) {
  const rw = t >= B(A.rewind), rw2 = t >= B(A.rewind2);
  let img, idx;
  if (!rw) img = IMG(fk('fall', 19));
  else if (!rw2) { const k = seg(t, B(A.rewind), B(A.rewind2)); img = IMG(fk('fall', lerp(90, 13, k))); }
  else { const k = seg(t, B(A.rewind2), B(A.grid)); img = IMG(fk('side', lerp(135, 1, k))); }
  const z = rw ? 1.0 : lerp(1.0, 1.04, eio(seg(t, 0, B(A.rewind))));
  const fx = rw ? 456 : RING_FALL[0] + 60, fy = rw ? 342 : RING_FALL[1];
  const map = pushed(img, P1.X, P1.Y, P1.w, P1.h, z, fx, fy);
  if (rw) scanlines(t, P1);
  if (!rw) { const [cx, cy] = map(RING_FALL[0], RING_FALL[1]); ring(cx, cy, RING_FALL[2] * P1.w / 912 * z, seg(t, B(A.ringOpen), B(A.ringOpen) + .5)); }
  flash(t, 0, P1.X, P1.Y, P1.w, P1.h);
  tag('影片 · Elliott', P1.X, P1.Y - 14, { id: 'tag_ftg_open' });
  // clock readout (counter) top right of the panel
  if (t >= B(A.clockOpen)) { const m = clockMin(t); const cw = txt(hm(m), P1.X + P1.w, P1.Y - 14, { s: 56, f: F.mono, w: 600, al: 'right', c: rw ? C.acc : C.text });
    txt('≈', P1.X + P1.w - cw - 14, P1.Y - 14, { s: 40, f: F.mono, w: 400, al: 'right', c: C.dim });
    if (rw) txt('◀◀', P1.X + 24, P1.Y + 52, { s: 34, f: F.mono, w: 600, c: C.acc }); }
  // NOAA analysis (document, map grade)
  const R = { X: 1176, Y: 184, w: 684, h: 520 };
  if (t >= B(A.noaaIn)) { pushed(STILL.noaa, R.X, R.Y, R.w, R.h, 1.75, NOAA_C[0], NOAA_C[1], { map: 1 }); flash(t, B(A.noaaIn), R.X, R.Y, R.w, R.h);
    tag('天气图 · NOAA', R.X, R.Y - 14, { id: 'tag_noaa_open' }); }
  if (t >= B(A.card0In)) { tag('转录 · WSDOT', 1176, 772, { id: 'tag_tr_open' }); card(1176, 786, 684, 150, '11:02', '断落', typeK(t, B(A.card0In), 7), { red: 1, s: 48, id: 'card_open' }); flash(t, B(A.card0In), 1176, 786, 684, 150); }
  // sync line sweep b2 → b2.75, left to right across every source
  const sk = seg(t, B(A.sweep), B(A.sweep) + .5);
  if (sk > 0 && sk < 1) { const sx = lerp(40, 1880, eio(sk)); x.save(); const g = x.createLinearGradient(sx - 160, 0, sx, 0); g.addColorStop(0, 'rgba(255,74,46,0)'); g.addColorStop(1, 'rgba(255,74,46,.28)');
    x.fillStyle = g; x.fillRect(sx - 160, 120, 160, 830); x.restore(); hair(sx, 110, sx, 950, C.acc, 3); }
}
function scanlines(t, R) { // rewind: bright travelling bars, line tearing, faint horizontal lines
  const r = rnd(FR * 7 + 3); x.save(); x.beginPath(); x.rect(R.X, R.Y, R.w, R.h); x.clip();
  for (let y = R.Y; y < R.Y + R.h; y += 4) { x.fillStyle = 'rgba(0,0,0,.18)'; x.fillRect(R.X, y, R.w, 1.5); }
  for (let i = 0; i < 3; i++) { const by = R.Y + ((FR * 23 + i * 290) % R.h), bh = 10 + r() * 26; x.fillStyle = `rgba(255,255,255,${.10 + r() * .14})`; x.fillRect(R.X, by, R.w, bh);
    x.drawImage(cv, R.X, by + bh, R.w, 18, R.X + (r() - .5) * 60, by + bh, R.w, 18); }
  x.restore(); rect(R.X, R.Y, R.w, R.h, C.acc, 2);
}

// ── S2 / S4 three-column sync grid ──
const AX = { X: 700, y0: 300, y1: 930, m0: 420, m1: 665 };
const axY = m => lerp(AX.y0, AX.y1, (m - AX.m0) / (AX.m1 - AX.m0));
const G_CARDS = [{ at: A.col2, y: 300, time: '07:30', zh: '风速 38', m: 450, n: 10, id: 'card_0730' }, { at: A.c0930, y: 420, time: '≈09:30', zh: '风速 42', m: 570, n: 12, id: 'card_0930' }, { at: A.film, y: 540, time: '10:03', zh: '开始扭转', m: 603, n: 10, id: 'card_1003' }];
function grid(t, frozen) {
  const S = frozen ? 'sync' : 'grid', m = clockMin(t), on = b => frozen || t >= B(b);
  // big clock
  const cw = txt(frozen ? hms(m) : hm(m), 60, 196, { s: 120, f: F.mono, w: 600, c: frozen ? C.acc : C.text });
  if (!frozen) txt('1940-11-07 PST', 60 + cw + 28, 196, { s: 24, f: F.mono, w: 400, c: C.dim, id: 'date' });
  // col 1: wind
  const c1 = COL[0];
  if (on(A.grid)) { const pz = frozen ? 1.6 : lerp(1.15, 1.6, eio(seg(t, B(A.grid), B(SEC.grid[1])))); pushed(STILL.noaa, c1.X, c1.Y, c1.w, c1.h, pz, NOAA_C[0], NOAA_C[1], { map: 1 });
    if (!frozen) { flash(t, B(A.grid), c1.X, c1.Y, c1.w, c1.h); tag('天气图 · NOAA', c1.X, c1.Y - 14, { id: 'tag_noaa_grid' }); }
    const v = (frozen || t >= B(A.c0930)) ? '42' : '38', snap = frozen ? 0 : 1 - seg(t, B(A.c0930), B(A.c0930) + .15);
    const vw = txt(v, c1.X, 880, { s: 168, f: F.mono, w: 600, c: frozen || (snap > 0 && t >= B(A.c0930)) ? C.acc : C.text });
    txt('英里/时', c1.X + vw + 18, 880, { s: 32, c: C.dim, id: frozen ? null : 'unit_grid' });
    flash(t, B(A.grid), c1.X, 720, 400, 180); }
  // col 2: telegram time axis with playhead
  if (on(A.col2)) { const k = frozen ? 1 : seg(t, B(A.col2), B(A.col2) + .3);
    if (!frozen) tag('转录 · WSDOT', 680, c1.Y - 14, { id: 'tag_tr_grid' });
    hair(AX.X, AX.y0, AX.X, lerp(AX.y0, AX.y1, k), C.dim, 1.5);
    for (let h = 7; h <= 11; h++) { const y = axY(h * 60); if (y > lerp(AX.y0, AX.y1, k)) continue; hair(AX.X - 8, y, AX.X, y, C.dim, 1.5); txt(`${String(h).padStart(2, '0')}:00`, AX.X - 14, y + 5, { s: 14, f: F.mono, w: 400, c: C.faint, al: 'right' }); }
    for (const g of G_CARDS) { if (!on(g.at)) continue; const py = axY(g.m);
      x.save(); x.fillStyle = C.text; x.beginPath(); x.arc(AX.X, py, 5, 0, 7); x.fill(); x.restore();
      hair(AX.X + 6, py, 730, g.y + 48, C.acc, 1.5, [6, 5]);
      card(730, g.y, 510, 96, g.time, g.zh, frozen ? 1 : typeK(t, B(g.at), g.n), { id: frozen ? null : g.id, s: 34 });
      if (!frozen) flash(t, B(g.at), 730, g.y, 510, 96); }
    if (frozen) { const py = axY(662); x.save(); x.fillStyle = C.acc; x.beginPath(); x.arc(AX.X, py, 7, 0, 7); x.fill(); x.restore(); txt('11:02', AX.X + 26, py - 12, { s: 26, f: F.mono, w: 600, c: C.acc }); }
    const py = axY(m); x.save(); x.fillStyle = C.acc; x.beginPath(); x.moveTo(AX.X + 3, py); x.lineTo(AX.X + 18, py - 8); x.lineTo(AX.X + 18, py + 8); x.fill(); x.restore(); hair(AX.X - 10, py, AX.X + 3, py, C.acc, 2.5); }
  // col 3: film (lights when its source begins)
  const c3 = COL[2];
  // before its source begins, the film column is an empty 1 px frame with a waiting stopwatch (the grid reads as three columns from b5)
  if (!on(A.film) && t >= B(A.grid)) { rect(c3.X, c3.Y, c3.w, c3.h, C.line, 1);
    hair(c3.X + c3.w / 2 - 14, c3.Y + c3.h / 2, c3.X + c3.w / 2 + 14, c3.Y + c3.h / 2, C.faint, 1); hair(c3.X + c3.w / 2, c3.Y + c3.h / 2 - 14, c3.X + c3.w / 2, c3.Y + c3.h / 2 + 14, C.faint, 1);
    txt('T+--:--', c3.X, 880, { s: 84, f: F.mono, w: 600, c: C.faint }); }
  if (on(A.film)) { const idx = frozen ? null : 1 + (t - B(A.film)) * FPS; const img = frozen ? IMG(fk('fall', 13)) : IMG(fk('side', idx));
    pushed(img, c3.X, c3.Y, c3.w, c3.h, 1, 456, 342, frozen ? { border: C.acc, bw: 2 } : {});
    if (!frozen) { flash(t, B(A.film), c3.X, c3.Y, c3.w, c3.h); tag('影片 · Elliott ≈', c3.X, c3.Y - 14, { id: 'tag_ftg_grid' }); }
    txt(tplus(frozen ? 59 : (m - 603)), c3.X, 880, { s: 84, f: F.mono, w: 600, c: frozen ? C.acc : C.text }); }
  // hard sync: red dashed line through all three readouts at y 850
  if (frozen) { const k = eo(seg(t, B(A.syncLine), B(A.syncLine) + .6)); const sy = axY(662); hair(40, sy, lerp(40, 1880, k), sy, C.acc, 2.5, [14, 9]);
    for (const c of [COL[0], COL[2]]) flash(t, B(A.sync), c.X, c.Y, c.w, c.h, .1); flash(t, B(A.sync), 60, 60, 760, 150, .1); }
}

// ── S3 freeze, circle, magnify ──
// freeze panel 960×720 (2/3 of the frame height); loupe 640² at ×1.5 of the panel = 1.58 asset px = 2.37 source px per screen px (archival cap ≈ 2.5×)
const PM = { X: 60, Y: 150, w: 960, h: 720 }, LP = { X: 1140, Y: 150, w: 640, h: 640 }, LZ = 1.5;
function sMag(t) {
  const fz = IMG(fk('deck', 79)), z = lerp(1.0, 1.05, eio(seg(t, B(A.mag), B(SEC.mag[1]))));
  const map = pushed(fz, PM.X, PM.Y, PM.w, PM.h, z, RING_DECK[0] + 40, RING_DECK[1]);
  flash(t, B(A.mag), PM.X, PM.Y, PM.w, PM.h);
  tag('影片 · Elliott', PM.X, PM.Y - 14, { id: 'tag_ftg_mag' });
  txt('定格', PM.X + PM.w, PM.Y - 14, { s: 22, c: C.dim, al: 'right', id: 'freeze_mark' });
  const [cx, cy] = map(RING_DECK[0], RING_DECK[1]), sc = PM.w / 912 * z, rr = RING_DECK[2] * sc;
  ring(cx, cy, rr, seg(t, B(A.ring), B(A.ring) + TL.SPB * .5 / .6), '扭转', -1, 'lbl_twist');   // label (60 %) lands on b12.5

    flash(t, B(A.loupe), LP.X, LP.Y, LP.w, LP.h);
    txt('×' + LZ, LP.X + LP.w + 18, LP.Y + 40, { s: 34, f: F.mono, w: 600, c: C.acc });

  // the accelerating clock, drawn: one cell per tick (eighths b15–17, sixteenths b17–18)
  if (t >= B(A.accel)) { const e = TL.SPB / 2, sx = TL.SPB / 4, d = t - B(A.accel), lit = d < 2 * TL.SPB ? Math.floor(d / e) + 1 : 4 + Math.floor((d - 2 * TL.SPB) / sx) + 1;
    for (let i = 0; i < 8; i++) fill(PM.X + i * 121, PM.Y + PM.h + 24, 107, 8, i < lit ? C.acc : C.faint); }
}

// ── S5 break + telegrams on the clock + return to the opening frame ──
const CH = { X0: 1176, X1: 1860, y0: 900, yTop: 640 };
const chX = m => lerp(CH.X0, CH.X1, (m - 420) / 270), chY = v => lerp(CH.y0, CH.yTop, v / 50);
const S5C = [{ m: 670, y: 240, time: '11:10', zh: '主跨坠落', at: A.c1110, n: 10, id: 'card_1110' }, { m: 662, y: 350, time: '11:02', zh: '桥面断落', at: A.brk, n: 10, id: 'card_1102', red: 1 }, { m: 603, y: 460, time: '10:03', zh: '开始扭转', at: null, id: 'card_1003b' }];
function sBreak(t) {
  const back = t >= B(A.back);
  let map, z;
  if (!back) { const k = (t - B(A.brk)) * FPS; z = 1.06; const fy = lerp(250, 470, eio(seg(t, B(A.brk), B(A.brk) + 3.2)));
    map = pushed(IMG(fk('fall', 13 + k)), P1.X, P1.Y, P1.w, P1.h, z, 456, fy); }
  else { z = lerp(1.06, 1.0, eio(seg(t, B(A.back), B(A.end)))); map = pushed(IMG(fk('fall', 19)), P1.X, P1.Y, P1.w, P1.h, z, RING_FALL[0] + 60, RING_FALL[1]); flash(t, B(A.back), P1.X, P1.Y, P1.w, P1.h); }
  flash(t, B(A.brk), P1.X, P1.Y, P1.w, P1.h, .1);
  tag('影片 · Elliott ≈', P1.X, P1.Y - 14, { id: 'tag_ftg_brk' });
  // heading = the one finding
  if (t >= B(A.head)) { txt('扭转 59 分钟后断裂', CH.X0, 190, { s: 58, id: 'head' }); flash(t, B(A.head), CH.X0, 120, 684, 90); }
  // chart: wind (two readings, then "steady"), time axis, pins, playhead
  hair(CH.X0, CH.y0, CH.X1, CH.y0, C.dim, 1.5);
  for (let h = 8; h <= 11; h++) { const X = chX(h * 60); hair(X, CH.y0, X, CH.y0 + 8, C.dim, 1.5); txt(`${String(h).padStart(2, '0')}:00`, X, CH.y0 + 28, { s: 14, f: F.mono, w: 400, c: C.faint, al: 'center' }); }
  for (const v of [0, 25, 50]) { hair(CH.X0 - 6, chY(v), CH.X0, chY(v), C.faint, 1); }
  txt('风速 · 英里/时', CH.X0, CH.yTop - 14, { s: 22, c: C.dim, id: 'chart_unit' });
  hair(chX(450), chY(38), chX(570), chY(42), C.text, 2); hair(chX(570), chY(42), chX(670), chY(42), C.dim, 2, [8, 7]);
  for (const [mm, v, hollow] of [[450, 38, 0], [570, 42, 1]]) { x.save(); x.beginPath(); x.arc(chX(mm), chY(v), 6, 0, 7); if (hollow) { x.strokeStyle = C.text; x.lineWidth = 2; x.stroke(); } else { x.fillStyle = C.text; x.fill(); } x.restore(); }
  txt('42', chX(570), chY(42) - 16, { s: 24, f: F.mono, w: 600, al: 'center' }); txt('38', chX(450), chY(38) - 16, { s: 24, f: F.mono, w: 600, al: 'center' });
  // cards + L-shaped leaders to their pins
  for (const g of S5C) { const vis = g.at === null || t >= B(g.at); if (!vis) continue; const px = chX(g.m), cy = g.y + 44;
    hair(1616, cy, px, cy, C.acc, 1.5, [6, 5]); hair(px, cy, px, CH.y0, C.acc, 1.5, [6, 5]);
    x.save(); x.fillStyle = g.red ? C.acc : C.text; x.beginPath(); x.arc(px, CH.y0, g.red ? 7 : 5, 0, 7); x.fill(); x.restore();
    card(1176, g.y, 440, 88, g.time, g.zh, g.at === null ? 1 : typeK(t, B(g.at), g.n), { red: g.red, s: 32, id: g.id });
    if (g.at !== null) flash(t, B(g.at), 1176, g.y, 440, 88); }
  // playhead with its clock
  // timed run = real seconds (STYLE §5): 11:02:00 runs with the film; at b24 the clock jumps one step to 11:10:00 (the gap is skipped, not compressed); held from b26
  const jumped = t >= B(A.c1110), run0 = jumped ? B(A.c1110) : B(A.brk), runT = Math.min(t, B(A.back)) - run0;
  const secs = (jumped ? 670 : 662) * 60 + Math.floor(runT + 1e-6), m = secs / 60, px = chX(m);
  const p2 = n => String(n).padStart(2, '0'), clk = `${p2(Math.floor(secs / 3600))}:${p2(Math.floor(secs / 60) % 60)}:${p2(secs % 60)}`, tp = secs - 603 * 60;
  hair(px, CH.yTop - 4, px, CH.y0, C.acc, 2.5);
  txt(clk, px - 10, CH.yTop - 52, { s: 30, f: F.mono, w: 600, c: C.acc, al: 'right' });
  txt(`T+${p2(Math.floor(tp / 60))}:${p2(tp % 60)}`, CH.X1, 968, { s: 40, f: F.mono, w: 600, c: C.acc, al: 'right' });
  if (jumped) txt('跳过 8 分钟', px - 10, CH.yTop - 16, { s: 20, c: C.dim, al: 'right', id: 'skip8' });
  // ending: the opening frame, now annotated — circle + link to the 11:02 card + corroboration badge
  if (back) { const [cx, cy] = map(RING_FALL[0], RING_FALL[1]), rr = RING_FALL[2] * P1.w / 912 * z, k = seg(t, B(A.back), B(A.back) + .5);
    ring(cx, cy, rr, k); const lk = eo(seg(t, B(A.back) + .35, B(A.back) + .95)), sx = cx + rr * .72, sy = cy - rr * .72 * 0 + 0;
    if (lk > 0) hair(cx + rr, cy, lerp(cx + rr, 1176, lk), lerp(cy, 394, lk), C.acc, 2, [10, 7]);
    badge(1580, 394, t, B(A.badge)); }
}

// ── master ──
function frames(t) { // footage frames this t needs
  const k = []; const s = k.push.bind(k);
  if (inSec(t, 'open')) { if (t < B(A.rewind)) s(fk('fall', 19)); else if (t < B(A.rewind2)) s(fk('fall', lerp(90, 13, seg(t, B(A.rewind), B(A.rewind2))))); else s(fk('side', lerp(135, 1, seg(t, B(A.rewind2), B(A.grid))))); }
  else if (inSec(t, 'grid')) { if (t >= B(A.film)) s(fk('side', 1 + (t - B(A.film)) * FPS)); }
  else if (inSec(t, 'mag')) { s(fk('deck', 79)); if (t >= B(A.unfreeze)) s(fk('deck', 79 + (t - B(A.unfreeze)) * FPS)); }
  else if (inSec(t, 'sync')) s(fk('fall', 13));
  else { if (t < B(A.back)) s(fk('fall', 13 + (t - B(A.brk)) * FPS)); else s(fk('fall', 19)); }
  return k;
}
function draw(t) {
  FR = Math.round(t * FPS); x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; x.filter = 'none';
  fill(0, 0, W, H, C.bg);
  if (inSec(t, 'open')) sOpen(t); else if (inSec(t, 'grid')) grid(t, false); else if (inSec(t, 'mag')) sMag(t); else if (inSec(t, 'sync')) grid(t, true); else sBreak(t);
}
window.render = async t => { t = clamp(t, 0, TL.DUR - 1e-6); await Promise.all(frames(t).map(loadKey)); while (CACHE.size > 90) CACHE.delete(CACHE.keys().next().value); draw(t); };
window.TEXTS = t => { REC = []; t = clamp(t, 0, TL.DUR - 1e-6); draw(t); const r = REC; REC = null; return r; };
window.DUR = TL.DUR;
window.EV = TL.EV.map(e => Object.assign({ t: B(e.b) }, e));
(async () => {
  STILL.noaa = await loadImg('assets/noaa.jpg');
  for (let g = 0; g < 6; g++) { const c = document.createElement('canvas'); c.width = c.height = 256; const gx = c.getContext('2d'), d = gx.createImageData(256, 256), r = rnd(g * 131 + 17);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 120; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } gx.putImageData(d, 0, 0); GRAIN.push(c); }
  await Promise.all(['700 40px SansSC', '400 20px Mono', '600 20px Mono'].map(f => document.fonts.load(f)));
  await Promise.all([fk('fall', 19), fk('fall', 13), fk('deck', 79)].map(loadKey));
  window.READY = true;
})();
