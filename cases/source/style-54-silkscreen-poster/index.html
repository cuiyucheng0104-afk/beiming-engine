<!doctype html>
<html><head><meta charset="utf-8"><title>岛屿之光</title>
<style>
@font-face { font-family: 'QK'; src: url(fonts/qk.ttf) format('truetype'); font-display: block; }
@font-face { font-family: 'NotoSC'; src: url(fonts/noto.ttf) format('truetype'); font-weight: 700; font-display: block; }
@font-face { font-family: 'BSD'; src: url(fonts/bigsh.ttf) format('truetype'); font-weight: 800; font-display: block; }
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { setup, render, texts } from './film.js';
await Promise.all(['400 40px QK', '700 40px NotoSC', '800 40px BSD'].map(f => document.fonts.load(f, '岛屿之光白鸥渡轮每日三班灯高米日落ISLANDGHT0123456789:')));
const TL = setup(document.getElementById('c'));
window.DUR = TL.dur; window.EV = TL.ev;
window.render = t => render(t);
window.TEXTS = t => texts(t);
window.READY = true;
</script></body></html>
