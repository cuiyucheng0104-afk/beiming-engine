<script type="module">
// 《那一脚》 Sports telestrator. render(t) is deterministic: the "broadcast footage" (pitch, stands, players, ball) is rendered from play.js at source
// time s, and every ring, line and patch is projected through the same camera, so the drawing sits on the picture by construction.
import { clamp, lerp, seg, ss, eo, eio, back, hash } from '/core/lib.js';
import { FPS, SRC_FPS, BEAT, b, DUR, SRC, SEG, WIPES, WIPE_D, HITS, segAt } from './timeline.js';
import { PLAYERS, ball, ballSpin, skeleton, feet, byId, camera } from './play.js';

const W = 1920, H = 1080;
const C = document.getElementById('c'), X = C.getContext('2d');
const Fc = document.createElement('canvas'); Fc.width = W; Fc.height = H; const FX = Fc.getContext('2d');      // footage frame
const Sc = document.createElement('canvas'); Sc.width = W; Sc.height = H; const SX = Sc.getContext('2d');      // shadow pass
const Mc = document.createElement('canvas'); Mc.width = W; Mc.height = H; const MX = Mc.getContext('2d');      // hero depth-of-field mask pass

const Q = new URLSearchParams(location.search);
const COL = { ink: '#FFD400', def: '#3FD8FF', space: '#FF3B30', chalk: '#F4F1E8', board: '#0C1411', card: 'rgba(8,12,14,0.9)' };
const F_ZH = 'SansSC', F_C = 'Cond', F_M = 'Mono';

// ===================== ground, boards, stands (WebGL) =====================
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
uniform vec3 uC, uR, uU, uF; uniform float uf, uS, uEx; uniform vec2 uRes;
out vec4 o;
float h21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p){ float a = .5, s = 0.; for (int i = 0; i < 4; i++) { s += a * vn(p); p = p * 2.03 + 17.1; a *= .5; } return s; }
float sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0., 1.); return length(pa - ba * h); }
float lineDist(vec2 p){
  float d = 1e3;
  d = min(d, sdSeg(p, vec2(0, 0), vec2(105, 0)));  d = min(d, sdSeg(p, vec2(0, 68), vec2(105, 68)));
  d = min(d, sdSeg(p, vec2(0, 0), vec2(0, 68)));   d = min(d, sdSeg(p, vec2(105, 0), vec2(105, 68)));
  d = min(d, sdSeg(p, vec2(52.5, 0), vec2(52.5, 68)));
  d = min(d, abs(length(p - vec2(52.5, 34)) - 9.15));
  vec2 q = vec2(p.x < 52.5 ? p.x : 105. - p.x, p.y);
  d = min(d, sdSeg(q, vec2(0, 13.84), vec2(16.5, 13.84))); d = min(d, sdSeg(q, vec2(0, 54.16), vec2(16.5, 54.16)));
  d = min(d, sdSeg(q, vec2(16.5, 13.84), vec2(16.5, 54.16)));
  d = min(d, sdSeg(q, vec2(0, 24.84), vec2(5.5, 24.84))); d = min(d, sdSeg(q, vec2(0, 43.16), vec2(5.5, 43.16)));
  d = min(d, sdSeg(q, vec2(5.5, 24.84), vec2(5.5, 43.16)));

}
float cover(float d, float fw, float hw){ fw = max(fw, 1e-4); return max(0., min(d + fw * .5, hw) - max(d - fw * .5, -hw)) / fw; }
vec3 grassCol(vec2 p, vec3 gp, float fwx, float fwl){
  bool onPitch = p.x > -1.6 && p.x < 106.6 && p.y > -1.6 && p.y < 69.6;
  float st = sin(3.14159 * p.x / 5.25) / max(1e-3, 3.14159 * fwx / 5.25 * 1.4);

  float n = fbm(p * .35) * .16 + fbm(p * 2.1) * .10 * clamp(1. - fwl * 6., 0., 1.) + fbm(p * 9.) * .06 * clamp(1. - fwl * 25., 0., 1.);

  float wear = smoothstep(7., 0., length((p - vec2(101.5, 34.)) * vec2(1., .55))) * .35 + smoothstep(1.4, 0., length(p - vec2(94, 34))) * .4;

}
vec3 boardTex(float u, float v){
  float k = floor(u / 6.2), f = fract(u / 6.2), ty = mod(k, 3.);
  vec3 c = vec3(.03, .05, .09);
  float sc = uS * .9 + uEx * 2.;
  if (ty < .5) { c = vec3(.06, .16, .42); float bar = step(.55, fract(f * 5. - sc)); c = mix(c, vec3(.92), bar * step(.3, v) * step(v, .7) * .85); }
  else if (ty < 1.5) { c = mix(vec3(.85, .32, .08), vec3(.98, .55, .14), f); float ch = step(.5, fract((f * 4. + abs(v - .5) * 1.6) - sc)); c *= .55 + .45 * ch; }

vec3 crowdTex(vec2 c, float cellPx, float seed){
  vec2 cell = vec2(.52, .85);
  vec2 g = c / cell, id = floor(g), f = fract(g);

  vec2 q = f - vec2(.5, .08 + bob);
  vec3 pal[7]; pal[0] = vec3(.13, .17, .36); pal[1] = vec3(.86, .86, .84); pal[2] = vec3(.42, .43, .46); pal[3] = vec3(.07, .07, .08);
  pal[4] = vec3(.46, .12, .12); pal[5] = vec3(.24, .31, .46); pal[6] = vec3(.15, .2, .42);

  vec3 seat = vec3(.11, .13, .19);
  float torso = step(abs(q.x), .3) * step(0., q.y) * step(q.y, .5);

}
void main(){

  float tg = d.z < -1e-4 ? -uC.z / d.z : 1e5;
  vec3 gpt = uC + d * min(tg, 2000.);
  float dl = lineDist(gpt.xy);

  float fwx = fwidth(gpt.x), fwl = length(fwidth(gpt.xy));
  float best = 1e9; int kind = 0; vec3 hp = vec3(0); float side = 0.;
  if (d.z < -1e-4) { best = tg; kind = 1; }
  // LED boards (vertical, 0.95 m)
  float t;
  t = (71.5 - uC.y) / d.y; if (t > 0. && t < best) { vec3 q = uC + d * t; if (q.z >= 0. && q.z < .95 && q.x > -7. && q.x < 112.) { best = t; kind = 2; hp = q; side = q.x; } }
  t = (-3.6 - uC.y) / d.y; if (t > 0. && t < best) { vec3 q = uC + d * t; if (q.z >= 0. && q.z < .95 && q.x > -7. && q.x < 112.) { best = t; kind = 2; hp = q; side = q.x + 300.; } }
  t = (111.6 - uC.x) / d.x; if (t > 0. && t < best) { vec3 q = uC + d * t; if (q.z >= 0. && q.z < .95 && q.y > -3.6 && q.y < 71.5) { best = t; kind = 2; hp = q; side = q.y + 600.; } }
  t = (-6.6 - uC.x) / d.x; if (t > 0. && t < best) { vec3 q = uC + d * t; if (q.z >= 0. && q.z < .95 && q.y > -3.6 && q.y < 71.5) { best = t; kind = 2; hp = q; side = q.y + 900.; } }
  // stands (sloped), with seat coordinates
  vec2 sc = vec2(0); float cosf = 1.;
  t = (-42.9 + .6 * uC.y - uC.z) / (d.z - .6 * d.y); if (t > 0. && t < best) { vec3 q = uC + d * t; if (q.y >= 74. && q.z < 24. && q.x > -32. && q.x < 137.) { best = t; kind = 3; hp = q; sc = vec2(q.x, (q.y - 74.) * 1.166); side = 1.; cosf = abs(dot(d, normalize(vec3(0, -.6, 1)))); } }
  t = (-2.7 - .6 * uC.y - uC.z) / (d.z + .6 * d.y); if (t > 0. && t < best) { vec3 q = uC + d * t; if (q.y <= -7. && q.z < 24. && q.x > -32. && q.x < 137.) { best = t; kind = 3; hp = q; sc = vec2(q.x, (-7. - q.y) * 1.166); side = 2.; cosf = abs(dot(d, normalize(vec3(0, .6, 1)))); } }
  t = (-66.9 + .6 * uC.x - uC.z) / (d.z - .6 * d.x); if (t > 0. && t < best) { vec3 q = uC + d * t; if (q.x >= 114. && q.z < 24. && q.y > -32. && q.y < 100.) { best = t; kind = 3; hp = q; sc = vec2(q.y, (q.x - 114.) * 1.166); side = 3.; cosf = abs(dot(d, normalize(vec3(-.6, 0, 1)))); } }
  t = (-3.9 - .6 * uC.x - uC.z) / (d.z + .6 * d.x); if (t > 0. && t < best) { vec3 q = uC + d * t; if (q.x <= -9. && q.z < 24. && q.y > -32. && q.y < 100.) { best = t; kind = 3; hp = q; sc = vec2(q.y, (-9. - q.x) * 1.166); side = 4.; cosf = abs(dot(d, normalize(vec3(.6, 0, 1)))); } }

  vec3 col;
  if (kind == 1) {
    vec3 q = gpt; vec2 p = q.xy;
    bool inside = p.x > -6.6 && p.x < 111.6 && p.y > -3.6 && p.y < 71.5;
    col = inside ? grassCol(p, gp, fwx, fwl) : vec3(.16, .16, .15) * (.85 + .3 * fbm(p * .8));
    float sh = smoothstep(8.6, 9.6, p.y + 1.4 * sin(p.x * .07) + .6 * sin(p.x * .31));
    col *= mix(vec3(.6, .66, .74), vec3(1.05, 1.03, .98), sh);
  } else if (kind == 2) {
    float u = side < 600. ? hp.x + side * .0 : hp.y; col = boardTex(u + floor(side / 300.) * 37., hp.z / .95);
  } else if (kind == 3) {
    float cellPx = .52 * uf / best * max(cosf, .05);
    col = crowdTex(sc, cellPx, side * 13.) * mix(.5, .82, smoothstep(0., 18., sc.y));
    col = mix(col, vec3(.07, .08, .1), step(23.3, hp.z));
  } else if (kind == 4) {
    col = vec3(.05, .055, .07);
    float lamp = smoothstep(.45, .1, length(vec2(fract(hp.x / 9.) - .5, (abs(hp.y) > 60. ? 0. : 1.) * 9.))) ;
    col += vec3(1., .95, .85) * lamp * .0;
  } else {
    float k = clamp(-d.z * 4. + .5, 0., 1.);
    col = mix(vec3(.55, .62, .72), vec3(.32, .40, .55), clamp(d.z * 2., 0., 1.));
  }
  float haze = clamp((best - 70.) / 220., 0., .3) * (kind == 3 ? 1. : 0.);
  col = mix(col, vec3(.55, .6, .66), haze);
  o = vec4(pow(clamp(col, 0., 1.), vec3(1. / 1.0)), 1.);
}`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
const UL = { C: U('uC'), R: U('uR'), U: U('uU'), F: U('uF'), f: U('uf'), S: U('uS'), Ex: U('uEx'), Res: U('uRes') };
function drawGround(cam, s) {
  gl.viewport(0, 0, W, H);
  gl.uniform3fv(UL.C, cam.pos); gl.uniform3fv(UL.R, cam.R); gl.uniform3fv(UL.U, cam.U); gl.uniform3fv(UL.F, cam.F);
  gl.uniform1f(UL.f, cam.f); gl.uniform1f(UL.S, s); gl.uniform1f(UL.Ex, ss((s - SRC.goal - .05) / .5)); gl.uniform2f(UL.Res, W, H);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ===================== players, ball, goal (Canvas 2D) =====================
const LIGHT = [.35, .5, -.8];
const shadowPt = p => [p[0] - p[2] * LIGHT[0] / LIGHT[2], p[1] - p[2] * LIGHT[1] / LIGHT[2], .005];
function capsule(c, a, b2, ra, rb) {
  const dx = b2[0] - a[0], dy = b2[1] - a[1], L = Math.hypot(dx, dy) || 1e-6, ang = Math.atan2(dy, dx);
  c.beginPath();
  if (L < Math.abs(ra - rb)) { c.arc(a[0], a[1], Math.max(ra, rb), 0, 7); return; }
  const off = Math.acos(clamp((ra - rb) / L, -1, 1));
  c.arc(a[0], a[1], ra, ang + off, ang + 2 * Math.PI - off);
  c.arc(b2[0], b2[1], rb, ang - off, ang + off);
  c.closePath();

function limb(c, P2, a, b2, ra, rb, col, shade, kpx) {
  const A = P2(a), B = P2(b2), r1 = ra * A[3], r2 = rb * B[3];
  capsule(c, A, B, r1, r2); c.fillStyle = col; c.fill();
  if (shade && kpx > 26) {
    const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L, sgn = nx * .9 + ny * .3 > 0 ? 1 : -1;

    capsule(c, [A[0] + nx * sgn * r1 * 1.25, A[1] + ny * sgn * r1 * 1.25], [B[0] + nx * sgn * r2 * 1.25, B[1] + ny * sgn * r2 * 1.25], r1, r2); c.fill();
    c.globalAlpha = .22; c.fillStyle = '#fff';
    capsule(c, [A[0] - nx * sgn * r1 * 1.45, A[1] - ny * sgn * r1 * 1.45], [B[0] - nx * sgn * r2 * 1.45, B[1] - ny * sgn * r2 * 1.45], r1, r2); c.fill();

const mix2 = (a, b2, k) => [lerp(a[0], b2[0], k), lerp(a[1], b2[1], k), lerp(a[2], b2[2], k)];
function drawPlayer(c, cam, P, J, shadow) {
  const proj = shadow ? p => { const q = cam.P(shadowPt(p)); return [q[0], q[1], q[2], cam.f / q[2]]; } : p => { const q = cam.P(p); return [q[0], q[1], q[2], cam.f / q[2]]; };

  const col = x => shadow ? '#000' : x;

    const lk = seg(t + 1 / FPS - 1e-6, HITS.label2, HITS.label2 + .3);
    const r = tag(X, 1500, 600, '视线被挡', 'KEEPER SCREENED', COL.def, on('label2', lk));
    if (r && lk >= 1) TX.push({ id: 'label2', text: '视线被挡 KEEPER SCREENED', ...r });
  }
  return a.s;
}
function drawAny(S, t) { if (S === 'board') { board(X); return 0; } return drawSeg(S, t); }

// ===================== render =====================
let lastState = {};
window.render = async t => {
  TX = []; VIS = new Set();
  X.setTransform(1, 0, 0, 1, 0, 0); X.filter = 'none'; X.globalAlpha = 1;
  X.fillStyle = '#000'; X.fillRect(0, 0, W, H);
  const S = segAt(t);
  let tc = null; for (const w of WIPES) if (Math.abs(t - w) < WIPE_D / 2) tc = w;
  let s;
  if (tc !== null) {
    const xc = wipeX(t, tc), sl = .36;
    const oldS = tc === 0 ? 'board' : segAt(tc - 1e-4), newS = segAt(tc + 1e-4);
    X.save(); X.beginPath(); X.moveTo(xc - sl * 540, 0); X.lineTo(W + 10, 0); X.lineTo(W + 10, H); X.lineTo(xc + sl * 540, H); X.closePath(); X.clip(); drawAny(oldS, Math.min(t, oldS === 'board' ? 0 : oldS.t1 - 1e-4)); X.restore();
    X.save(); X.beginPath(); X.moveTo(-10, 0); X.lineTo(xc - sl * 540, 0); X.lineTo(xc + sl * 540, H); X.lineTo(-10, H); X.closePath(); X.clip(); s = drawAny(newS, Math.max(t, newS.t0)); X.restore();
    wipeBand(xc);
  } else s = drawSeg(S, t);
  const T = HITS;
  // freeze flashes
  for (const ft of [T.freeze1, T.strike, T.freezeSplit, T.final]) { const k = seg(t + 1 / FPS - 1e-6, ft, ft + .13); if (k > 0 && k < 1) { X.fillStyle = `rgba(255,255,255,${.55 * (1 - k)})`; X.fillRect(0, 0, W, H); } }
  { const k = seg(t + 1 / FPS - 1e-6, T.goal, T.goal + .2); if (k > 0 && k < 1) { X.fillStyle = `rgba(255,236,150,${.5 * (1 - k)})`; X.fillRect(0, 0, W, H); } }
  // packaging, present from frame 1
  const mode = S.kind === 'rew' ? 'ana' : S.mode;
  bugTop(mode); bugScore(t);
  TX.push({ id: 'bug', text: '复盘 MATCH REVIEW', x0: 1452, y0: 38, x1: 1880, y1: 110 });
  TX.push({ id: 'score' + (t >= T.goal ? 2 : 1), text: t >= T.goal ? '港湾 1–2 城南 89′' : '港湾 1–1 城南 89′', x0: 1392, y0: 926, x1: 1880, y1: 996 });
  if (S.id !== 'live' && !(tc === 0)) {
    const cm = S.kind === 'freeze' || S.kind === 'splitfreeze' ? 'freeze' : S.kind === 'rew' ? 'rew' : S.id === 'slow' || S.id === 'flight' || S.id === 'hero' || S.kind === 'split' ? 'slow' : 'play';
    clockTag(s, cm);
  }
  // stopwatch: shows a beat before the reception, runs on source frames, stops (yellow) on the strike
  if (S.id === 'slow' || S.id === 'f2') {
    const k = seg(t, b(21), b(21) + .3) * (S.id === 'f2' ? 1 - seg(t, b(26) - .25, b(26) - .05) : 1);
    const r = stopwatch(t, s, k);
    if (r && k >= 1) TX.push({ id: 'sw', text: '接球 → 出脚 RECEIVE → STRIKE', ...r });
  }
  const tr = titleCard(t);
  if (tr) TX.push({ id: 'title', text: '那一脚 0.68 秒 · 17 帧 RECEIVE TO STRIKE · NO. 9 · 89′', ...tr });
  lastState = { seg: S.id, s, away: t >= T.goal ? 2 : 1, wipe: tc, vis: [...VIS], wipeX: tc !== null ? wipeX(t, tc) : null };
};
window.TEXTS = t => { return TX.slice(); };
window.PROBE = async t => { await window.render(t); return { ...lastState, texts: TX.map(x => x.id) }; };
window.DUR = DUR;

// ===================== events for the mixer =====================
const EV = [];
const T = HITS;
const ev = (t, type, o = {}) => EV.push({ t: +t.toFixed(4), type, ...o });
EV.push({ t: 0, type: 'timeline', seg: SEG, beat: BEAT, hits: HITS, dur: DUR });
for (const w of WIPES) ev(Math.max(0, w - WIPE_D / 2), 'whoosh', { d: WIPE_D, v: w === b(34) ? .05 : 1 });
// ball contacts in every played segment, at the speed they are seen
for (const S of SEG) {
  if (S.kind !== 'play') continue;
  for (const [ks, pw] of [[SRC.pass1, .7], [SRC.recv10, .35], [SRC.thru, .8], [SRC.recv9, .4], [SRC.strike, 1.2], [SRC.goal + .085, .9]]) {
    const tt = S.t0 + (ks - S.s0) / S.v; if (tt >= S.t0 - 1e-6 && tt < S.t1) ev(tt, ks === SRC.goal + .085 ? 'net' : 'kick', { v: pw, rate: S.v });
  }
  const tl = S.t0 + (SRC.gkLand - S.s0) / S.v; if (tl >= S.t0 && tl < S.t1) ev(tl, 'thud', { v: .6, rate: S.v });
}
{ const SP = SEG.find(x => x.id === 'split'); for (const [v, pan] of [[SP.vA, -.5], [SP.vB, .5]]) { const tt = SP.t1 - (SP.s1 - SRC.recv9) / v; if (tt >= SP.t0) ev(tt, 'kick', { v: .3, rate: v, pan }); } }
ev(T.rewind, 'rewind', { d: T.freeze1 - T.rewind });
for (const ft of [T.freeze1, T.strike, T.freezeSplit, T.final]) ev(ft, 'freeze');
for (const [k, n] of [['ring10', 1], ['ringsDef', 2], ['ring9', 1], ['ringsSplit', 3], ['final', 1]]) for (let i = 0; i < n; i++) ev(T[k] + i * BEAT / 4, 'pop', { v: .8 });
ev(T.thruLine, 'squeak', { d: T.arrow1 - T.thruLine }); ev(T.runLine, 'squeak', { d: T.arrow2 - T.runLine }); ev(T.sight, 'squeak', { d: .4 });
ev(T.arrow1, 'tick', { v: .5 }); ev(T.arrow2, 'tick', { v: .5 });
ev(T.space, 'swell', { d: .3 });
ev(T.label1, 'tick', { v: 1 }); ev(T.label2, 'tick', { v: 1 }); ev(T.title, 'tick', { v: 1 }); ev(T.sub, 'tick', { v: .7 });
for (let i = 0; i < 4; i++) ev(T.recv9 + i * BEAT / 2, 'swtick', { v: .8 });
ev(T.strike, 'swstop');
ev(b(26), 'slam', { v: .8 });
ev(T.goal, 'flip'); ev(T.goal, 'roar', { d: DUR - T.goal });
ev(b(34), 'heart'); ev(b(35), 'heart');
ev(T.hero, 'cut');
window.EV = EV;

await document.fonts.load(`900 40px ${F_ZH}`); await document.fonts.load(`700 40px ${F_ZH}`); await document.fonts.load(`500 40px ${F_ZH}`);
await document.fonts.load(`800 italic 40px ${F_C}`); await document.fonts.load(`600 40px ${F_C}`); await document.fonts.load(`500 24px ${F_M}`);
await document.fonts.ready;
if (Q.has('t')) await window.render(+Q.get('t'));
window.READY = true;
</script>
