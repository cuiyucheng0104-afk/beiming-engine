<script>
'use strict';
F.boot().catch(e => { window.__bootError = String(e && e.stack || e); console.error(e); });
const params = new URLSearchParams(location.search);
const FIXED = params.has('t') ? parseFloat(params.get('t')) : null, CAPTURE = params.has('capture');
const startEl = document.getElementById('start');
let ac = null, play = null;
async function startPlay() {
  if (!ac) ac = new AudioContext();
  await ac.resume();
  let buffer = null;
  if (window.__film.wav) { const b64 = await window.__film.wav(); const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0)); buffer = await ac.decodeAudioData(bytes.buffer); }
  const t0 = ac.currentTime + .1; play = { t0 };
  if (buffer) { const src = ac.createBufferSource(); src.buffer = buffer; src.connect(ac.destination); src.start(t0); }
  startEl.style.display = 'none';
}
startEl.addEventListener('click', startPlay);
function frame() {
  if (window.__film.ready) {
    const t = FIXED !== null ? FIXED : play ? ac.currentTime - play.t0 : (performance.now() / 1000) % F.DURATION;
    window.__film.seek(Math.max(0, t));
  }
  requestAnimationFrame(frame);
}
if (FIXED !== null || CAPTURE) startEl.remove();
if (!CAPTURE) requestAnimationFrame(frame);
</script>
