<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>逃跑的周报</title>
<style>
@font-face{font-family:"Noto Sans SC";src:url(fonts/NotoSansSC-500.woff2) format('woff2');font-weight:500}
@font-face{font-family:"Noto Sans SC";src:url(fonts/NotoSansSC-700.woff2) format('woff2');font-weight:700}
@font-face{font-family:Inter;src:url(fonts/Inter-500.woff2) format('woff2');font-weight:500}
@font-face{font-family:Inter;src:url(fonts/Inter-700.woff2) format('woff2');font-weight:700}
.th{
  --w0:#DCE6F2; --w1:#F6D7C3; --w2:#C9D9F5; --w3:#E4F0E2;
  --menubar:rgba(250,251,253,.8); --mink:#1D2230;
  --win:#FBFBFD; --tbar:#F2F3F7; --line:#E3E5EC; --ink:#1B1F2A; --ink2:#4A5160; --mute:#8A91A0; --faint:#B9BECA;
  --card:#FFFFFF; --cardL:#E4E7EE; --done:#9AA1AF; --acc:#3B6FF5; --accT:#E6EDFE; --hot:#E5484D; --hotT:#FDECEC;
  --shadow:rgba(30,40,70,.16); --dock:rgba(244,247,252,.82); --dockL:rgba(255,255,255,.7);
  --bin1:#C9CED8; --bin2:#EEF1F6; --binS:#8C93A3; --tog0:#D7DBE3; --field:#FFFFFF;
}
.th.dark{
  --w0:#0E1324; --w1:#2A1E3A; --w2:#13264A; --w3:#0F2A2A;
  --menubar:rgba(22,25,36,.85); --mink:#E7EAF2;
  --win:#1C1F2A; --tbar:#232735; --line:#313647; --ink:#ECEEF4; --ink2:#C3C8D4; --mute:#8189A0; --faint:#4E5568;
  --card:#262A38; --cardL:#363B4D; --done:#6D7486; --acc:#5B8BFF; --accT:#24314F; --hot:#FF6B6E; --hotT:#402328;
  --shadow:rgba(0,0,0,.55); --dock:rgba(36,40,56,.85); --dockL:rgba(255,255,255,.12);
  --bin1:#4A5164; --bin2:#6B7389; --binS:#2C3141; --tog0:#3A3F52; --field:#262A38;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#DCE6F2}
body{font-family:Inter,"Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.world{color:var(--ink)}
.wall{position:absolute;left:0;top:0;width:1920px;height:1080px;background:
  radial-gradient(900px 700px at 1500px 260px,var(--w1) 0,transparent 70%),
  radial-gradient(1100px 760px at 300px 980px,var(--w2) 0,transparent 70%),
  radial-gradient(800px 600px at 1100px 900px,var(--w3) 0,transparent 70%),var(--w0)}
.menubar{position:absolute;left:0;top:0;width:1920px;height:32px;background:var(--menubar);display:flex;align-items:center;gap:24px;padding:0 26px;font-size:14px;font-weight:500;color:var(--mink)}
.menubar b{font-weight:700}.menubar .r{margin-left:auto;font-family:Inter,"Noto Sans SC";font-variant-numeric:tabular-nums}
.win{position:absolute;background:var(--win);border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 34px 90px var(--shadow),0 8px 24px var(--shadow)}
.tbar{height:52px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);background:var(--tbar);position:relative}
.lights{display:flex;gap:8px}.lights i{width:13px;height:13px;border-radius:50%;background:#EC6A5E}
.lights i:nth-child(2){background:#F4BF4F}.lights i:nth-child(3){background:#61C554}
.wtitle{position:absolute;left:50%;transform:translateX(-50%);font-size:18px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:9px;white-space:nowrap;letter-spacing:.02em}
.tbr{margin-left:auto;color:var(--mute);font-weight:700}
.appic{width:40px;height:40px;border-radius:10px;background:linear-gradient(160deg,#5E8DFF,#2F5BE0);position:relative;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.appic::after{content:'';position:absolute;left:31%;top:24%;width:26%;height:42%;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg)}
.appic.sm{width:20px;height:20px;border-radius:6px}.appic.sm::after{border-width:0 2.4px 2.4px 0}
.todo-b{padding:30px 50px 0}
.h1{font-size:40px;font-weight:700;letter-spacing:.02em}
.sub{font-size:16px;color:var(--mute);margin-top:6px;font-weight:500}
.list{margin-top:30px;display:flex;flex-direction:column;gap:16px}
.slot{height:80px;border-radius:14px}
.slot.empty{border:2px dashed var(--cardL);background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(127,140,170,.06) 10px 20px)}
.card{position:relative;height:80px;width:480px;border-radius:14px;background:var(--card);box-shadow:0 0 0 1px var(--cardL),0 2px 6px rgba(20,30,60,.06);display:flex;align-items:center;padding-left:84px;padding-right:22px}
.grp{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;z-index:30}
.grp .card{position:absolute}
.card.lifted{box-shadow:0 0 0 1px var(--cardL),0 22px 44px var(--shadow),0 6px 14px var(--shadow)}
.cb{position:absolute;left:20px;top:19px;width:42px;height:42px;border-radius:9px;border:3px solid var(--faint);display:grid;place-items:center;background:var(--field)}
.cb.on{background:var(--acc);border-color:var(--acc)}
.card.alive .cb{border-color:transparent;background:transparent}
.ct{font-size:23px;font-weight:700;color:var(--ink);letter-spacing:.03em}
.card.done .ct{color:var(--done);text-decoration:line-through;text-decoration-thickness:2px;font-weight:500}
.tag{margin-left:auto;font-size:15px;font-weight:500;color:var(--mute);background:var(--tbar);padding:5px 12px;border-radius:8px;white-space:nowrap}
.tag.hot{color:var(--hot);background:var(--hotT);font-weight:700}
.card.done .tag.hot{color:var(--done);background:var(--tbar);font-weight:500}
.prog{margin-top:34px;display:flex;align-items:center;gap:16px;font-size:15px;color:var(--mute);font-weight:500}
.prog .bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}.prog .bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.newrow{margin-top:26px;height:56px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;color:var(--faint);font-size:17px;font-weight:500}
.newrow .plus{color:var(--acc);font-size:20px;font-weight:700}
.set-b{padding:12px 30px}
.srow{height:80px;display:flex;align-items:center;border-bottom:1px solid var(--line);font-size:19px;font-weight:500}
.srow:last-child{border-bottom:0}
.tog{margin-left:auto;width:76px;height:44px;border-radius:22px;background:color-mix(in srgb,var(--acc) calc(var(--k)*100%),var(--tog0));position:relative}
.tog i{position:absolute;top:4px;left:calc(4px + var(--k)*32px);width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.sw{margin-left:auto;display:flex;gap:12px}.sw i{width:26px;height:26px;border-radius:50%}
.sw i:first-child{box-shadow:0 0 0 3px var(--win),0 0 0 5px var(--acc)}
.segc{margin-left:auto;display:flex;background:var(--tbar);border-radius:9px;padding:3px;font-size:15px;color:var(--mute)}
.segc b,.segc span{padding:6px 16px;border-radius:7px;font-weight:500}.segc b{background:var(--field);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.toast{position:absolute;border-radius:18px;background:color-mix(in srgb,var(--win) 95%,transparent);box-shadow:0 0 0 1px rgba(0,0,0,.08),0 18px 46px var(--shadow);display:flex;align-items:center;gap:16px;padding:0 20px;z-index:20}
.toast .tt{flex:1;min-width:0}
.tn{display:flex;font-size:13px;color:var(--mute);font-weight:500}.tn b{font-weight:700;color:var(--ink2)}.tn span{margin-left:auto}
.tm{font-size:17px;font-weight:700;margin-top:2px}.tb{font-size:15px;color:var(--ink2);font-weight:500;margin-top:1px}
.dock{position:absolute;left:50%;transform:translateX(-50%);top:962px;height:108px;padding:0 14px;border-radius:30px;background:var(--dock);box-shadow:0 0 0 1px var(--dockL),0 10px 30px rgba(20,30,60,.18);display:flex;align-items:flex-end;gap:14px;padding-bottom:12px}
.di{width:84px;height:84px;position:relative}
.ico{position:absolute;inset:0;border-radius:20px}
.ic-todo{background:linear-gradient(160deg,#5E8DFF,#2F5BE0)}
.ic-todo::after{content:'';position:absolute;left:31%;top:22%;width:26%;height:42%;border:solid #fff;border-width:0 8px 8px 0;transform:rotate(45deg)}
.ic-cal{background:#fff;display:flex;flex-direction:column;align-items:center;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.ic-cal b{display:block;width:100%;text-align:center;background:#E5484D;color:#fff;font-size:15px;line-height:24px;font-weight:700}
.ic-cal i{font-style:normal;font-size:40px;font-weight:700;color:#1B1F2A;line-height:54px;font-family:Inter}
.ic-note{background:linear-gradient(#FFE38A 0 24%,#FFF6C9 24%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.ic-note::after{content:'';position:absolute;left:16%;right:16%;top:44%;height:30%;background:repeating-linear-gradient(#E3D49A 0 3px,transparent 3px 13px)}
.ic-set{background:radial-gradient(circle at 50% 50%,#fff 0 13%,#7E8796 14% 30%,#C7CCD5 31% 46%,#7E8796 47%);}
.dsep{width:2px;height:70px;background:var(--dockL);margin-bottom:7px;border-radius:1px}
.trashw svg{position:absolute;left:0;top:0;transform-origin:50% 100%;overflow:visible}
.px{position:absolute;image-rendering:pixelated}
.dp{position:absolute;background:#C9C3B6}
.th.dark .dp{background:#8B90A3}
.bp,.sl{position:absolute}.sl{background:#FF6A1F;transform-origin:0 50%}
.cur{position:absolute;z-index:40}
.ring{position:absolute;border:3px solid rgba(59,111,245,.9);border-radius:50%;z-index:39}
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
.spot,.flash,.dim{position:absolute;inset:0}
.flash{background:#fff}.dim{background:#0A0D18}
.pill{position:absolute;left:50%;top:84px;font-family:"Noto Sans SC";font-weight:700;font-size:44px;letter-spacing:.12em;color:#F3F5FA;background:rgba(40,46,64,.55);backdrop-filter:blur(18px);padding:14px 40px 14px 34px;border-radius:40px;box-shadow:0 0 0 1px rgba(255,255,255,.16),0 12px 36px rgba(0,0,0,.35);display:flex;align-items:center;gap:20px;white-space:nowrap}
.pill i{width:18px;height:18px;border-radius:50%;background:#FF4D4F;box-shadow:0 0 0 5px rgba(255,77,79,.25)}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="mb" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur id="mbg" stdDeviation="0 0"/></filter></svg>
<div id="stage">
  <div id="mbw" style="position:absolute;inset:0">
    <div id="wL" class="layer world th"></div>
    <div id="wD" class="layer world th dark"></div>
    <div id="spr" class="layer" style="z-index:5"></div>
  </div>
  <div id="hud"></div>
</div>
<script type="module" src="main.js"></script>
</body></html>
