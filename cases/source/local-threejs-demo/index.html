<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Face Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a0f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #c8c8d0; display: flex; }

    /* Left Panel */
    #panel {
      width: 320px; min-width: 320px; height: 100vh;
      background: #12121a;
      border-right: 1px solid #2a2a3a;
      display: flex; flex-direction: column;
      user-select: none;
    }
    #panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid #2a2a3a;
      display: flex; align-items: center; justify-content: space-between;
    }
    #panel-header h1 { font-size: 16px; font-weight: 600; color: #e8e8f0; }
    #reset-all {
      padding: 4px 12px; border-radius: 4px;
      background: #e94560; color: #fff; border: none;
      font-size: 11px; cursor: pointer; font-weight: 500;
    }
    #reset-all:hover { background: #ff5a75; }

    /* Upload */
    #upload-area {
      padding: 10px 20px; border-bottom: 1px solid #2a2a3a;
    }
    #upload-btn {
      width: 100%; padding: 10px; border-radius: 8px;
      background: linear-gradient(135deg, #e94560, #533483);
      color: #fff; border: none; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s;
    }
    #upload-btn:hover { opacity: 0.9; }
    #upload-btn.loading {
      opacity: 0.6; pointer-events: none;
      background: linear-gradient(135deg, #666, #444);
    }
    #upload-preview { margin-top: 8px; display: flex; align-items: center; gap: 10px; }
    #upload-preview.hidden { display: none; }
    #preview-img {
      width: 48px; height: 48px; border-radius: 8px; object-fit: cover;
      border: 2px solid #2a2a3a;
    }
    #upload-status { font-size: 11px; color: #9898a8; flex: 1; line-height: 1.4; }
    #upload-status.success { color: #4ade80; }
    #upload-status.error { color: #f87171; }

    /* Search */
    #search-box {
      padding: 8px 20px; border-bottom: 1px solid #2a2a3a;
    }
    #search-box input {
      width: 100%; padding: 6px 10px; border-radius: 6px;
      background: #1a1a28; border: 1px solid #2a2a3a; color: #c8c8d0;
      font-size: 12px; outline: none;
    }
    #search-box input:focus { border-color: #e94560; }

    /* Scroll area */
    #controls {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      scrollbar-width: thin; scrollbar-color: #2a2a3a transparent;
    }
    #controls::-webkit-scrollbar { width: 6px; }
    #controls::-webkit-scrollbar-track { background: transparent; }
    #controls::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 3px; }

    /* Category */
    .category { border-bottom: 1px solid #1e1e2e; }
    .category-header {
      padding: 10px 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      background: #16161f;
    }
    .category-header:hover { background: #1a1a28; }
    .category-header .cat-title {
      font-size: 12px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: #9090a0;
    }
    .category-header .cat-count {
      font-size: 10px; color: #606070; margin-left: 6px;
    }
    .category-header .arrow {
      font-size: 10px; color: #606070; transition: transform 0.2s;
    }
    .category-header.collapsed .arrow { transform: rotate(-90deg); }
    .category-body { padding: 4px 0; }
    .category-body.hidden { display: none; }

    /* Slider row */
    .param-row {
      padding: 4px 20px; display: flex; flex-direction: column; gap: 2px;
    }
    .param-row:hover { background: #1a1a28; }
    .param-label {
      display: flex; justify-content: space-between; align-items: center;
    }
    .param-label span { font-size: 11px; color: #9898a8; }
    .param-label .param-val {
      font-size: 10px; color: #e94560; font-family: 'SF Mono', monospace; min-width: 36px; text-align: right;
    }
    .slider-row { display: flex; align-items: center; gap: 6px; }
    input[type="range"] {
      flex: 1; height: 3px; -webkit-appearance: none; appearance: none;
      background: #2a2a3a; border-radius: 2px; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      border-radius: 50%; background: #e94560; cursor: pointer;
      border: 2px solid #1a1a28;
    }
    input[type="range"]::-webkit-slider-thumb:hover { background: #ff5a75; transform: scale(1.2); }
    .param-reset {
      width: 16px; height: 16px; border: none; background: none;
      color: #505060; cursor: pointer; font-size: 10px; padding: 0;
      border-radius: 3px; display: flex; align-items: center; justify-content: center;
    }
    .param-reset:hover { color: #e94560; background: #1e1e2e; }

    /* Presets */
    #presets {
      padding: 10px 20px; border-top: 1px solid #2a2a3a;
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .preset-btn {
      padding: 4px 10px; border-radius: 4px; font-size: 10px;
      background: #1e1e2e; border: 1px solid #2a2a3a; color: #9898a8;
      cursor: pointer;
    }
    .preset-btn:hover, .preset-btn.active { border-color: #e94560; color: #e94560; }

    /* Skin tones */
    #skin-tones {
      padding: 8px 20px 12px; border-top: 1px solid #2a2a3a;
      display: flex; gap: 8px; align-items: center;
    }
    .skin-label { font-size: 10px; color: #606070; text-transform: uppercase; letter-spacing: 0.5px; }
    .skin-btn {
      width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; transition: border-color 0.2s;
    }
    .skin-btn:hover, .skin-btn.active { border-color: #e94560; }

    /* 3D Canvas */
    #canvas-container { flex: 1; position: relative; }
    canvas { display: block; }

    /* View controls */
    #view-controls {
      position: absolute; top: 16px; right: 16px;
      display: flex; gap: 6px;
    }
    .view-btn {
      padding: 6px 12px; border-radius: 6px; font-size: 11px;
      background: rgba(18,18,26,0.8); border: 1px solid #2a2a3a;
      color: #9898a8; cursor: pointer; backdrop-filter: blur(8px);
    }
    .view-btn:hover, .view-btn.active { border-color: #e94560; color: #e94560; }
  </style>
</head>
<body>
  <div id="panel">
    <div id="panel-header">
      <h1>Face Parameters</h1>
      <button id="reset-all">Reset All</button>
    </div>
    <div id="upload-area">
      <input type="file" id="photo-input" accept="image/*" hidden />
      <button id="upload-btn">Upload Photo to Analyze Face</button>
      <div id="upload-preview" class="hidden">
        <img id="preview-img" />
        <div id="upload-status"></div>
      </div>
    </div>
    <div id="search-box">
      <input type="text" placeholder="Search parameters..." id="search-input" />
    </div>
    <div id="controls"></div>
    <div id="presets">
      <button class="preset-btn active" data-preset="photo">Photo Match</button>
      <button class="preset-btn" data-preset="default">Default</button>
      <button class="preset-btn" data-preset="wide">Wide</button>
      <button class="preset-btn" data-preset="thin">Thin</button>
      <button class="preset-btn" data-preset="round">Round</button>
      <button class="preset-btn" data-preset="angular">Angular</button>
      <button class="preset-btn" data-preset="random">Random</button>
    </div>
    <div id="skin-tones">
      <span class="skin-label">Skin</span>
      <button class="skin-btn active" data-tone="fair-asian" style="background:#EBBFAA"></button>
      <button class="skin-btn" data-tone="pale" style="background:#F2D8CF"></button>
      <button class="skin-btn" data-tone="medium" style="background:#D9B89E"></button>
      <button class="skin-btn" data-tone="tan" style="background:#B88B6B"></button>
      <button class="skin-btn" data-tone="dark" style="background:#73524A"></button>
    </div>
  </div>
  <div id="canvas-container">
    <div id="view-controls">
      <button class="view-btn active" data-mode="solid">Solid</button>
      <button class="view-btn" data-mode="wireframe">Wireframe</button>
      <button class="view-btn" data-mode="both">Both</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
