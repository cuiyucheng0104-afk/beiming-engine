SPDX-License-Identifier = "MIT"

# ── 第三方风格库快照（只读，原样收录；以上游仓库的许可声明为准）──
# sy-style-100@e41dee31：上游 LICENSE 为 MIT（肖雄 XIAOXIONG），未对媒体另作声明
