precedence = "closest"
SPDX-FileCopyrightText = "2026 LemoLab"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "cases/licenses/XIAOXIONG-MIT.txt"
precedence = "closest"
SPDX-FileCopyrightText = "2026 肖雄 XIAOXIONG"
SPDX-License-Identifier = "MIT"

[[annotations]]
