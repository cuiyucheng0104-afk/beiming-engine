# 北冥仓库 · 持续集成：每个 PR、每次推 main 都跑；release.yml 打标签发布前也整套复用。
#   unit           Node 24 与 22、Python 3.12：npm test（tests/**、tools/ 下的测试与 casebook 的 unittest）
#   check          npm run check -- --skip tests：仓库规范、工程计划、风格索引、案例库、导演规范、语法、更新日志，外加只报告的 lint
#   smoke-render   无显卡（SwiftShader 软件 WebGL）：渲染相关测试、A / C 模版小尺寸出片、B 模版资产桥、《北冥》与 lab 静帧、金标准比对或首次采集
#   windows-paths  windows-latest + PowerShell、去掉 Git Bash：npm test、npm run check、目录联接与中文路径、GBK 管道
# 本机复现每个 job 的命令见 tests/ci/README.md。actions 一律固定到提交哈希（注释是对应版本），dependabot 每周提更新。
# 分支保护建议的必需检查：unit (Node 24)、unit (Node 22)、check、smoke-render；windows-paths 在仓库变量 BEIMING_WINDOWS_REQUIRED=true 之前不阻塞。
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 要检查的提交、分支或标签（release.yml 传入标签）
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.ref || 'self' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_PYTHON_VERSION_WARNING: '1'
  TZ: UTC

jobs:
  unit:
    name: unit (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - id: py
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*
      - name: 安装 Node 依赖（按 package-lock.json）
        run: npm ci
      - name: 安装 Python 依赖（有 requirements.lock 时按哈希装）
        run: |
          if [ -f requirements.lock ]; then python -m pip install --require-hashes -r requirements.lock
          else python -m pip install -r requirements.txt; fi
      - name: 测试（npm test）
        env:
          BEIMING_PY: ${{ steps.py.outputs.python-path }}
        run: npm test -- --report out/ci/unit-node${{ matrix.node }}.json
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-node${{ matrix.node }}
          path: out/ci/
          if-no-files-found: ignore
          retention-days: 14

  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - id: py
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*
            tests/ci/requirements-lint.txt
      - name: 安装 Node 依赖（按 package-lock.json；含 eslint 等开发依赖）
        run: npm ci
      - name: 安装 ruff（按哈希固定，只用于 lint 报告）
        run: python -m pip install --require-hashes -r tests/ci/requirements-lint.txt
      - name: 检查（npm run check，测试在 unit job 里跑）
        env:
          BEIMING_PY: ${{ steps.py.outputs.python-path }}
        run: npm run check -- --skip tests --report out/ci/check.json
      - name: 上传检查报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check
          path: out/ci/
          if-no-files-found: ignore
          retention-days: 14

  smoke-render:
    name: smoke-render
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # 没有显卡：Chrome 的 WebGL 走 ANGLE + SwiftShader；金标准的平台键是 linux-swiftshader
      BEIMING_ANGLE: swiftshader
      # FFmpeg ≥ 7（D09）：BtbN 的月末静态构建会长期保留，按 sha256 校验；Ubuntu 24.04 自带的是 6.1，不满足要求
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1.tar.xz
      FFMPEG_SHA256: 97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - id: py
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*
      - name: 安装 Node 依赖（按 package-lock.json）
        run: npm ci
      - name: 安装 Python 依赖（有 requirements.lock 时按哈希装）
        run: |
          if [ -f requirements.lock ]; then python -m pip install --require-hashes -r requirements.lock
          else python -m pip install -r requirements.txt; fi
      - name: 缓存 FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/beiming-ffmpeg
          key: ffmpeg-linux64-${{ env.FFMPEG_SHA256 }}
      - name: 安装 FFmpeg（静态构建，校验 sha256）
        run: |
          dir="$HOME/.cache/beiming-ffmpeg"
          if [ ! -x "$dir/bin/ffmpeg" ]; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" "$FFMPEG_URL"
            echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
            mkdir -p "$dir"
            tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$dir" --strip-components=1
            rm -f "$RUNNER_TEMP/ffmpeg.tar.xz"
          fi
          echo "$dir/bin" >> "$GITHUB_PATH"
          "$dir/bin/ffmpeg" -hide_banner -version | head -n 1
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 安装 Chrome headless shell（playwright-core 锁定版本自带的那一版）与系统依赖
        run: ./node_modules/.bin/playwright-core install --with-deps chromium-headless-shell
      - name: 渲染相关测试（P04 失败夹具、P08 金标准等需要浏览器的域；尚未合入的域跳过）
        env:
          BEIMING_PY: ${{ steps.py.outputs.python-path }}
        run: node tools/run-tests.mjs --only render,golden --if-present --require browser,ffmpeg --report out/ci/render-tests.json
      - name: 冒烟出片与金标准（tests/ci/smoke-render.mjs）
        env:
          BEIMING_PY: ${{ steps.py.outputs.python-path }}
        run: node tests/ci/smoke-render.mjs --out out/ci/smoke --report out/ci/smoke/report.json
      - name: 上传冒烟产物（成片、静帧、接触印、报告）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-render
          path: |
            out/ci/
            !out/ci/smoke/golden-capture/
          if-no-files-found: ignore
          retention-days: 14
      # 只在 tests/golden/linux-swiftshader/manifest.json 还不存在时产生：下载后在仓库根目录解开，按 tests/ci/README.md 提交清单
      - name: 上传金标准首次采集结果
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-capture-linux-swiftshader
          path: out/ci/smoke/golden-capture/
          if-no-files-found: ignore
          retention-days: 30

  windows-paths:
    name: windows-paths
    runs-on: windows-latest
    timeout-minutes: 20
    # 已知问题（缺 .gitattributes、new-film 经链接调用静默无操作、Python 入口不是 UTF-8 输出）修好之前不阻塞合入；
    # 修好并转绿后，把仓库变量 BEIMING_WINDOWS_REQUIRED 设为 true，并在分支保护里加为必需检查。
    continue-on-error: ${{ vars.BEIMING_WINDOWS_REQUIRED != 'true' }}
    defaults:
      run:
        shell: pwsh
    steps:
      # 按 Windows 开发机的默认设置检出（runner 的 core.autocrlf=true），用来暴露换行问题
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - id: py
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*
      - name: 安装 Node 依赖（按 package-lock.json）
        run: npm ci
      - name: 安装 Python 依赖（有 requirements.lock 时按哈希装）
        run: |
          if (Test-Path requirements.lock) { python -m pip install --require-hashes -r requirements.lock }
          else { python -m pip install -r requirements.txt }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 去掉 Git Bash（模拟工作站上只有 PowerShell 的环境；git.exe 仍可用）
        run: |
          $keep = $env:PATH -split ';' | Where-Object { $_ -and $_ -notmatch '\\Git\\(usr\\)?bin\\?$' }
          "PATH=$($keep -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # PowerShell 调 npm.ps1 时会吞掉单独的 --，参数传不到脚本里，所以这里直接用 node 调入口（与 npm test / npm run check 等价）
      - name: 测试（= npm test）
        env:
          BEIMING_PY: ${{ steps.py.outputs.python-path }}
        run: node tools/run-tests.mjs --report out/ci/windows-unit.json
      - name: 检查（= npm run check，不依赖 sh）
        if: always()
        env:
          BEIMING_PY: ${{ steps.py.outputs.python-path }}
        run: node tools/check-all.mjs --skip tests --report out/ci/windows-check.json
      - name: 路径与编码（目录联接、中文与空格路径、GBK 管道）
        if: always()
        env:
          BEIMING_PY: ${{ steps.py.outputs.python-path }}
        run: node tests/ci/windows-paths.mjs --report out/ci/windows-paths.json
      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-paths
          path: out/ci/
          if-no-files-found: ignore
          retention-days: 14
