# 北冥仓库 · 持续集成：每个 PR、每次推 main 都跑；release.yml 打标签发布前整套复用（workflow_call）。
#   unit           Node 24 与 22、Python 3.12，不装浏览器与 FFmpeg：node tools/run-tests.mjs（= npm test）。
#                  需要浏览器 / FFmpeg 的测试在这里自己跳过，到 smoke-render 里跑。
#   check          node tools/check-all.mjs --skip tests（= npm run check，测试在 unit 里跑）：仓库规范、工程计划、风格索引、案例库、
#                  导演规范、语法、更新日志；eslint 与 ruff 只报告告警数、不阻塞。
#   smoke-render   无显卡（SwiftShader 软件 WebGL）+ FFmpeg 8 + 锁定版本的 headless shell：
#                  ① 全部测试再跑一遍（这次浏览器与 FFmpeg 都在，渲染失败夹具、GPU 回归、混音测试都会真跑）；
#                  ② tests/ci/smoke-render.mjs：A / C 模版小尺寸出片并核对规格，B 模版资产桥导出并核对可复现，
#                     《北冥》与 lab 静帧，与 linux-swiftshader 金标准比对（还没有清单时首次采集并上传工件）。
#   env-smoke      Linux、macOS、Windows 三平台：按锁文件一键装环境（tools/env/setup.mjs）并跑环境自检（tools/env/doctor.mjs）。
#   windows-paths  Windows Server 2025 + PowerShell、去掉 Git Bash：测试、检查、目录联接与中文路径、GBK 管道。
# 每个 job 在本机怎么复现、金标准首次采集后怎么提交清单、已知问题与隔离项：见 tests/ci/README.md。
# 命令一律直接写 node <路径>，不经 npm 脚本（npm 脚本由集成负责人登记，名字变了也不影响 CI）。
# actions 固定到提交哈希（行尾注释是对应版本，2026-11-10 核对过是各自的最新正式版）；dependabot 每周提更新。
# 分支保护建议的必需检查：unit (Node 24)、unit (Node 22)、check、smoke-render；windows-paths、env-smoke 分别在仓库变量
# BEIMING_WINDOWS_REQUIRED、BEIMING_ENV_SMOKE_REQUIRED 设为 true 之前不阻塞（开分支保护是仓库设置，由维护者操作）。
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 要检查的提交、分支或标签（release.yml 传入标签）
        type: string
        required: false
        default: ''
      stills-size:
        description: 《北冥》与 lab 静帧的尺寸（release.yml 传 1920x1040 作发布附件）
        type: string
        required: false
        default: '384x208'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.ref || 'self' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_PYTHON_VERSION_WARNING: '1'
  TZ: UTC
  # FFmpeg ≥ 7（D09）：BtbN 每月最后一个自动构建长期保留，按 sha256 校验（数值取自 GitHub 资产摘要）；runner 镜像都不带 FFmpeg
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1.tar.xz
  FFMPEG_SHA256: 97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79
  FFMPEG_WIN_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-win64-gpl-8.1.zip
  FFMPEG_WIN_SHA256: 7b801cdd3a1a0bb54ae6f572187e68b4ed54f52086cfee133fab2180bfb429fa

jobs:
  unit:
    name: unit (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - id: py
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*
      - name: 安装 Node 依赖（按 package-lock.json）
        run: npm ci
      - name: 安装 Python 依赖（有 requirements.lock 时按哈希装）
        run: |
          if [ -f requirements.lock ]; then python -m pip install --require-hashes -r requirements.lock
          else python -m pip install -r requirements.txt; fi
      - name: 测试（= npm test）
        env:
          BEIMING_PY: ${{ steps.py.outputs.python-path }}
        run: node tools/run-tests.mjs --report out/ci/unit-node${{ matrix.node }}.json
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-node${{ matrix.node }}
          path: out/ci/
          if-no-files-found: ignore
          retention-days: 14

  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - id: py
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*
            tests/ci/requirements-lint.txt
      - name: 安装 Node 依赖（按 package-lock.json；登记了 eslint 等开发依赖时一并装上）
        run: npm ci
      - name: 安装 ruff（按哈希固定，只用于 lint 报告）
        run: python -m pip install --require-hashes -r tests/ci/requirements-lint.txt
      - name: 检查（= npm run check -- --skip tests）
        env:
          BEIMING_PY: ${{ steps.py.outputs.python-path }}
        run: node tools/check-all.mjs --skip tests --report out/ci/check.json
      - name: 上传检查报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check
          path: out/ci/
          if-no-files-found: ignore
          retention-days: 14

  smoke-render:
    name: smoke-render
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # 没有显卡：Chrome 的 WebGL 走 ANGLE + SwiftShader；金标准的平台键因此是 linux-swiftshader
      BEIMING_ANGLE: swiftshader
      # 渲染器 v2 默认拒绝软件渲染，这里显式放行（旧渲染器不认这个变量）
      BEIMING_GPU: software-ok
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - id: py
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*
      - name: 安装 Node 依赖（按 package-lock.json）
        run: npm ci
      - name: 安装 Python 依赖（有 requirements.lock 时按哈希装）
        run: |
          if [ -f requirements.lock ]; then python -m pip install --require-hashes -r requirements.lock
          else python -m pip install -r requirements.txt; fi
      - name: 缓存 FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/beiming-ffmpeg
          key: ffmpeg-linux64-${{ env.FFMPEG_SHA256 }}
      - name: 安装 FFmpeg（静态构建，校验 sha256）
        run: |
          set -euo pipefail
          dir="$HOME/.cache/beiming-ffmpeg"
          if [ ! -x "$dir/bin/ffmpeg" ]; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" "$FFMPEG_URL"
            echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
            mkdir -p "$dir"
            tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$dir" --strip-components=1
            rm -f "$RUNNER_TEMP/ffmpeg.tar.xz"
          fi
          echo "$dir/bin" >> "$GITHUB_PATH"
          "$dir/bin/ffmpeg" -hide_banner -version | head -n 1
      # A 路线的字体子集要锁定的 OFL 原始字体（约 24 MB，进 .cache/fonts，不进 git）；fetch.mjs 逐字节核对 sha256
      - name: 缓存字体
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fonts
          key: fonts-${{ hashFiles('fonts/fonts.lock.json') }}
      - name: 取锁定的 OFL 字体（= npm run fonts:fetch）
        run: node tools/fonts/fetch.mjs
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 安装 headless shell（playwright-core 锁定版本自带的那一版）与系统依赖
        run: ./node_modules/.bin/playwright-core install --with-deps chromium-headless-shell
      # R35 在 SwiftShader 下要 60 秒以上（3840×2080 再 2 倍超采样），超过测试里 page.goto 的 30 秒默认时限；
      # 已向 engine/look 的属主提请求，测试自己按软件渲染缩小尺寸后删掉这里的 --skip-grep（tests/ci/README.md「已知问题」）
      - name: 全部测试（浏览器与 FFmpeg 在场，软件渲染）
        env:
          BEIMING_PY: ${{ steps.py.outputs.python-path }}
        run: >-
          node tools/run-tests.mjs --require browser,ffmpeg,python
          --skip-grep "R35 墨线：宽线"
          --report out/ci/render-tests.json
      - name: 冒烟出片与金标准（tests/ci/smoke-render.mjs）
        if: always()
        env:
          BEIMING_PY: ${{ steps.py.outputs.python-path }}
          STILLS_SIZE: ${{ inputs.stills-size || '384x208' }}
        run: node tests/ci/smoke-render.mjs --out out/ci/smoke --size-beiming "$STILLS_SIZE" --timeout 1200 --report out/ci/smoke/report.json
      - name: 上传冒烟产物（成片、静帧、接触印、报告）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-render
          path: |
            out/ci/
            !out/ci/smoke/golden-capture/
          if-no-files-found: ignore
          retention-days: 14
      # 只在 tests/golden/linux-swiftshader/manifest.json 还不存在时产生：在仓库根目录用
      #   gh run download <run-id> -n golden-capture-linux-swiftshader -D .
      # 取回，按 tests/ci/README.md「金标准首次采集」只提交清单
      - name: 上传金标准首次采集结果
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-capture-linux-swiftshader
          path: out/ci/smoke/golden-capture/
          if-no-files-found: ignore
          retention-days: 30

  # 三平台按锁文件装环境、跑环境自检（tools/env 是环境工作包的入口，还没合入时这两步跳过，job 照样绿）
  env-smoke:
    name: env-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # 环境自检第一次在三平台跑通之前不阻塞；转绿后把仓库变量 BEIMING_ENV_SMOKE_REQUIRED 设为 true
    continue-on-error: ${{ vars.BEIMING_ENV_SMOKE_REQUIRED != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: 安装 Node 依赖（按 package-lock.json）
        run: npm ci
      - name: 一键装环境（= npm run setup）
        if: hashFiles('tools/env/setup.mjs') != ''
        run: node tools/env/setup.mjs
      # setup.mjs 不装系统工具：FFmpeg 按环境自检给出的装法装。Linux、Windows 用与 smoke-render 同一版 BtbN 静态构建并核对 sha256，macOS 用 Homebrew
      - name: 安装 FFmpeg（Linux）
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: 安装 FFmpeg（macOS）
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: 安装 FFmpeg（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          curl.exe -fsSL --retry 3 -o $zip $env:FFMPEG_WIN_URL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:FFMPEG_WIN_SHA256) { throw 'FFmpeg 压缩包的 sha256 与锁定值不符' }
          $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive $zip -DestinationPath $dir
          $exe = Get-ChildItem $dir -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $exe.FullName -hide_banner -version | Select-Object -First 1
      - name: 环境自检（= npm run env:doctor，A 与 C 路线；B 路线要原生运行时，CI 上没有）
        if: hashFiles('tools/env/doctor.mjs') != ''
        run: |
          mkdir -p out/ci
          rc=0
          node tools/env/doctor.mjs --route a --json > out/ci/doctor-a.json || rc=$?
          node tools/env/doctor.mjs --route c --json > out/ci/doctor-c.json || rc=$?
          exit $rc
      - name: 上传自检结果
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: env-smoke-${{ matrix.os }}
          path: out/ci/
          if-no-files-found: ignore
          retention-days: 14

  windows-paths:
    name: windows-paths
    runs-on: windows-2025
    timeout-minutes: 25
    # 这个 job 转绿之后，把仓库变量 BEIMING_WINDOWS_REQUIRED
    # 设为 true，并在分支保护里加为必需检查。
    continue-on-error: ${{ vars.BEIMING_WINDOWS_REQUIRED != 'true' }}
    defaults:
      run:
        shell: pwsh
    steps:
      # 按 Windows 开发机的默认设置检出（runner 的 core.autocrlf=true），用来核对 .gitattributes 是否让文本保持 LF
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - id: py
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*
      - name: 安装 Node 依赖（按 package-lock.json）
        run: npm ci
      - name: 安装 Python 依赖（有 requirements.lock 时按哈希装）
        run: |
          if (Test-Path requirements.lock) { python -m pip install --require-hashes -r requirements.lock }
          else { python -m pip install -r requirements.txt }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 去掉 Git Bash（模拟工作站上只有 PowerShell 的环境；git.exe 仍可用）
        run: |
          $keep = $env:PATH -split ';' | Where-Object { $_ -and $_ -notmatch '\\Git\\(usr\\)?bin\\?$' }
          "PATH=$($keep -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 确认 sh 已不在 PATH 里
        run: |
          $sh = Get-Command sh -ErrorAction SilentlyContinue
          if ($sh) { Write-Output "::warning title=sh 仍在 PATH 里::$($sh.Source)" } else { Write-Output 'sh 不在 PATH 里（与只有 PowerShell 的工作站一致）' }
      # PowerShell 调 npm.ps1 时会吞掉单独的 --，参数传不到脚本里，所以直接用 node 调入口（与 npm test / npm run check 等价）
      - name: 测试（= npm test）
        env:
          BEIMING_PY: ${{ steps.py.outputs.python-path }}
        run: node tools/run-tests.mjs --report out/ci/windows-unit.json
      - name: 检查（= npm run check，不依赖 sh）
        if: always()
        env:
          BEIMING_PY: ${{ steps.py.outputs.python-path }}
        run: node tools/check-all.mjs --skip tests --report out/ci/windows-check.json
      - name: 路径与编码（目录联接、中文与空格路径、GBK 管道）
        if: always()
        env:
          BEIMING_PY: ${{ steps.py.outputs.python-path }}
        run: node tests/ci/windows-paths.mjs --report out/ci/windows-paths.json
      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-paths
          path: out/ci/
          if-no-files-found: ignore
          retention-days: 14
