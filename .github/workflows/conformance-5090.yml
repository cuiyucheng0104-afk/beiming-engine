# 北冥仓库 · 帧源一致性 5090 门（I6）：帧源一致性套件在 RTX 5090 自托管运行器上跑，限 10 分钟。
#   pull_request      filter（托管 runner，限 5 分钟）用 tests/ci/conformance-filter.mjs 判定这个 PR 改没改帧源与一致性边界
#                     （beiming/sources、host、kernel/conformance、kernel/contracts/{source,meta}、calib）；
#                     改了、且仓库变量 BEIMING_5090_RUNNER 为 true，才把 conformance-5090 排进显卡队；没改帧源的 PR 不占显卡。
#                     只认同仓分支的 PR：fork 来的 PR 不在自托管机器上跑（不受信的代码）。
#   schedule / workflow_dispatch / workflow_call   夜间流水：exam（考试）→ conformance-5090（限 10 分钟）→ nightly-rebuild（夜间重建）。
#                     workflow_call 默认 mode=nightly：即使调用方是 PR 也走夜间链；mode=pr 才走 PR 的 filter 分支。
#   「PR 分支」= 直接由 pull_request 触发（没有 inputs，from_call 为假），或 workflow_call 显式传 mode=pr；
#                     从 PR 调用 workflow_call 时 github.event_name 也是 pull_request，靠 from_call 哨兵区分，mode 传空串也走夜间链。
# 显卡队：concurrency group gpu-5090、不取消进行中的任务。只有 conformance-5090 进这个组（同组最多一个运行、一个排队，多放会互相挤掉）。
# exam 与 nightly-rebuild 的入口还没合入：用 hashFiles 守着，缺入口时只打一条提示。本机复现见 tests/ci/README.md。
# actions 的哈希与 ci.yml 保持一致（tests/ci/workflows.test.mjs 核对）。
name: conformance-5090

on:
  pull_request:
  schedule:
    - cron: '0 18 * * *'   # 北京时间每天 02:00
  workflow_dispatch:
  workflow_call:
    inputs:
      mode:
        description: nightly（考试 → 一致性 → 夜间重建）或 pr（先判定是否改到帧源）
        type: string
        default: nightly
      from_call:
        description: 内部哨兵，调用方不要传：workflow_call 下恒为 true，直接 pull_request 触发时没有 inputs（为 false）
        type: boolean
        required: false
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  filter:
    if: ((github.event_name == 'pull_request' && !inputs.from_call) || (inputs.from_call && inputs.mode == 'pr'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frame_sources_changed: ${{ steps.classify.outputs.frame_sources_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: 判定是否改到帧源（三点差异看整个 PR；-z 保住中文与制表符路径；--no-renames：移出帧源目录的旧路径也算）
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff -z --name-only --no-renames "$BASE_SHA...$HEAD_SHA" | node tests/ci/conformance-filter.mjs --null >> "$GITHUB_OUTPUT"

  exam:
    if: >-
      !((github.event_name == 'pull_request' && !inputs.from_call) || (inputs.from_call && inputs.mode == 'pr'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: 考试
        if: hashFiles('beiming/bench/exam.mjs') != ''
        run: npm ci && node beiming/bench/exam.mjs
      - name: 考试入口未合入
        if: hashFiles('beiming/bench/exam.mjs') == ''
        run: echo "::notice::beiming/bench/exam.mjs 还没有合入，考试这一步跳过"

  conformance-5090:
    needs: [filter, exam]
    if: >-
      !cancelled() && vars.BEIMING_5090_RUNNER == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (
      (((github.event_name == 'pull_request' && !inputs.from_call) || (inputs.from_call && inputs.mode == 'pr')) && needs.filter.outputs.frame_sources_changed == 'true') ||
      (!((github.event_name == 'pull_request' && !inputs.from_call) || (inputs.from_call && inputs.mode == 'pr')) && needs.exam.result == 'success'))
    runs-on: [self-hosted, linux, x64, rtx5090]
    timeout-minutes: 10
    concurrency:
      group: gpu-5090
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: 安装 Node 依赖（按 package-lock.json）
        run: npm ci
      - name: 确认无头浏览器可用（缺了实渲测试会自己跳过，不能当绿灯）
        run: node --input-type=module -e "const { browserOk } = await import('./tests/ci/browser.mjs'); if (!browserOk) { console.error('::error::5090 运行器上没有无头浏览器'); process.exit(3); }"
      - name: 真起停一次 three 帧源（只有空的浏览器目录时上一步也会过，render.test.mjs 起不来就跳过）
        run: node --input-type=module -e "const { startSource } = await import('./beiming/host/page/host.mjs'); try { const s = await startSource(); await s.stop(); } catch (e) { console.error('::error::5090 运行器上起不了 three 帧源：' + e.message); process.exit(3); }"
      - name: 帧源一致性套件、校准检查与帧源实渲测试（three 实渲测试起不了帧源会 t.skip、退出码照样 0：由 Node 核对 TAP 报告 0 跳过，否则 exit 3）
        run: |
          set -eo pipefail
          node --test 'beiming/kernel/conformance/*.test.mjs' 'beiming/calib/*.test.mjs' 'beiming/sources/blender/*.test.mjs' 'beiming/host/page/*.test.mjs'
          # 不用 tee / grep：缺命令（127）或文件读不了（2）会被 if grep 当成「没有跳过」放行。只靠 node：读不到、没有用例、有跳过都不过
          TAP="${RUNNER_TEMP:-/tmp}/conformance-5090-three.tap"
          rc=0
          node --test --test-reporter=tap 'beiming/sources/three/*.test.mjs' > "$TAP" || rc=$?
          TAP="$TAP" node --input-type=module -e "import fs from 'node:fs'; const tap = fs.readFileSync(process.env.TAP, 'utf8'); process.stdout.write(tap); if (!/^# tests [1-9]/m.test(tap) || /^# skipped [1-9]/m.test(tap) || /# SKIP\b/.test(tap)) { console.error('::error::5090 上 three 实渲测试有被跳过或未产出有效 TAP，不能当绿灯'); process.exit(3); }"
          test "$rc" -eq 0 || exit "$rc"

  nightly-rebuild:
    needs: conformance-5090
    # 不写状态函数会被套上隐式 success()，夜间链里祖先 filter 是 skipped，会连带跳过：显式 !cancelled() 并直接看一致性的结果
    if: >-
      !cancelled() && needs['conformance-5090'].result == 'success' &&
      !((github.event_name == 'pull_request' && !inputs.from_call) || (inputs.from_call && inputs.mode == 'pr')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, rtx5090]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: 夜间重建
        if: hashFiles('tools/nightly/rebuild.mjs') != ''
        run: npm ci && node tools/nightly/rebuild.mjs
      - name: 夜间重建入口未合入
        if: hashFiles('tools/nightly/rebuild.mjs') == ''
        run: echo "::notice::tools/nightly/rebuild.mjs 还没有合入，夜间重建这一步跳过"
