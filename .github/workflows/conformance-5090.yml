# 北冥仓库 · 帧源一致性 5090 门（I6）：帧源一致性套件在 RTX 5090 自托管运行器上跑，限 10 分钟。
#   pull_request      filter（托管 runner，限 5 分钟）用 tests/ci/conformance-filter.mjs 判定这个 PR 改没改帧源与一致性边界
#                     （beiming/sources、host、kernel/conformance、kernel/contracts/{source,meta}、calib）；
#                     改了、且仓库变量 BEIMING_5090_RUNNER 为 true，才把 conformance-5090 排进显卡队；没改帧源的 PR 不占显卡。
#   schedule / workflow_dispatch / workflow_call   夜间流水：exam（考试）→ conformance-5090（限 10 分钟）→ nightly-rebuild（夜间重建）。
# 显卡队：concurrency group gpu-5090、不取消进行中的任务。只有 conformance-5090 进这个组（同组最多一个运行、一个排队，多放会互相挤掉）。
# exam 与 nightly-rebuild 的入口还没合入：用 hashFiles 守着，缺入口时只打一条提示。本机复现见 tests/ci/README.md。
# actions 的哈希与 ci.yml 保持一致（tests/ci/workflows.test.mjs 核对）。
name: conformance-5090

on:
  pull_request:
  schedule:
    - cron: '0 18 * * *'   # 北京时间每天 02:00
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  filter:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frame_sources_changed: ${{ steps.classify.outputs.frame_sources_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: 判定是否改到帧源（--no-renames：移出帧源目录的旧路径也算）
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" | node tests/ci/conformance-filter.mjs >> "$GITHUB_OUTPUT"

  exam:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: 考试
        if: hashFiles('beiming/bench/exam.mjs') != ''
        run: npm ci && node beiming/bench/exam.mjs
      - name: 考试入口未合入
        if: hashFiles('beiming/bench/exam.mjs') == ''
        run: echo "::notice::beiming/bench/exam.mjs 还没有合入，考试这一步跳过"

  conformance-5090:
    needs: [filter, exam]
    if: >-
      !cancelled() && vars.BEIMING_5090_RUNNER == 'true' && (
      (github.event_name == 'pull_request' && needs.filter.outputs.frame_sources_changed == 'true') ||
      (github.event_name != 'pull_request' && needs.exam.result == 'success'))
    runs-on: [self-hosted, linux, x64, rtx5090]
    timeout-minutes: 10
    concurrency:
      group: gpu-5090
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: 安装 Node 依赖（按 package-lock.json）
        run: npm ci
      - name: 帧源一致性套件与校准检查
        run: node --test 'beiming/kernel/conformance/*.test.mjs' 'beiming/calib/*.test.mjs'

  nightly-rebuild:
    needs: conformance-5090
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, rtx5090]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 夜间重建
        if: hashFiles('tools/nightly/rebuild.mjs') != ''
        run: npm ci && node tools/nightly/rebuild.mjs
      - name: 夜间重建入口未合入
        if: hashFiles('tools/nightly/rebuild.mjs') == ''
        run: echo "::notice::tools/nightly/rebuild.mjs 还没有合入，夜间重建这一步跳过"
