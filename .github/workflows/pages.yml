name: pages

on:
  push:
    branches: [main]
    paths:
      - 'cases/catalog.json'
      - 'cases/previews/**'
      - 'tools/build-showcase.py'
      - 'showcase/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build case atlas
        run: python tools/build-showcase.py --out _site/index.html --poster-prefix cases/ --media-prefix media/
      - name: Assemble site
        run: |
          mkdir -p _site/cases _site/media
          cp -r cases/previews _site/cases/previews
          cp media/shot_1.6.jpg _site/media/shot_1.6.jpg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
