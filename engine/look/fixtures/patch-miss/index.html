<!doctype html>
<!-- engine/look 的构建失败夹具（FX22：片段补丁没命中算构建失败）。一张能正常出片的最小影片页面：卡通材质 + 完整后期链。
     ?corrupt=<改法> 在建材质之前把 three 的一段着色器原文改掉（改法见 engine/look/r187-look-regression.scene.mjs 的 CORRUPTIONS），
     ?when= 决定补丁没命中的错误从哪里冒出来：
       load（默认）  置 READY 之前预热一帧时抛（等同 film.run 的 warm）
       frame         render(t) 里抛
       console       render(t) 里被页面自己接住，只打到控制台（渲染器也必须判失败，不能出一张缺补丁的图）
       swallow       render(t) 里被页面自己接住，什么都不打，照常画一张回退帧（渲染器靠 patch.js 记下的致命状态判失败）
     ?late=<毫秒 | raf>（不用带 corrupt）render(t) 照常画完、返回之后（隔这么多毫秒，或等到下一个动画帧）才调真实的 inject 去找一个没有的锚点，
       页面接住、画一张回退帧：错冒出来时渲染器出帧前那一次读记录已经过了，截图之后还得再读一次。
     ?probe=id-callback（不用带 corrupt）加一个物体，它的 onBeforeRender 只在换上 ID 材质时调真实的 inject 去找一个没有的锚点：
       ID 图不能把这个错吞掉。
     ?patch=<模块地址> probe 用的 inject 改从这个地址导入（默认 /engine/shade/patch.js）。地址带 #片段、或是同一个文件的另一种写法
       （patch%2Ejs）时，浏览器另起一个模块实例，错记在那个实例里。blob / data 导入原文；frame-blob / frame-other 用同源 iframe 为原文或等长异文创建地址，主文档导入后注销。
     ?pars=<block | line | dead | hide-splice | hide-unroll | off | dead-only> 材质的片元参数（fragmentPars）里先提到投影块的 #include：block 写在块注释里、
       line 写在行注释里、dead 写在预处理死分支里（补丁照样要落在原来那一条上，出的图与不带参数时一样）；
       hide-splice / hide-unroll 在死分支里把片元补丁要找的几处原文全写一遍，再把后面原来的那几处盖住（前者用一段带行续接的合法注释
       「/* *\换行/」，后者把「/*」放进 three 会整段删掉的 0 次循环里）：补丁不能落进死分支，要么构建失败、要么图与正常帧相同；
       off 注释掉生效的投影锚点。dead-only 用 expr 选择锚点所在的死分支（0、1、comment、endif）或零次循环（unroll），生效路径展开原始投影块。
     ?junk=1 赶在 patch.js 之前往渲染器的登记口塞只回空消息的读出口（直接塞函数、塞一个自造模块的地址）：挡不住后面真的补丁错。
     ?csp=1 页面给自己加一条 CSP（connect-src 'none'，在取好 ?patch=blob 的原文之后）：页面里取不到任何地址的源码，patch.js 换个地址
       （#片段、//patch.js、blob:）另起的实例记的错照样要读到（渲染器在自己这边按响应内容认模块）。
     ?three=187 换成 r187 那一套（可选依赖 three-webgpu = three@0.187.0），默认 r170。
     ?mute=1 页面把 console.error 静音（配 when=swallow：页面接住异常、什么都打不出来，渲染器只能靠 patch.js 模块里记下的致命状态）。
     ?forge=1 着色器一切正常，页面往 globalThis[Symbol.for('beiming.shaderPatchErrors')] 塞一条合成记录、往 console.error 打一行带机器前缀的字、
       再往渲染器的登记口塞合成的读出口（直接塞函数、函数配假地址、函数配真的 patch.js 地址、自造一个报错模块的 data: 地址、
       页面没加载过的 …/shade/patch.js 地址）：
       都不是 patch.js 记的，不能判失败。
     ?log=1 打两句与着色器无关、却带着「变体对不上了」字样的作品日志（console.info / console.warn）：不能被当成补丁没命中。
     期望：不带 corrupt / probe 时渲染器正常出图、退出码 0（带 log=1 / forge=1 也一样）；带 corrupt 时各种 when 都以非零码退出，报错里点名缺的锚点。
     用法见 engine/look/r187-look-regression.test.mjs。 -->
<html><head><meta charset="utf-8"><title>夹具：片段补丁没命中</title>
<script>
// import map 要赶在头一个模块之前写进文档
const pkg = new URLSearchParams(location.search).get('three') === '187' ? 'three-webgpu' : 'three';
document.write(`<script type="importmap">{"imports":{"three":"/node_modules/${pkg}/build/three.module.js","three/addons/":"/node_modules/${pkg}/examples/jsm/"}}<\/script>`);
</script>
<style>html,body{margin:0;background:#000;overflow:hidden}</style>
</head><body>
<script type="module">
import * as THREE from 'three';
import { createLook } from '/engine/look/index.js';
import { build, corrupt, P_BASE } from '/engine/look/r187-look-regression.scene.mjs';

const q = new URLSearchParams(location.search), when = q.get('when') || 'load';
const sink = globalThis.__bmShadePatchSink, INC = '#include <shadowmap_pars_fragment>';
const FAKE = { fn: 'inject', anchor: '#include <color_fragment>', message: '[BEIMING_SHADER_PATCH_ERROR] QA synthetic, no shader call' };
const fakeCode = recs => `export const inject = { patchErrors: () => ${JSON.stringify(recs)} };`;
const fakeModule = recs => 'data:text/javascript,' + encodeURIComponent(fakeCode(recs));
let patchUrl = q.get('patch') ?? '/engine/shade/patch.js';
const inFrame = patchUrl === 'frame-blob' || patchUrl === 'frame-other';
if (inFrame || patchUrl === 'blob' || patchUrl === 'data') {
  const source = await (await fetch('/engine/shade/patch.js')).text();
  let creator = URL, body = source;
  if (inFrame) {
    const frame = document.createElement('iframe');
    frame.hidden = true;
    document.body.appendChild(frame);
    creator = frame.contentWindow.URL;
    if (patchUrl === 'frame-other') body = fakeCode([FAKE]).padEnd(new TextEncoder().encode(source).length);
  }
  patchUrl = patchUrl === 'data' ? 'data:text/javascript,' + encodeURIComponent(body) : creator.createObjectURL(new Blob([body], { type: 'text/javascript' }));
}
if (q.get('csp')) document.head.append(Object.assign(document.createElement('meta'), { httpEquiv: 'Content-Security-Policy', content: "connect-src 'none'" }));
if (q.get('junk')) { sink?.register(() => [{ message: '' }]); sink?.register(() => [{ message: '' }], location.href); sink?.register(fakeModule([{ message: '' }])); }
const { inject } = await import(patchUrl);
if (q.get('patch') === 'frame-other') sink?.register(patchUrl);
if (patchUrl.startsWith('blob:')) URL.revokeObjectURL(patchUrl);
const W = innerWidth, H = innerHeight;
if (q.get('mute')) console.error = () => {};
if (q.get('forge')) (globalThis[Symbol.for('beiming.shaderPatchErrors')] ??= []).push({ fn: 'inject', anchor: '#include <color_fragment>', message: '[BEIMING_SHADER_PATCH_ERROR] QA synthetic, no shader call' });
if (q.get('forge')) console.error('[BEIMING_SHADER_PATCH_ERROR] QA synthetic, no shader call');
if (q.get('forge')) {
  const fake = () => [FAKE], real = new URL('/engine/shade/patch.js#forge', location).href;
  sink?.register(fake); sink?.register(fake, 'http://127.0.0.1:1/engine/shade/patch.js'); sink?.register(fake, real); sink?.register(real); sink?.register(fakeModule([FAKE]));
  sink?.register(URL.createObjectURL(new Blob([fakeCode([FAKE])], { type: 'text/javascript' })));
  sink?.register(new URL('./shade/patch.js#never-loaded', location).href); sink?.register('http://example.com/shade/patch.js');   // 页面没加载过的地址：渲染器不去 import，不多发请求
}
const FAKES = `#if 0\n${INC}\n#include <color_fragment>\n#include <normal_fragment_maps>\nvec3 outgoingLight = reflectedLight.directDiffuse + reflectedLight.indirectDiffuse + totalEmissiveRadiance;\n#include <dithering_fragment>\n#endif\n`;
const PARS = { block: `/* ${INC} */\n`, line: `// ${INC}\n`, dead: `#if 0\n${INC}\n#endif\n`, 'hide-splice': FAKES + '/* *\\\n/\n',
  'hide-unroll': FAKES + '#pragma unroll_loop_start\nfor ( int i = 0; i < 0; i ++ ) {\n/*\n}\n#pragma unroll_loop_end\n' }[q.get('pars')];
if (q.get('pars') === 'dead-only') {
  const expr = q.get('expr'), chunk = THREE.ShaderChunk.shadowmap_pars_fragment;
  const condition = { '1': '(0x0 || 0)', comment: '1 /*\n*/ && 0', endif: '0\nfloat bmX; /*\n*/ #endif' }[expr] ?? '0';
  const replacement = expr === 'unroll' ? `#pragma unroll_loop_start\nfor ( int i = 0; i < 0; i ++ ) {\n${INC}\n}\n#pragma unroll_loop_end\n${chunk}` : `#if ${condition}\n${INC}\n#else\n${chunk}\n#endif`;
  THREE.ShaderLib.toon.fragmentShader = THREE.ShaderLib.toon.fragmentShader.replace(INC, () => replacement);
}
if (q.get('pars') === 'off') THREE.ShaderLib.toon.fragmentShader = THREE.ShaderLib.toon.fragmentShader.replace(INC, '// ' + INC);
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.REVISION === '170' ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap;   // r187 删掉了 PCFSoftShadowMap，采样核由 quantizeShadow 换回 r170 的
document.body.appendChild(renderer.domElement);
if (q.get('corrupt')) corrupt(q.get('corrupt'));
const look = createLook(renderer, W, H, { refHeight: H, fps: 24 });
let part = null;
const make = () => {
  const p = build(PARS ? { fragmentPars: PARS } : {});
  if (q.get('probe') === 'id-callback') {
    const probe = new THREE.Mesh(new THREE.BoxGeometry(.4, .4, .4), new THREE.MeshBasicMaterial({ color: '#ffffff' }));
    probe.position.set(0, 2.6, 2); probe.userData.outline = true;
    probe.onBeforeRender = (r, s, c, g, m) => { if (m.uniforms?.uBaseId) inject('void main(){}', '#include <color_fragment>', 'x', 'after', 's6-id-callback'); };
    p.scene.add(probe);
  }
  return p;
};
const draw = t => { part ??= make(); part.camera.aspect = W / H; part.camera.updateProjectionMatrix(); look.render(part.scene, part.camera, { ...P_BASE, t }); };
window.DUR = 1; window.FPS = window.__RENDER?.fps ?? 24;
window.render = t => {
  if (q.get('log')) { console.info('字幕变体对不上了，用默认字幕'); console.warn('字幕变体对不上了，用默认字幕'); }
  if (q.get('late')) {
    const miss = () => { try { inject('void main(){}', '#include <color_fragment>', 'x', 'after', 's6-late'); } catch { renderer.setRenderTarget(null); renderer.setClearColor('#7f8fc4'); renderer.clear(); } };
    draw(t); return void (q.get('late') === 'raf' ? requestAnimationFrame(miss) : setTimeout(miss, +q.get('late')));
  }
  if (when !== 'console' && when !== 'swallow') return draw(t);
  try { draw(t); } catch (e) { if (when === 'console') console.error(e.message); else { renderer.setRenderTarget(null); renderer.setClearColor('#7f8fc4'); renderer.clear(); } }
};
await look.ready;
if (when === 'load') draw(0);
window.READY = true;
</script>
</body></html>
